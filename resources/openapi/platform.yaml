          $ref: '#/components/responses/Forbidden'
        409:
          $ref: '#/components/responses/Conflict'
        422:
          $ref: '#/components/responses/UnprocessableEntity'
        429:
          $ref: '#/components/responses/TooManyRequests'
  '/platform/workspaces/{workspace_id}/status':
    put:
      tags:
        - Organizations
      summary: 'Suspend an organization (its people can no longer sign in, its environments stop serving) or reactivate it.'
      description: 'Requires scope `operator:workspaces:write` on an access token delegated by an active platform operator. No management key is accepted. Danger: critical.'
      operationId: admin_organizations_set_status
      x-action: admin.organizations.set_status
      x-scope: 'operator:workspaces:write'
      x-scope-aliases: []
      x-danger: critical
      x-action-aliases:
        - platform.workspaces.set_status
      parameters:
        -
          name: workspace_id
          in: path
          required: true
          schema:
            type: string
        -
          $ref: '#/components/parameters/IdempotencyKey'
        -
          $ref: '#/components/parameters/CboxApproval'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum:
                    - active
                    - suspended
              required:
                - status
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/PlatformOrganization'
        202:
          $ref: '#/components/responses/ApprovalRequired'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        409:
          $ref: '#/components/responses/Conflict'
        422:
          $ref: '#/components/responses/UnprocessableEntity'
        429:
          $ref: '#/components/responses/TooManyRequests'
components:
  securitySchemes:
    OperatorToken:
      type: http
      scheme: bearer
      description: 'An access token delegated by an active platform operator, carrying `operator:*` scopes. Management keys are refused.'
  parameters:
    CboxApproval:
      name: Cbox-Approval
      in: header
      required: false
      description: 'The id of an approval this request was held for, once the person approved it. Send it as the `202` gave it, `idapr_…` (an `apr_…` id from before 2026-11-26 is read until 2027-01-15) or the bare id. Spent by this request, once.'
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 'Any unique string (a UUID). A retry with the same key and request gets the first answer back.'
      schema:
        type: string
        maxLength: 255
  responses:
    SitesAssetsTransitionResult:
      description: 'Immutable historical result, not current permission to reopen Sites. Contains no bearer or client secret.'
      content:
        application/json:
          schema:
            type: object
            required:
              - data
            properties:
              data:
                type: object
                required:
                  - grant
                  - receipt
                properties:
                  grant:
                    type: object
                    additionalProperties: false
                    required:
                      - id
                      - organization_id
                      - consumer_client_id
                      - service
                      - audience
                      - scopes
                    properties:
                      id:
                        type: string
                      organization_id:
                        type: string
                      consumer_client_id:
                        type: string
                      service:
                        type: string
                        const: cbox_assets
                      audience:
                        type: string
                        const: 'https://api.cboxassets.com'
                      scopes:
                        type: array
                        items:
                          type: string
                        minItems: 4
                        maxItems: 4
                  receipt:
                    allOf:
                      -
                        $ref: '#/components/schemas/SitesAssetsTransitionPlan'
                      -
                        type: object
                        required:
                          - new_service_client_id
                          - approval_id
                          - audit_entry_id
                          - operator_id
                          - transitioned_at
                        properties:
                          new_service_client_id:
                            type: string
                          approval_id:
                            type: string
                          audit_entry_id:
                            type: string
                          operator_id:
                            type: string
                          transitioned_at:
                            type: string
                            format: date-time
    ApprovalRequired:
      description: "Held for a person's approval. Poll `approval.poll_url`, then repeat the same request with `Cbox-Approval`."
      content:
        application/json:
          schema:
            type: object
            required:
              - error
              - message
              - approval
            properties:
              error:
                type: string
                enum:
                  - approval_required
              message:
                type: string
              approval:
                type: object
                required:
                  - id
                  - status
                  - binding_code
                  - expires_at
                  - poll_url
                properties:
                  id:
                    type: string
                  status:
                    type: string
                  binding_code:
                    type: string
                  expires_at:
                    type: string
                    format: date-time
                  poll_url:
                    type: string
                    format: uri
    Unauthorized:
      description: 'No valid operator token. Management keys always get this.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: "The token's person is not an active platform operator, or the token lacks the required scope."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: 'No such organization, environment, organization or operator on this deployment.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: 'A request with this `Idempotency-Key` is still being processed (`idempotency_in_progress`). Retry shortly.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableEntity:
      description: |
        Validation failed (`error: validation_failed`, with a field-keyed `errors` map), or the
        request was refused for a domain reason — an address already an operator, a password
        the environment's policy rejects, the last active operator.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: "The token's rate limit for this API is exhausted."
      headers:
        Retry-After:
          description: 'Seconds to wait before retrying.'
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    SitesAssetsTransitionPlan:
      type: object
      required:
        - environment_id
        - organization_id
        - connection_id
        - consumer_client_id
        - provider_client_id
        - old_service_client_id
        - old_service_account_id
        - manifest_digest
        - expires_at
        - service
        - audience
        - old_scopes
        - new_scopes
        - plan_digest
      properties:
        environment_id:
          type: string
        organization_id:
          type: string
        connection_id:
          type: string
        consumer_client_id:
          type: string
        provider_client_id:
          type: string
        old_service_client_id:
          type: string
        old_service_account_id:
          type: string
        manifest_digest:
          type: string
          pattern: '^[a-f0-9]{64}$'
        plan_digest:
          type: string
          pattern: '^[a-f0-9]{64}$'
        expires_at:
          type: string
          format: date-time
        service:
          type: string
          const: cbox_assets
        audience:
          type: string
          const: 'https://api.cboxassets.com'
        old_scopes:
          type: array
          items:
            type: string
          minItems: 2
          maxItems: 2
        new_scopes:
          type: array
          items:
            type: string
          minItems: 4
          maxItems: 4
    SitesAssetsMigrationPlan:
      type: object
      additionalProperties: false
      required:
        - manifest_digest
        - environment_id
        - consumer_client_id
        - provider_client_id
        - organization_ids
        - evidence
        - expires_at
        - service
        - audience
        - scopes
      properties:
        manifest_digest:
          type: string
          maxLength: 64
        environment_id:
          type: string
        consumer_client_id:
          type: string
        provider_client_id:
          type: string
        organization_ids:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: string
        evidence:
          type: string
          maxLength: 300
        expires_at:
          type: string
          format: date-time
        service:
          type: string
        audience:
          type: string
        scopes:
          type: array
          maxItems: 2
          items:
            type: string
    ProvisionedWorkspace:
      type: object
      required:
        - id
        - name
        - owner
        - project_id
        - environment_id
        - owner_invited
      properties:
        id:
          type: string
        name:
          type: string
        owner:
          type: object
          required:
            - id
            - email
          properties:
            id:
              type: string
            email:
              type: string
              format: email
        project_id:
          type: string
          description: "The organization's first project."
        environment_id:
          type: string
          description: "That project's first environment."
        owner_invited:
          type: boolean
          description: 'Whether the owner was emailed a link to set their password.'
    PlatformOrganization:
      type: object
      required:
        - id
        - name
        - slug
        - type
        - status
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        type:
          type: string
          enum:
            - customer
            - reseller
        status:
          type: string
          enum:
            - active
            - suspended
            - deleted
        parent_id:
          type:
            - string
            - 'null'
        environment_id:
          type:
            - string
            - 'null'
          description: 'The environment it lives in.'
        created_at:
          type:
            - string
            - 'null'
          format: date-time
    PlatformEnvironment:
      type: object
      required:
        - id
        - name
        - slug
        - status
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        domain:
          type:
            - string
            - 'null'
          description: 'The verified domain it serves on — null until one is verified by DNS.'
        status:
          type: string
        project_id:
          type:
            - string
            - 'null'
          description: 'The project that owns it; null for one no customer owns yet.'
        created_at:
          type:
            - string
            - 'null'
          format: date-time
    ProvisionedEnvironment:
      type: object
      required:
        - environment_id
        - organization
        - admin
      properties:
        environment_id:
          type: string
        organization:
          $ref: '#/components/schemas/PlatformOrganization'
        admin:
          type: object
          required:
            - id
            - email
          properties:
            id:
              type: string
            email:
              type: string
              format: email
    PlatformOperator:
      type: object
      required:
        - id
        - email
        - status
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        name:
          type:
            - string
            - 'null'
        status:
          type: string
          enum:
            - active
            - suspended
        created_at:
          type:
            - string
            - 'null'
          format: date-time
    Error:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          description: 'Stable machine code'
        message:
          type: string
          description: 'Human-readable explanation'
        request_id:
          type: string
          description: 'The id this request was served under, also sent as the X-Request-Id header. Quote it when reporting a problem.'
        errors:
          type: object
          description: 'Present on `validation_failed` only — the offending fields, each mapped to its messages.'
          additionalProperties:
            type: array
            items:
              type: string
