components:
  securitySchemes:
    OperatorToken:
      type: http
      scheme: bearer
      description: 'An access token delegated by an active platform operator, carrying `operator:*` scopes. Management keys are refused.'
  parameters:
    CboxApproval:
      name: Cbox-Approval
      in: header
      required: false
      description: 'The id of an approval this request was held for, once the person approved it. Spent by this request, once.'
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 'Any unique string (a UUID). A retry with the same key and request gets the first answer back.'
      schema:
        type: string
        maxLength: 255
  responses:
    ApprovalRequired:
      description: "Held for a person's approval. Poll `approval.poll_url`, then repeat the same request with `Cbox-Approval`."
      content:
        application/json:
          schema:
            type: object
            required:
              - error
              - message
              - approval
            properties:
              error:
                type: string
                enum:
                  - approval_required
              message:
                type: string
              approval:
                type: object
                required:
                  - id
                  - status
                  - binding_code
                  - expires_at
                  - poll_url
                properties:
                  id:
                    type: string
                  status:
                    type: string
                  binding_code:
                    type: string
                  expires_at:
                    type: string
                    format: date-time
                  poll_url:
                    type: string
                    format: uri
    Unauthorized:
      description: 'No valid operator token. Management keys always get this.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: "The token's person is not an active platform operator, or the token lacks the required scope."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: 'No such workspace, environment, organization or operator on this deployment.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: 'A request with this `Idempotency-Key` is still being processed (`idempotency_in_progress`). Retry shortly.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableEntity:
      description: |
        Validation failed (`error: validation_failed`, with a field-keyed `errors` map), or the
        request was refused for a domain reason — an address already an operator, a password
        the environment's policy rejects, the last active operator.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: "The token's rate limit for this API is exhausted."
      headers:
        Retry-After:
          description: 'Seconds to wait before retrying.'
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    ProvisionedWorkspace:
      type: object
      required:
        - id
        - name
        - owner
        - project_id
        - environment_id
        - owner_invited
      properties:
        id:
          type: string
        name:
          type: string
        owner:
          type: object
          required:
            - id
            - email
          properties:
            id:
              type: string
            email:
              type: string
              format: email
        project_id:
          type: string
          description: "The workspace's first project."
        environment_id:
          type: string
          description: "That project's first environment."
        owner_invited:
          type: boolean
          description: 'Whether the owner was emailed a link to set their password.'
    PlatformOrganization:
      type: object
      required:
        - id
        - name
        - slug
        - type
        - status
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        type:
          type: string
          enum:
            - customer
            - reseller
        status:
          type: string
          enum:
            - active
            - suspended
            - deleted
        parent_id:
          type:
            - string
            - 'null'
        environment_id:
          type:
            - string
            - 'null'
          description: 'The environment it lives in.'
        created_at:
          type:
            - string
            - 'null'
          format: date-time
    PlatformEnvironment:
      type: object
      required:
        - id
        - name
        - slug
        - status
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        domain:
          type:
            - string
            - 'null'
          description: 'The verified domain it serves on — null until one is verified by DNS.'
        status:
          type: string
        project_id:
          type:
            - string
            - 'null'
          description: 'The project that owns it; null for one no customer owns yet.'
        created_at:
          type:
            - string
            - 'null'
          format: date-time
    ProvisionedEnvironment:
      type: object
      required:
        - environment_id
        - organization
        - admin
      properties:
        environment_id:
          type: string
        organization:
          $ref: '#/components/schemas/PlatformOrganization'
        admin:
          type: object
          required:
            - id
            - email
          properties:
            id:
              type: string
            email:
              type: string
              format: email
    PlatformOperator:
      type: object
      required:
        - id
        - email
        - status
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        name:
          type:
            - string
            - 'null'
        status:
          type: string
          enum:
            - active
            - suspended
        created_at:
          type:
            - string
            - 'null'
          format: date-time
    Error:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          description: 'Stable machine code'
        message:
          type: string
          description: 'Human-readable explanation'
        request_id:
          type: string
          description: 'The id this request was served under, also sent as the X-Request-Id header. Quote it when reporting a problem.'
        errors:
