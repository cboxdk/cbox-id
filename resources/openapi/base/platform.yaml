openapi: 3.1.0
info:
  title: Cbox ID — Operator API
  version: "1.0.0"
  description: |
    The **deployment itself**, for the staff who run it: stand up customer workspaces,
    create and bootstrap environments, manage organizations inside any environment, and
    keep the operator roster. Everything the console's Platform pages do, as the same
    actions — the same rules, refusals and audit trail.

    **Who may call it.** Only a platform OPERATOR, through an access token they delegated
    carrying the `operator:*` scope each operation names — the token the platform root
    issues them for its `/mcp` (`cbox login` at the root, or an agent signed in there). **No management key is accepted
    here** — not an environment key (`cbid_env_…`), not a workspace key (`cbid_ws_…`):
    those speak for a customer, and this API is the deployment above every customer. A
    token whose person is not an active operator is refused with `403`; anything else
    without a valid operator token gets `401`.

    **Scopes.** `operator:workspaces:write`, `operator:environments:write`,
    `operator:organizations:write`, `operator:operators:write` — split by blast radius, so
    a token that only onboards customers cannot add an operator.

    **Every write is critical.** Each one changes who can reach the deployment or a
    customer's people. Suspensions and reactivations take the state you want
    (`{"status": "suspended"}`), so a retry never undoes itself.

    **Idempotency.** A write takes an `Idempotency-Key` header: a retry with the same key
    and body gets the first answer back, marked `Idempotent-Replayed: true`, for 24 hours.

    **Envelope.** Every success returns `{ "data": … }`. Every error returns
    `{ "error": "<code>", "message": "<human message>" }` — validation failures add a
    field-keyed `errors` map.
servers:
  - url: https://api.cboxid.com/api/v1
    description: Hosted (platform-root host)
  - url: https://{host}/api/v1
    description: Self-hosted (the platform-root host)
    variables:
      host: { default: id.example.com }
security:
  - OperatorToken: []
tags:
  - name: Workspaces
    description: The customers on the deployment.
  - name: Environments
    description: Every environment on the deployment, whoever owns it.
  - name: Organizations
    description: Organizations inside any one environment.
  - name: Operators
    description: The people who run the deployment.
  - name: Approvals
    description: Where a held operation's approval stands.
paths:
  /platform/action-approvals/{id}:
    get:
      tags: [Approvals]
      summary: Where an approval you asked for stands
      description: |
        The `poll_url` of a `202 approval_required`: an approval this token raised, and only those — another token's id is a 404. `status` is `pending`, `approved`, `denied`, `expired` or `consumed`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [id, status]
                    properties:
                      id: { type: string }
                      status: { type: string, enum: [pending, approved, denied, expired, consumed] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

components:
  securitySchemes:
    OperatorToken:
      type: http
      scheme: bearer
      description: An access token delegated by an active platform operator, carrying `operator:*` scopes. Management keys are refused.
  parameters:
    CboxApproval:
      name: Cbox-Approval
      in: header
      required: false
      description: The id of an approval this request was held for, once the person approved it. Spent by this request, once.
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Any unique string (a UUID). A retry with the same key and request gets the first answer back.
      schema: { type: string, maxLength: 255 }
  responses:
    ApprovalRequired:
      description: Held for a person's approval. Poll `approval.poll_url`, then repeat the same request with `Cbox-Approval`.
      content:
        application/json:
          schema:
            type: object
            required: [error, message, approval]
            properties:
              error: { type: string, enum: [approval_required] }
              message: { type: string }
              approval:
                type: object
                required: [id, status, binding_code, expires_at, poll_url]
                properties:
                  id: { type: string }
                  status: { type: string }
                  binding_code: { type: string }
                  expires_at: { type: string, format: date-time }
                  poll_url: { type: string, format: uri }
    Unauthorized:
      description: No valid operator token. Management keys always get this.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Forbidden:
      description: The token's person is not an active platform operator, or the token lacks the required scope.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: No such workspace, environment, organization or operator on this deployment.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Conflict:
      description: A request with this `Idempotency-Key` is still being processed (`idempotency_in_progress`). Retry shortly.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    UnprocessableEntity:
      description: |
        Validation failed (`error: validation_failed`, with a field-keyed `errors` map), or the
        request was refused for a domain reason — an address already an operator, a password
        the environment's policy rejects, the last active operator.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    TooManyRequests:
      description: The token's rate limit for this API is exhausted.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema: { type: integer }
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  schemas:
    ProvisionedWorkspace:
      type: object
      required: [id, name, owner, project_id, environment_id, owner_invited]
      properties:
        id: { type: string }
        name: { type: string }
        owner:
          type: object
          required: [id, email]
          properties:
            id: { type: string }
            email: { type: string, format: email }
        project_id: { type: string, description: The workspace's first project. }
        environment_id: { type: string, description: That project's first environment. }
        owner_invited: { type: boolean, description: "Whether the owner was emailed a link to set their password." }
    PlatformOrganization:
      type: object
      required: [id, name, slug, type, status]
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        type: { type: string, enum: [customer, reseller] }
        status: { type: string, enum: [active, suspended, deleted] }
        parent_id: { type: ["string", "null"] }
        environment_id: { type: ["string", "null"], description: The environment it lives in. }
        created_at: { type: ["string", "null"], format: date-time }
    PlatformEnvironment:
      type: object
      required: [id, name, slug, status]
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        domain: { type: ["string", "null"], description: The verified domain it serves on — null until one is verified by DNS. }
        status: { type: string }
        project_id: { type: ["string", "null"], description: The project that owns it; null for one no customer owns yet. }
        created_at: { type: ["string", "null"], format: date-time }
    ProvisionedEnvironment:
      type: object
      required: [environment_id, organization, admin]
      properties:
        environment_id: { type: string }
        organization: { $ref: "#/components/schemas/PlatformOrganization" }
        admin:
          type: object
          required: [id, email]
          properties:
            id: { type: string }
            email: { type: string, format: email }
    PlatformOperator:
      type: object
      required: [id, email, status]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        name: { type: ["string", "null"] }
        status: { type: string, enum: [active, suspended] }
        created_at: { type: ["string", "null"], format: date-time }
    Error:
      type: object
      required: [error, message]
      properties:
        error: { type: string, description: Stable machine code }
        message: { type: string, description: Human-readable explanation }
        errors:
          type: object
          description: Present on `validation_failed` only — the offending fields, each mapped to its messages.
          additionalProperties:
            type: array
            items: { type: string }
