      summary: 'Redeem a grant for the plaintext secret'
      description: |
        The only endpoint that reveals a secret. Every refusal — unknown secret, revoked,
        expired, or no live grant — is the SAME 403 with no detail, so a caller cannot
        use it to enumerate what exists.
      security:
        -
          AgentToken: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - purpose
              properties:
                purpose:
                  type: string
                  maxLength: 200
                  description: 'Recorded on the audit trail.'
      responses:
        200:
          description: Leased.
          content:
            application/json:
              schema:
                type: object
                required:
                  - secret_id
                  - provider
                  - secret
                  - expires_at
                properties:
                  secret_id:
                    type: string
                  provider:
                    type: string
                    description: 'The downstream provider the secret belongs to.'
                  secret:
                    type: string
                  expires_at:
                    type: string
                    format: date-time
        401:
          $ref: '#/components/responses/BearerUnauthorized'
        403:
          description: |
            Lease denied. Deliberately uniform — unknown secret, revoked, expired and
            ungranted are ONE response, with a constant message, so it cannot be used to
            enumerate. A token missing the `vault.lease` scope is an RFC 6750 challenge
            instead, and is distinguishable only because it never reaches the vault.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Error'
                  - $ref: '#/components/schemas/BearerChallenge'
              example:
                error: lease_denied
                message: 'The lease was denied.'
        422:
          $ref: '#/components/responses/UnprocessableEntity'
        429:
          $ref: '#/components/responses/TooManyRequests'
