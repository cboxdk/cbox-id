components:
  securitySchemes:
    EnvironmentApiKey:
      type: http
      scheme: bearer
      bearerFormat: cbid_env_
      description: |
        An environment API key, `cbid_env_…`. Created by the account that owns the environment,
        in the console under Identity platform › Environment keys — not in the environment's own
        console. Bound to that environment's host, and carries an explicit list of scopes; it may
        also carry an expiry.
    ManagementAccessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A PERSON's OAuth access token, issued by this environment's issuer and audienced to
        its management plane (`resource=https://<environment-host>/mcp` — the same token the
        MCP server takes). `cbox login` and MCP clients obtain one by signing the person in.

        It may run an operation only when it carries the operation's scope AND the person
        could run it on their own console here: an organization administrator, confined to
        the organization the token is bound to. Operations that belong to the environment
        console do not list it. Every critical operation answers `202 approval_required`
        until the person approves it on their device.

        On the organization's own roster (members, their roles, invitations, ownership, its
        people's API keys) the organization's own rules hold, as on its People page: an
        admin cannot change or remove an owner, nobody removes themselves, only the owner
        transfers ownership, a staff-only role is `role_not_assignable`, and a customer
        workspace's roster — administered under Workspace › Team — is `409 managed_elsewhere`. A DPoP-bound token is presented as
        `Authorization: DPoP <token>` with a proof.
    WorkspaceAccessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A workspace member's OAuth access token from the PLATFORM ROOT, audienced to the
        root's `/mcp` (`cbox login` at the root; an agent signed in there). Presented on the
        ROOT's host, with `Cbox-Environment` naming the environment of the person's
        workspace to act in. It runs what that environment's console runs — when the
        person's role administers environments and their membership reaches this one — and
        only within the scopes it carries. Every critical operation answers
        `202 approval_required` until the person approves it on their device. A DPoP-bound
        token is presented as `Authorization: DPoP <token>` with a proof.
    AppClientCredentials:
      type: http
      scheme: basic
      description: |
        Your APP's own client credentials — `client_id:client_secret` as HTTP Basic
        (`client_secret_basic`). `client_secret_post` and `private_key_jwt` are accepted
        too, in the body, exactly as at the token endpoint.
    VaultManagerToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        An OAuth access token carrying the `vault.manage` scope. NOT an environment API
        key: these routes are guarded by `scope:vault.manage`, which introspects an
        access token, and a `cbid_env_` key introspects as inactive. Its `org` claim
        selects the organization whose secrets it administers.
    AgentToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        An OAuth access token carrying the `vault.lease` scope. Its `org` claim selects
        the organization whose secrets it may open — the vault's tenancy boundary.
    AuthenticatorToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A DPoP-bound OAuth access token held by the Cbox ID authenticator app, obtained
        via authorization_code + PKCE (S256) as a public client.

        Because the token carries a `cnf.jkt`, every request must present it under the
        `DPoP` auth scheme together with a matching proof — `htm`, `htu`, a fresh `jti`,
        an `iat` within 60 seconds, and an `ath` equal to the SHA-256 of the token
        itself. A plain `Bearer` presentation of a bound token is rejected.
  parameters:
    CboxEnvironment:
      name: Cbox-Environment
      in: header
      required: false
      description: |
        Only with a `WorkspaceAccessToken`, on the platform root's host: the environment of
        your workspace to act in, by id or slug. Required there; ignored with a key, which
        is bound to its own environment's host.
      schema:
        type: string
    CboxApproval:
      name: Cbox-Approval
      in: header
      required: false
      description: 'The id of an approval this key asked for (from a `202 approval_required`), once the person approved it. Spent by this request, once.'
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 'Any unique string (a UUID). A retry with the same key and request gets the first answer back.'
      schema:
        type: string
        maxLength: 255
    ScopeKey:
      name: key
      in: path
      required: true
      description: 'The scope key, for example `tax:assess`.'
      schema:
        type: string
        maxLength: 128
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
    OrganizationId:
      name: organization_id
      in: path
      required: true
      description: "The organization's id."
      schema:
        type: string
    UserId:
      name: user_id
      in: path
      required: true
      schema:
        type: string
    InvitationId:
      name: invitation_id
      in: path
      required: true
      schema:
        type: string
    RoleId:
      name: role_id
      in: path
      required: true
      description: "The role's id — or its manifest `key`, together with `?client_id=` naming the app that declared it."
      schema:
        type: string
    RoleClientId:
      name: client_id
      in: query
      required: false
      description: 'The app whose manifest `key` `{role_id}` is. Not needed when `{role_id}` is an id.'
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    After:
      name: after
      in: query
      required: false
      description: 'Opaque cursor — the `meta.next_cursor` from the previous page.'
      schema:
        type: string
  schemas:
    ManagementKey:
      type: object
      description: 'A management key of this environment. `token` is present once, on the answer that minted it, and never again.'
      required:
        - id
        - name
        - prefix
        - scopes
        - active
        - created_at
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type:
            - string
            - 'null'
        prefix:
          type: string
          description: "The key's first characters, to recognise it by."
        scopes:
          type: array
          items:
            type: string
        active:
          type: boolean
        parent_key_id:
          type:
            - string
            - 'null'
          description: 'The key that minted this one, if a key did.'
        rotated_from_id:
          type:
            - string
            - 'null'
          description: 'The key this one replaced, if it came from a rotation.'
        require_approval:
          description: 'The approval policy: actions held for the person behind the key.'
          oneOf:
            -
              type: object
              properties:
                min_danger:
                  type:
                    - string
                    - 'null'
                  enum:
                    - read
                    - write
                    - destructive
                    - critical
                    - null
                actions:
                  type: array
                  items:
                    type: string
            - type: 'null'
        created_by:
          oneOf:
            -
              type: object
              required:
                - type
                - id
              properties:
                type:
                  type: string
                id:
                  type:
                    - string
                    - 'null'
            - type: 'null'
        expires_at:
          type:
            - string
            - 'null'
          format: date-time
        last_used_at:
          type:
            - string
            - 'null'
          format: date-time
        revoked_at:
          type:
            - string
            - 'null'
          format: date-time
        created_at:
          type:
            - string
            - 'null'
          format: date-time
        token:
          type:
            - string
            - 'null'
          description: "The key's value. Only on the answer that minted it; null on an idempotent replay of that answer, because the value is never stored."
    LegacyLoginProbe:
      type: object
      required:
        - result
      properties:
        result:
          type: string
          description: 'What the declared legacy-login endpoint answered for the address, in words.'
    ManifestSync:
      type: object
      required:
        - unchanged
        - roles_declared
        - permissions_declared
        - orphaned_role_keys
        - orphaned_permission_keys
      properties:
        unchanged:
          type: boolean
          description: 'The manifest matched what is already stored.'
        roles_declared:
          type: integer
        permissions_declared:
          type: integer
        orphaned_role_keys:
          type: array
          items:
            type: string
          description: 'Roles stored here that the manifest no longer declares.'
        orphaned_permission_keys:
          type: array
          items:
            type: string
    SmsFactorPolicy:
      type: object
      required:
        - enabled
        - allowed_countries
        - privileged_need_stronger_factor
        - deployment_countries
      properties:
        enabled:
          type: boolean
          description: 'Text-message codes are accepted as a second factor. Off by default.'
        allowed_countries:
          type: array
          items:
            type: string
            pattern: '^[A-Z]{2}$'
          description: 'ISO 3166-1 alpha-2 countries whose numbers may enrol and be texted. Re-checked at every send.'
        privileged_need_stronger_factor:
          type: boolean
          description: 'Administrators may add SMS only beside an authenticator app or a passkey.'
        deployment_countries:
          type: array
          items:
            type: string
            pattern: '^[A-Z]{2}$'
          description: "The deployment's ceiling (CBOX_ID_SMS_ALLOWED_COUNTRIES). Empty: no deployment restriction. A listed country outside it is never texted."
    SelfServiceSignup:
      type: object
      required:
        - enabled
        - decided_here
      properties:
        enabled:
          type: boolean
        decided_here:
          type: boolean
          description: 'False on a single-tenant install, where sign-up follows CBOX_ID_SIGNUP_MODE and the switch changes nothing.'
    Device:
      type: object
      required:
        - id
        - install_id
        - platform
        - name
        - status
      properties:
        id:
          type: string
        install_id:
          type: string
        platform:
          type: string
          enum:
            - ios
            - android
        name:
          type: string
        status:
          type: string
          enum:
            - active
            - retired
          description: |
            Operator/user INTENT, not delivery health. A device can be active and
            currently failing, or retired and perfectly reachable.
        app_version:
          type:
            - string
            - 'null'
        os_version:
          type:
            - string
            - 'null'
        model:
          type:
            - string
            - 'null'
        last_seen_at:
          type:
            - string
            - 'null'
          format: date-time
        created_at:
          type:
            - string
            - 'null'
          format: date-time
    Approval:
      type: object
      required:
        - id
        - client_id
        - client_name
        - scopes
      properties:
        id:
          type: string
          description: |
            The INTERNAL request id. Never `auth_req_id`, which is the initiating
            client's polling secret and is stored only as a SHA-256 hash — a client must
            not be able to approve its own request.
        client_id:
          type: string
        client_name:
          type: string
        binding_message:
          type:
            - string
            - 'null'
          description: |
            The transaction description the user compares against what the requesting app
            showed them. This is the anti-phishing primitive, and the reason approvals are
            fetched rather than pushed.
        scopes:
          type: array
          items:
            type: object
            required:
              - scope
              - label
            properties:
              scope:
                type: string
              label:
                type: string
                description: 'Human wording, identical to the console.'
        organization_id:
          type:
            - string
            - 'null'
        requested_at:
          type:
            - string
            - 'null'
          format: date-time
        expires_at:
          type:
            - string
            - 'null'
          format: date-time
    ApprovalDecision:
      type: object
      required:
        - id
        - status
      properties:
        id:
          type: string
        status:
          type: string
          enum:
            - approved
            - denied
    VaultSecret:
      type: object
      required:
        - id
        - name
        - provider
        - revoked
      properties:
        id:
          type: string
        name:
          type: string
        provider:
          type: string
        owner_type:
          type:
            - string
            - 'null'
          enum:
            - organization
            - user
            - null
        owner_id:
          type:
            - string
            - 'null'
        expires_at:
          type:
            - string
            - 'null'
          format: date-time
        revoked:
          type: boolean
          description: 'Whether the secret has been revoked.'
    Organization:
      type: object
      required:
        - id
        - name
        - slug
        - type
        - status
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        type:
          type: string
          enum:
            - customer
            - reseller
        status:
          type: string
          enum:
            - active
            - suspended
            - deleted
        parent_id:
          type:
            - string
            - 'null'
        created_at:
          type:
            - string
            - 'null'
          format: date-time
        metadata:
          type:
            - object
            - 'null'
          additionalProperties:
            type: string
          description: 'Free-form text values kept on the organization; null when there are none.'
    OrganizationDomain:
      type: object
      required:
        - id
        - organization_id
        - domain
        - verified
        - capture
        - record_name
        - record_value
      properties:
        id:
          type: string
        organization_id:
          type: string
        domain:
          type: string
          description: 'An email domain the organization claims, like acme.com.'
        verified:
          type: boolean
        verified_at:
          type:
            - string
            - 'null'
          format: date-time
        capture:
          type: boolean
          description: "Whether everyone signing in with an address here is routed to the organization's SSO."
        record_name:
          type: string
          description: 'Where to publish the DNS TXT record that proves the claim.'
        record_value:
          type: string
          description: 'What to publish there.'
    AssignableMemberRole:
      type: string
      enum:
        - admin
        - member
      default: member
      description: |
        The built-in tiers this deployment hands out. `owner` is never assigned — ownership
        moves with `transfer-ownership`.
    Member:
      type: object
      required:
        - id
        - user_id
        - organization_id
        - role
        - status
      properties:
        id:
          type: string
          description: "The membership's own id. Address a member by `user_id`."
        user_id:
          type: string
        organization_id:
          type: string
        role:
          type: string
          enum:
            - owner
            - admin
            - developer
            - member
            - viewer
        status:
          type: string
          enum:
            - active
            - invited
            - suspended
        email:
          type:
            - string
            - 'null'
        name:
          type:
            - string
            - 'null'
        joined_at:
          type:
            - string
            - 'null'
          format: date-time
    Invitation:
      type: object
      required:
        - id
        - organization_id
        - email
        - role
        - roles
        - status
      properties:
        id:
          type: string
        organization_id:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum:
            - owner
            - admin
            - developer
            - member
            - viewer
        roles:
          type: array
          description: 'Ids of the access roles granted when the invitation is accepted.'
          items:
            type: string
        status:
          type: string
          enum:
            - pending
            - accepted
            - revoked
        client_id:
          type:
            - string
            - 'null'
          description: 'The app it came from.'
        return_to:
          type:
            - string
            - 'null'
          description: 'Where the person is sent after accepting.'
        invited_at:
          type:
            - string
            - 'null'
          format: date-time
        expires_at:
          type:
            - string
            - 'null'
          format: date-time
    Role:
      type: object
      required:
        - id
        - name
        - tenant_assignable
        - permissions
      properties:
        id:
          type: string
        key:
          type:
            - string
            - 'null'
          description: "The app's manifest key; null for a role made in the console."
        name:
          type: string
        description:
          type:
            - string
            - 'null'
        client_id:
          type:
            - string
            - 'null'
          description: 'The app that declared it; null for an app-agnostic role.'
        organization_id:
          type:
            - string
            - 'null'
          description: 'Set only for a role one organization made for itself.'
        tenant_assignable:
          type: boolean
          description: |
            `false` marks a STAFF role: an organization's own administrators can never grant
            it, nor can an invitation carry it. This API can — see the role endpoints.
        permissions:
          type: array
          items:
            type: string
    RoleAssignment:
      type: object
      required:
        - role_id
        - name
        - user_id
        - source
      properties:
        role_id:
          type: string
        key:
          type:
            - string
            - 'null'
        name:
          type: string
        client_id:
          type:
            - string
            - 'null'
        tenant_assignable:
          type: boolean
        user_id:
          type: string
        organization_id:
          type:
            - string
            - 'null'
          description: 'The organization it is held in; null for an environment-wide (staff) grant.'
        source:
          type: string
          enum:
            - manual
            - pushed
            - system
    App:
      type: object
      required:
        - id
        - client_id
        - name
        - type
        - client_type
        - grant_types
        - redirect_uris
        - scopes
        - first_party
      properties:
        id:
          type: string
        client_id:
          type: string
        name:
          type: string
        type:
          type: string
          enum:
            - web
            - spa
            - cli
            - service
            - agent
            - advanced
          description: 'The kind, read back from its grants; `advanced` when they match no preset.'
        client_type:
          type: string
          enum:
            - confidential
            - public
        organization_id:
          type:
            - string
            - 'null'
        first_party:
          type: boolean
        grant_types:
          type: array
          items:
            type: string
        redirect_uris:
          type: array
          items:
            type: string
        post_logout_redirect_uris:
          type: array
          items:
            type: string
        scopes:
          type: array
          items:
            type: string
        manifest_url:
          type:
            - string
            - 'null'
          description: 'Where it publishes its roles-and-permissions manifest.'
        access_token_ttl:
          type:
            - integer
            - 'null'
          description: "Its access-token lifetime in seconds; null for the install's default."
        backchannel_logout_uri:
          type:
            - string
            - 'null'
          description: 'Where it is sent a logout token (OIDC Back-Channel Logout); null when it is not told.'
        backchannel_logout_session_required:
          type: boolean
        api_key_prefix:
          type:
            - string
            - 'null'
          description: 'The prefix of its customer API keys; null when it accepts none.'
        created_at:
          type:
            - string
            - 'null'
          format: date-time
        client_secret:
          type:
            - string
            - 'null'
          description: 'Only on the response that created (or copied) the app, and only for an app that authenticates with a secret. Never again — null on an idempotent replay.'
    AppSecret:
      type: object
      required:
        - id
      properties:
        id:
          type: string
        hint:
          type:
            - string
            - 'null'
          description: 'The characters the secret ends in; null for one older than per-secret storage.'
        created_at:
          type:
            - string
            - 'null'
          format: date-time
        expires_at:
          type:
            - string
            - 'null'
          format: date-time
          description: 'Set on a secret a rotation replaced — it stops working then.'
        last_used_at:
          type:
            - string
            - 'null'
          format: date-time
        client_secret:
          type:
            - string
            - 'null'
          description: 'Only on the rotation that minted it. Never again — null on an idempotent replay.'
        previous_expire_at:
          type:
            - string
            - 'null'
          format: date-time
          description: 'On a rotation — when the secrets it replaced stop working.'
    AppBlueprint:
      type: object
      description: |
        An app's configuration without its identity or credentials — deterministic (lists
        sorted), versioned, and refused rather than half-read when it carries a key this
        server does not know.
      required:
        - kind
        - version
        - name
        - client_type
      additionalProperties: false
      properties:
        kind:
          type: string
          const: cbox-id.client-blueprint
        version:
          type: integer
          const: 1
        name:
          type: string
        client_type:
          type: string
          enum:
            - confidential
            - public
        token_endpoint_auth_method:
          type:
            - string
            - 'null'
        grant_types:
          type: array
          items:
            type: string
        redirect_uris:
          type: array
          items:
            type: string
        post_logout_redirect_uris:
          type: array
          items:
            type: string
        scopes:
          type: array
          items:
            type: string
        first_party:
          type: boolean
        manifest_url:
          type:
            - string
            - 'null'
        access_token_ttl:
          type:
            - integer
            - 'null'
        backchannel_logout_uri:
          type:
            - string
            - 'null'
        backchannel_logout_session_required:
          type: boolean
        api_key_prefix:
          type:
            - string
            - 'null'
    ApiScope:
      type: object
      required:
        - key
      properties:
        key:
          type: string
          maxLength: 128
        description:
          type:
            - string
            - 'null'
          maxLength: 255
        tenant_requestable:
          type: boolean
          default: true
          description: "Whether apps an organization owns may be granted it; false keeps it for the environment's own apps."
    Api:
      type: object
      required:
        - id
        - identifier
        - name
        - scopes
      properties:
        id:
          type: string
        identifier:
          type: string
          description: "Absolute URI; the token's `aud`."
        name:
          type: string
        organization_id:
          type:
            - string
            - 'null'
          description: 'null when the environment owns it.'
        client_id:
          type:
            - string
            - 'null'
          description: 'The app whose roles and permissions it enforces.'
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/ApiScope'
        created_at:
          type:
            - string
            - 'null'
          format: date-time
    Webhook:
      type: object
      required:
        - id
        - url
        - organization_id
        - event_types
        - active
        - signature_scheme
      properties:
        id:
          type: string
        url:
          type: string
        organization_id:
          type:
            - string
            - 'null'
          description: "null when the environment owns it: it receives EVERY organization's events."
        event_types:
          type: array
          items:
            type: string
        active:
          type: boolean
          description: 'false while paused.'
        signature_scheme:
          type: string
          enum:
            - cbox
            - standard_webhooks
          description: |
            How deliveries are signed. `cbox`: `X-Cbox-Timestamp` and
            `X-Cbox-Signature: t=<ts>,v1=<hex HMAC-SHA256 of "<ts>.<body>">`.
            `standard_webhooks`: `webhook-id`, `webhook-timestamp` and
            `webhook-signature: v1,<base64 HMAC-SHA256 of "<id>.<ts>.<body>">`, verifiable
            with any Standard Webhooks library. Only the chosen scheme's headers are sent.
        consecutive_failures:
          type: integer
        last_success_at:
          type:
            - string
            - 'null'
          format: date-time
        created_at:
          type:
            - string
            - 'null'
          format: date-time
        secret:
          type:
            - string
            - 'null'
          description: |
            The signing secret, on the create and rotate answers only — shown once, never
            retrievable again. `null` on an idempotent replay of that answer. 64 hex
            characters under `cbox`; a `whsec_` secret under `standard_webhooks`.
    InlineHook:
      type: object
      required:
        - id
        - url
        - hook_point
        - organization_id
        - active
      properties:
        id:
          type: string
        url:
          type: string
        hook_point:
          type: string
          enum:
            - token_minting
            - post_login
            - pre_registration
            - post_registration
            - pre_password_change
            - post_password_change
        organization_id:
          type:
            - string
            - 'null'
          description: 'null when the environment owns it: it runs for EVERY organization.'
        active:
          type: boolean
        created_at:
          type:
            - string
            - 'null'
          format: date-time
        secret:
          type:
            - string
            - 'null'
          description: 'The signing secret, on the create answer only — shown once. `null` on an idempotent replay.'
    LogStream:
      type: object
      required:
        - id
        - name
        - destination
        - endpoint_url
        - auth
        - options
        - external_id
        - organization_id
        - enabled
        - health
      properties:
        id:
          type: string
        name:
          type: string
        destination:
          type: string
          enum:
            - splunk_hec
            - elastic_ecs
            - graylog_gelf
            - cef_http
            - generic_json
            - datadog
            - s3
            - gcs
        endpoint_url:
          type: string
          description: 'Where entries go. For Datadog, S3 and GCS, derived from the site or region unless a custom endpoint was given.'
        auth:
          type: string
          enum:
            - none
            - bearer
            - splunk
            - hmac
          description: "An HTTP collector's scheme; `none` for the cloud destinations, which authenticate their own way."
        options:
          type:
            - object
            - 'null'
          description: "Datadog, S3 and GCS: the destination's settings, as stored. Never a credential — the API key, secret access key or service-account key is the encrypted secret. null for an HTTP collector."
          properties:
            site:
              type: string
              enum:
                - datadoghq.com
                - us3.datadoghq.com
                - us5.datadoghq.com
                - datadoghq.eu
                - ap1.datadoghq.com
                - ap2.datadoghq.com
                - ddog-gov.com
            service:
              type: string
            source:
              type: string
            hostname:
              type: string
            tags:
              type: string
              description: 'Comma-separated `key:value` tags (`ddtags`).'
            bucket:
              type: string
            region:
              type: string
            prefix:
              type: string
            access_key_id:
              type: string
            role_arn:
              type: string
            external_id:
              type: string
            sse:
              type: string
              enum:
                - AES256
                - 'aws:kms'
            kms_key_id:
              type: string
            path_style:
              type: boolean
            gzip:
              type: boolean
        external_id:
          type:
            - string
            - 'null'
          description: "An assumed-role S3 stream's external ID, generated for it: the role's trust policy must require it (`sts:ExternalId`). null otherwise."
        organization_id:
          type:
            - string
            - 'null'
          description: "null when the environment owns it: it carries EVERY organization's entries."
        enabled:
          type: boolean
        health:
          type: string
          enum:
            - healthy
            - degraded
            - paused
            - action_required
          description: '`degraded`: recent transient failures, still retrying. `paused`: the circuit is open after repeated failures and resumes on its own. `action_required`: the destination refused the credential or the settings — update the stream, or run a successful test.'
        consecutive_failures:
          type: integer
        last_success_at:
          type:
            - string
            - 'null'
          format: date-time
        last_error:
          type:
            - string
            - 'null'
          description: "The latest failure, scrubbed of the stream's secret."
        last_failure_kind:
          type:
            - string
            - 'null'
          enum:
            - transient
            - authentication
            - configuration
            - null
        last_failure_at:
          type:
            - string
            - 'null'
          format: date-time
        created_at:
          type:
            - string
            - 'null'
          format: date-time
        secret:
          type:
            - string
            - 'null'
          description: 'A generated HMAC key, on the answer that generated it only — shown once. `null` on an idempotent replay. A credential the caller supplied is never echoed.'
    DomainEvent:
      type: object
      required:
        - id
        - type
        - organization_id
        - occurred_at
        - payload
      properties:
        id:
          type: string
          description: 'A ULID; pass the last one you saw as `after`.'
        type:
          type: string
          description: 'e.g. `user.created` — the webhook event name.'
        organization_id:
          type:
            - string
            - 'null'
        occurred_at:
          type:
            - string
            - 'null'
          format: date-time
        payload:
          type: object
    AuditEntry:
