        error_description:
          type: string
    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        name:
          type:
            - string
            - 'null'
        status:
          type: string
          enum:
            - active
            - disabled
            - locked
        email_verified_at:
          type:
            - string
            - 'null'
          format: date-time
    UserSession:
      type: object
      required:
        - id
        - expires_at
        - impersonation
      properties:
        id:
          type: string
        user_agent:
          type:
            - string
            - 'null'
        ip:
          type:
            - string
            - 'null'
        last_active_at:
          type:
            - string
            - 'null'
          format: date-time
        expires_at:
          type: string
          format: date-time
        impersonation:
          type: boolean
          description: 'Somebody else opened it as this person.'
    Permission:
      type: object
      required:
        - id
        - name
        - manual
        - tenant_assignable
        - orphaned
      properties:
        id:
          type: string
        name:
          type: string
          description: 'The `feature:action` key an app reads out of a token.'
        description:
          type:
            - string
            - 'null'
        client_id:
          type:
            - string
            - 'null'
          description: 'The app that declared it; null for one authored here.'
        organization_id:
          type:
            - string
            - 'null'
          description: "Set for one organization's own; null for the shared tier."
        tenant_assignable:
          type: boolean
          description: 'Whether organizations may compose it into their own roles.'
        manual:
          type: boolean
          description: 'Authored here rather than declared by an app.'
        orphaned:
          type: boolean
          description: 'Its app stopped declaring it.'
    SignInRules:
      type: object
      required:
        - min_length
        - require_breach_check
        - max_age_days
        - reuse_history
        - mfa
        - sso
        - lockout_threshold
      properties:
        min_length:
          type: integer
          description: 'Minimum password length.'
        require_breach_check:
          type: boolean
          description: 'Passwords found in known breaches are refused.'
        max_age_days:
          type:
            - integer
            - 'null'
          description: 'Days before a password must be changed; null for no limit.'
        reuse_history:
          type: integer
          description: 'Previous passwords that may not be reused.'
        mfa:
          type: string
          enum:
            - 'off'
            - optional
            - required
        sso:
          type: string
          enum:
            - 'off'
            - preferred
            - required
          description: '`required` refuses every other way in.'
        lockout_threshold:
          type:
            - integer
            - 'null'
          description: 'Failed attempts before a lockout; null for none.'
    SignInPolicy:
      type: object
      required:
