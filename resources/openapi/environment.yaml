                            maxLength: 190
                          type:
                            type: string
                            description: 'What kind of actor: `user`, `api_key`, `system`.'
                            maxLength: 100
                          name:
                            type:
                              - string
                              - 'null'
                            description: 'A name a person reads in the log.'
