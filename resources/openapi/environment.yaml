  /devices:
    post:
      tags:
        - Devices
      summary: 'Enrol a device, or re-enrol after a push-token rotation'
      description: |
        Requires scope `devices.manage`. Idempotent on `install_id`: posting again with a
        fresh `push_token` updates the existing enrolment and returns 200, so the app has
        no separate rotation call to get wrong. Re-enrolling also clears circuit-breaker
        state and revives a device that was retired by a permanent transport error.

        The device is always bound to the token's own subject. Nothing in the body can
        change whose device it is.
      security:
        -
          AuthenticatorToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - install_id
                - platform
                - push_token
                - name
              properties:
                install_id:
                  type: string
                  minLength: 26
                  maxLength: 26
                  description: |
                    A ULID the app generates on first launch and keeps in platform secure
                    storage. Deliberately NOT a vendor device id — `identifierForVendor`
                    and `ANDROID_ID` both reset on reinstall and are shared across one
                    vendor's apps.
                platform:
                  type: string
                  enum:
                    - ios
                    - android
                push_token:
                  type: string
                  maxLength: 4096
                name:
                  type: string
                  maxLength: 100
                  description: 'Shown in the console. Control characters are stripped.'
                app_version:
                  type:
                    - string
                    - 'null'
                  maxLength: 32
                os_version:
                  type:
                    - string
                    - 'null'
                  maxLength: 32
                model:
                  type:
                    - string
                    - 'null'
                  maxLength: 64
      responses:
        200:
          description: 'The installation was already enrolled; its details were updated.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Device'
        201:
          description: Enrolled.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Device'
        401:
          $ref: '#/components/responses/BearerUnauthorized'
        403:
          $ref: '#/components/responses/BearerForbidden'
        409:
          description: |
            This `install_id` belongs to a different user. Refused rather than reassigned:
            silently moving it would let one user capture another's push stream by guessing
            an install id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: install_claimed
                message: 'This installation is registered to a different user.'
        422:
          $ref: '#/components/responses/UnprocessableEntity'
        429:
          $ref: '#/components/responses/TooManyRequests'
    get:
      tags:
        - Devices
      summary: "List the caller's own enrolled devices"
      description: |
        Requires scope `devices.manage`. The push token is never returned — it is a
        capability, and nothing outside a delivery attempt needs it.
      security:
        -
          AuthenticatorToken: []
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Device'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        401:
          $ref: '#/components/responses/BearerUnauthorized'
        403:
          $ref: '#/components/responses/BearerForbidden'
        429:
          $ref: '#/components/responses/TooManyRequests'
