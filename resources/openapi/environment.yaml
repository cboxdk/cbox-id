  /vault/secrets:
    post:
      tags:
        - 'Token Vault'
      summary: 'Store a downstream credential, sealed at rest'
      description: |
        The secret is sealed with the environment's crypto key and is never returned by
        any read endpoint — only a `lease` reveals it, and only to a client holding a
        live grant.

        Ownership is derived from the calling token's `org` claim and CANNOT be supplied
        in the body: the owner is the vault's tenancy boundary, and a caller-chosen owner
        would be no boundary at all.
      security:
        -
          VaultManagerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - provider
                - secret
              properties:
                name:
                  type: string
                  maxLength: 200
                  description: 'Unique per owner — two organizations may each hold a `github-token`.'
                provider:
                  type: string
                  maxLength: 100
                secret:
                  type: string
                  description: 'The value to seal. Never returned by a read.'
                expires_at:
                  type:
                    - string
                    - 'null'
                  format: date-time
      responses:
        201:
          description: Stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VaultSecret'
        401:
          $ref: '#/components/responses/BearerUnauthorized'
        403:
          $ref: '#/components/responses/BearerForbidden'
        422:
          $ref: '#/components/responses/UnprocessableEntity'
        429:
          $ref: '#/components/responses/TooManyRequests'
