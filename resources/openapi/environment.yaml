        name:
          type: string
        client_type:
          type: string
          enum:
            - confidential
            - public
        token_endpoint_auth_method:
          type:
            - string
            - 'null'
        grant_types:
          type: array
          items:
            type: string
        redirect_uris:
          type: array
          items:
            type: string
        post_logout_redirect_uris:
          type: array
          items:
            type: string
        scopes:
          type: array
          items:
            type: string
        first_party:
          type: boolean
        manifest_url:
          type:
            - string
            - 'null'
        access_token_ttl:
          type:
            - integer
            - 'null'
        backchannel_logout_uri:
          type:
            - string
            - 'null'
        backchannel_logout_session_required:
          type: boolean
        api_key_prefix:
          type:
            - string
            - 'null'
    ApiScope:
