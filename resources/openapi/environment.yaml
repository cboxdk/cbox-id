            - string
            - 'null'
          format: date-time
    PortalLinkRecord:
      type: object
      description: 'An Admin Portal link as a list shows it. Never its URL: that was shown once, when it was minted, and only its hash is kept.'
      required:
        - id
        - organization_id
        - intents
        - status
        - created_at
        - created_by
        - emailed_to
        - expires_at
        - consumed_at
        - completed_at
        - revoked_at
      properties:
        id:
          type: string
        organization_id:
          type: string
        intents:
          type: array
          description: 'What the link may set up.'
          items:
            type: string
            enum:
              - sso
              - dsync
              - domain_verification
              - log_streams
              - certificate_renewal
              - audit_logs
        status:
          type: string
          enum:
            - pending
            - in_use
            - completed
            - expired
            - revoked
          description: |
            `pending`: not opened yet, and it still can be. `in_use`: opened, and the setup
            session it started may still be running. `completed`: its setup was finished.
            `expired`: never opened in time, or its setup session ran out. `revoked`: withdrawn.
        created_at:
          type:
            - string
            - 'null'
          format: date-time
        created_by:
          type: string
          description: "Who minted it: the console person's id, or the management key's."
        emailed_to:
          type:
            - string
            - 'null'
          description: 'The address it was mailed to, or null when it was not sent.'
        expires_at:
          type:
            - string
            - 'null'
          format: date-time
          description: 'How long it could wait to be opened.'
        consumed_at:
          type:
            - string
            - 'null'
          format: date-time
          description: 'When it was opened. It is single-use.'
        completed_at:
          type:
            - string
            - 'null'
          format: date-time
          description: 'When its setup was finished.'
        revoked_at:
          type:
            - string
            - 'null'
          format: date-time
          description: 'When it was withdrawn.'
    AuditLogEvent:
      type: object
      description: |
        One audit event your app sent. `hash` covers `id`, `organization_id`, `sequence`,
        `action`, `occurred_at`, `actor`, `targets`, `context` and `metadata`, chained to
        the organization's previous event by `prev_hash` — see the Audit Logs guide for how
        to verify it yourself.
      required:
        - id
        - organization_id
        - sequence
        - action
        - occurred_at
        - actor
        - targets
        - context
        - metadata
        - schema_version
        - received_at
        - prev_hash
        - hash
      properties:
        id:
          type: string
        organization_id:
          type: string
        sequence:
          type: integer
          description: "The event's place in its organization's chain, from 1."
        action:
          type: string
          description: 'e.g. `invoice.voided`.'
        occurred_at:
          type: string
          format: date-time
          description: 'When it happened, as the sender said, to the millisecond.'
        actor:
          type: object
          required:
            - id
            - type
            - name
            - metadata
          properties:
            id:
              type: string
            type:
              type: string
            name:
              type:
                - string
                - 'null'
            metadata:
              type:
                - object
                - 'null'
        targets:
          type: array
          items:
            type: object
            required:
              - id
              - type
              - name
              - metadata
            properties:
              id:
                type: string
              type:
                type: string
              name:
                type:
                  - string
                  - 'null'
              metadata:
                type:
                  - object
                  - 'null'
        context:
          type: object
          required:
            - location
            - user_agent
          properties:
            location:
              type:
                - string
                - 'null'
            user_agent:
              type:
                - string
                - 'null'
        metadata:
          type:
            - object
            - 'null'
        schema_version:
          type:
            - integer
            - 'null'
          description: "The version of its action's schema it was checked against; null when the action has none."
        received_at:
          type:
            - string
            - 'null'
          format: date-time
          description: 'When it arrived. Retention counts from here.'
        prev_hash:
          type: string
          description: "The previous event's hash; 64 zeros for an organization's first."
        hash:
          type: string
    AuditLogEventBatch:
      type: object
      required:
        - events
      properties:
        events:
          type: array
          description: 'The recorded events, in the order they were sent.'
          items:
            $ref: '#/components/schemas/AuditLogEvent'
    AuditLogSchema:
      type: object
      required:
        - id
        - action
        - version
        - targets
        - actor_metadata
        - metadata
        - created_at
        - updated_at
      properties:
        id:
          type: string
        action:
          type: string
        version:
          type: integer
          description: 'Starts at 1; every replacement is the next.'
        targets:
          type:
            - array
            - 'null'
          description: "The target types this action's events may name; null allows any."
          items:
            type: object
            required:
              - type
              - metadata
            properties:
              type:
                type: string
              metadata:
                type:
                  - object
                  - 'null'
        actor_metadata:
          type:
            - object
            - 'null'
          description: 'A metadata schema (a subset of JSON Schema).'
        metadata:
          type:
            - object
            - 'null'
          description: 'A metadata schema (a subset of JSON Schema).'
        created_at:
          type:
            - string
            - 'null'
          format: date-time
        updated_at:
          type:
            - string
            - 'null'
          format: date-time
    AuditLogExport:
      type: object
      required:
        - id
        - organization_id
        - state
        - filters
        - row_count
        - url
        - created_at
        - completed_at
        - expires_at
      properties:
        id:
          type: string
        organization_id:
          type:
            - string
            - 'null'
          description: 'null for an export across the whole environment.'
        state:
          type: string
          enum:
            - pending
            - ready
            - failed
            - expired
        filters:
          type: object
          description: 'The filters it was asked with.'
        row_count:
          type:
            - integer
            - 'null'
        url:
          type:
            - string
            - 'null'
          description: |
            Where the CSV downloads from once `ready` — signed, and valid for a few minutes;
            read the export again for a fresh one. null otherwise, and on an idempotent replay.
        created_at:
          type:
            - string
            - 'null'
          format: date-time
        completed_at:
          type:
            - string
            - 'null'
          format: date-time
        expires_at:
          type:
            - string
            - 'null'
          format: date-time
          description: 'When the file is deleted.'
    FgaSubject:
      type: object
      required:
        - type
        - id
        - relation
      properties:
        type:
          type: string
          description: "The subject's type: `user`, or `group` for a userset."
        id:
          type: string
        relation:
          type:
            - string
            - 'null'
          description: 'For a userset — everybody with this relation on the subject (`member` of `group:eng`). null for one subject.'
    FgaTuple:
      type: object
      required:
        - resource_type
        - resource_id
        - relation
        - subject
        - tuple
      properties:
        resource_type:
          type: string
        resource_id:
          type: string
        relation:
          type: string
        subject:
          $ref: '#/components/schemas/FgaSubject'
        tuple:
          type: string
          description: 'The same tuple in the notation: `document:readme#viewer@group:eng#member`.'
    FgaSchema:
      type: object
      required:
        - defined
        - schema
        - version
        - types
        - updated_at
        - consistency_token
      properties:
        defined:
          type: boolean
          description: 'false until a schema is first saved.'
        schema:
          type:
            - string
            - 'null'
          description: 'The source as it was written, comments and all.'
        version:
          type: integer
          description: 'How many times the schema has been replaced.'
        types:
          type: array
          description: 'The parsed types, each with its relations and how each is decided.'
          items:
            $ref: '#/components/schemas/FgaType'
        updated_at:
          type:
            - string
            - 'null'
          format: date-time
        consistency_token:
          type: string
          description: 'The revision the model is at.'
    FgaType:
      type: object
      required:
        - name
        - relations
      properties:
        name:
          type: string
        relations:
          type: array
          items:
            type: object
            required:
              - name
              - rewrite
              - directly_related
            properties:
              name:
                type: string
              rewrite:
                type: object
                description: |
                  How the relation is decided, as a tree of one-key objects: `direct` (a list of
                  `{type, relation?}`), `computed` (a relation name), `from` (`{tupleset, relation}`),
                  `union` and `intersection` (lists of rewrites), `exclusion` (`{base, subtract}`).
              directly_related:
                type: array
                description: 'The subjects a tuple may name on this relation; empty for a relation that is only computed.'
                items:
                  type: object
                  required:
                    - type
                  properties:
                    type:
                      type: string
                    relation:
                      type: string
    FgaSchemaValidation:
      type: object
      required:
        - valid
        - errors
        - types
        - canonical
      properties:
        valid:
          type: boolean
        errors:
          type: array
          items:
            type: object
            required:
              - line
              - message
            properties:
              line:
                type: integer
                description: '0 when the problem is about the whole schema.'
              message:
                type: string
        types:
          type: array
          items:
            $ref: '#/components/schemas/FgaType'
        canonical:
          type:
            - string
            - 'null'
          description: 'The schema as the platform prints it, when valid.'
    FgaTupleWrite:
      type: object
      required:
        - written
        - deleted
        - consistency_token
      properties:
        written:
          type: integer
          description: 'Tuples that were new. Re-writing an existing one is not counted.'
        deleted:
          type: integer
          description: 'Tuples that were there to delete.'
        consistency_token:
          type: string
          description: 'Pass to a check that must see this write.'
    FgaCheck:
      type: object
      required:
        - allowed
        - resource_type
        - resource_id
        - relation
        - subject
        - consistency_token
      properties:
        allowed:
          type: boolean
        resource_type:
          type: string
        resource_id:
          type: string
        relation:
          type: string
        subject:
          $ref: '#/components/schemas/FgaSubject'
        consistency_token:
          type: string
          description: 'The revision the answer was decided at.'
    FgaCheckBatch:
      type: object
      required:
        - results
        - consistency_token
      properties:
        results:
          type: array
          description: 'One answer per check, in the order asked.'
          items:
            $ref: '#/components/schemas/FgaCheck'
        consistency_token:
          type:
            - string
            - 'null'
    FgaObject:
      type: object
      required:
        - type
        - id
      properties:
        type:
          type: string
        id:
          type: string
    AuditLogSettings:
      type: object
      required:
        - retention_days
        - strict_schemas
      properties:
        retention_days:
          type: integer
          description: 'Events are kept this many days after they arrive.'
        strict_schemas:
          type: boolean
          description: 'Whether an action with no schema is refused.'
    RadarSettings:
      type: object
      required:
        - mode
        - mode_inherited
        - deployment_mode
        - ip_intelligence
        - builtin_rules
      properties:
        mode:
          type: string
          enum:
            - monitor
            - enforce
          description: 'monitor records every verdict and acts on none; enforce blocks and challenges.'
        mode_inherited:
          type: boolean
          description: "True while the environment follows the deployment's default (RISK_MODE) rather than a mode it chose."
        deployment_mode:
          type: string
          enum:
            - monitor
            - enforce
        ip_intelligence:
          type: string
          enum:
            - none
            - maxmind
            - ipinfo
          description: 'The configured IP intelligence source. With none, country, network and travel facts are unknown and the rules on them never fire.'
        builtin_rules:
          type: array
          items:
            type: object
            required:
              - key
              - name
              - description
              - applies_to
              - enabled
              - action
              - threshold
              - threshold_unit
              - threshold_min
              - threshold_max
            properties:
              key:
                type: string
                enum:
                  - credential_stuffing
                  - bot_velocity
                  - account_attack
                  - impossible_travel
                  - new_device
                  - anonymous_network
                  - hosting_network
                  - disposable_email
                  - risk_score_reject
                  - risk_score_elevated
              name:
                type: string
              description:
                type: string
              applies_to:
                type: string
                enum:
                  - all
                  - sign_in
                  - sign_up
              enabled:
                type: boolean
              action:
                type: string
                enum:
                  - allow
                  - challenge
                  - block
              threshold:
                type:
                  - integer
                  - 'null'
                description: 'null for a rule that counts nothing.'
              threshold_unit:
                type:
                  - string
                  - 'null'
              threshold_min:
                type:
                  - integer
                  - 'null'
              threshold_max:
                type:
                  - integer
                  - 'null'
    RadarRule:
      type: object
      required:
        - id
        - name
        - description
        - position
        - enabled
        - applies_to
        - action
        - conditions
        - summary
        - created_at
        - updated_at
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type:
            - string
            - 'null'
        position:
          type: integer
          description: '1 is evaluated first; the first rule whose conditions all hold decides.'
        enabled:
          type: boolean
        applies_to:
          type: string
          enum:
            - all
            - sign_in
            - sign_up
        action:
          type: string
          enum:
            - allow
            - challenge
            - block
        conditions:
          type: array
          items:
            type: object
            required:
              - field
              - operator
              - value
            properties:
              field:
                type: string
              operator:
                type: string
                enum:
                  - eq
                  - neq
                  - in
                  - not_in
                  - gt
                  - gte
                  - lt
                  - lte
                  - contains
                  - not_contains
                  - starts_with
                  - ends_with
                  - in_cidr
                  - not_in_cidr
              value:
                description: 'Normalised: a string, a number, true/false, or a list for the list operators.'
                oneOf:
                  - type: string
                  - type: number
                  - type: boolean
                  -
                    type: array
                    items:
                      oneOf:
                        - type: string
                        - type: number
        summary:
          type: string
          description: 'The conditions as a person reads them.'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    RadarListEntry:
      type: object
      required:
        - id
        - list
        - kind
        - value
        - note
        - expires_at
        - active
        - created_at
      properties:
        id:
          type: string
        list:
          type: string
          enum:
            - allow
            - deny
        kind:
          type: string
          enum:
            - ip
            - email
            - email_domain
            - device
        value:
          type: string
          description: 'Normalised: an IP or CIDR range, a lower-case address or domain, or a device id.'
        note:
          type:
            - string
            - 'null'
        expires_at:
          type:
            - string
            - 'null'
          format: date-time
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
    RadarDecision:
      type: object
      required:
        - id
        - assessed_at
        - flow
        - method
        - verdict
        - enforced
        - mode
        - rule
        - rule_name
        - triggered
        - reasons
        - risk_score
        - risk_outcome
        - country
        - asn
        - email_domain
        - device
        - facts
      properties:
        id:
          type: string
        assessed_at:
          type: string
          format: date-time
        flow:
          type: string
          enum:
            - sign_in
            - sign_up
        method:
          type:
            - string
            - 'null'
          enum:
            - password
            - magic_link
            - passkey
            - sign_up
            - null
        verdict:
          type: string
          enum:
            - allow
            - challenge
            - block
        enforced:
          type: boolean
          description: 'Whether the verdict was acted on; false under monitor.'
        mode:
          type: string
          enum:
            - monitor
            - enforce
        rule:
          type:
            - string
            - 'null'
          description: 'What decided it: deny_list:<kind>, allow_list:<kind>, rule:<id>, builtin:<key>; null when nothing matched.'
        rule_name:
          type:
            - string
            - 'null'
        triggered:
          type: array
          description: 'Every rule that fired, the deciding one included.'
          items:
            type: object
            required:
              - rule
              - name
            properties:
              rule:
                type: string
              name:
                type: string
        reasons:
          type: array
          items:
            type: string
        risk_score:
          type: number
        risk_outcome:
          type: string
          enum:
            - allow
            - flag
            - challenge
            - step_up
            - reject
        country:
          type:
            - string
            - 'null'
        asn:
          type:
            - integer
            - 'null'
        email_domain:
          type:
            - string
            - 'null'
        device:
          type:
            - string
            - 'null'
          description: 'The device id (a pseudonym of the device cookie), for a returning device.'
        facts:
          type: object
          description: 'The facts the rules were evaluated on — never the IP, the address or the user agent.'
    AuditLogVerification:
      type: object
      required:
        - organization_id
        - valid
        - complete
        - verified_count
        - first_sequence
        - last_sequence
        - head_sequence
        - broken_at_sequence
        - reason
      properties:
        organization_id:
          type: string
        valid:
          type: boolean
          description: 'Every event checked is unchanged and in place.'
        complete:
          type: boolean
          description: "The check reached the chain's head. When false, continue from last_sequence + 1."
        verified_count:
          type: integer
        first_sequence:
          type:
            - integer
            - 'null'
        last_sequence:
          type:
            - integer
            - 'null'
        head_sequence:
          type: integer
        broken_at_sequence:
          type:
            - integer
            - 'null'
        reason:
          type:
            - string
            - 'null'
          enum:
            - missing
            - link
            - hash
            - truncated
            - null
    Directory:
      type: object
      required:
        - id
        - organization_id
        - name
        - provider
        - pull
        - active
        - status
      description: "A directory syncing an organization's people in. Its token and credentials are never returned after they are minted."
      properties:
        id:
          type: string
        organization_id:
          type: string
        name:
          type: string
        provider:
          type: string
          enum:
            - scim
            - google_workspace
            - microsoft_entra
            - workday
            - bamboohr
            - rippling
            - hibob
            - personio
        pull:
          type: boolean
          description: 'true when this platform fetches from the provider; false for a SCIM endpoint the provider posts to.'
        hris:
          type: boolean
          description: 'true for an HR system (Workday, BambooHR, Rippling, HiBob, Personio): employment dates decide access and departments become groups.'
        active:
          type: boolean
        status:
          type: string
          enum:
            - active
            - paused
        scim_base_url:
          type:
            - string
            - 'null'
          description: 'Where the identity provider sends SCIM requests. null for a pull directory.'
        last_synced_at:
          type:
            - string
            - 'null'
          format: date-time
        last_sync_error:
          type:
            - string
            - 'null'
          description: 'Why the last pull failed, or for a partial one how many records could not be synced and the first reason. Never names a person.'
        last_sync_started_at:
          type:
            - string
            - 'null'
          format: date-time
          description: 'When the last pull started. null for a SCIM directory.'
        last_sync_status:
          type:
            - string
            - 'null'
          enum:
            - running
            - succeeded
            - partial
            - failed
            - null
          description: 'How the last pull went. partial: the provider answered but some records could not be reconciled, or a mass deprovisioning was refused.'
        last_sync_stats:
          type:
            - object
            - 'null'
          description: "The last pull's counts, and up to 50 records it could not reconcile — by the provider's own id, never by name or email."
          properties:
            mode:
              type: string
              enum:
                - full
                - incremental
            provisioned:
              type: integer
            deprovisioned:
              type: integer
            groups:
              type: integer
            skipped:
              type: integer
              description: 'Leavers and people who have not started, who never had an account.'
            failed:
              type: integer
            failures:
              type: array
              items:
                type: object
                properties:
                  external_id:
                    type:
                      - string
                      - 'null'
                  reason:
                    type: string
        sync_interval_minutes:
          type:
            - integer
            - 'null'
          description: 'Minutes between scheduled pulls. null for a SCIM directory.'
        next_sync_at:
          type:
            - string
            - 'null'
          format: date-time
        custom_attributes:
          type:
            - array
            - 'null'
          items:
            type: string
          description: "HR systems only: the HR system's own field names copied onto each person."
        created_at:
          type:
            - string
            - 'null'
          format: date-time
        bearer_token:
          type:
            - string
            - 'null'
          description: |
            The SCIM bearer token, on the create and rotate answers only — shown once, never
            retrievable again. `null` on an idempotent replay of that answer.
    DirectoryGroup:
      type: object
      required:
        - id
        - directory_id
        - name
        - role_ids
      properties:
        id:
          type: string
        directory_id:
          type: string
        name:
          type: string
        external_id:
          type:
            - string
            - 'null'
        role_ids:
          type: array
          items:
            type: string
          description: 'The roles everyone in the group holds.'
    ProvisioningTarget:
      type: object
      required:
        - id
        - organization_id
        - name
        - base_url
        - auth_scheme
        - active
