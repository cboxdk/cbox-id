  - name: Branding
  - name: Domains
  - name: Events
  - name: 'Frontend keys'
  - name: 'Inline hooks'
  - name: 'Management keys'
  - name: 'Legacy login'
  - name: 'Log streams'
  - name: 'SAML apps'
  - name: Sign-in
  - name: Webhooks
paths:
  '/action-approvals/{id}':
    get:
      tags:
        - Approvals
      summary: 'Where an approval this key asked for stands'
      description: |
        Any key may poll the approvals it raised, and only those: another key's id is a 404.
        `status` is `pending`, `approved`, `denied`, `expired` or `consumed`.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - id
                      - status
                    properties:
                      id:
                        type: string
                      status:
                        type: string
                        enum:
                          - pending
                          - approved
                          - denied
                          - expired
                          - consumed
        401:
          $ref: '#/components/responses/Unauthorized'
        404:
          $ref: '#/components/responses/NotFound'
        429:
          $ref: '#/components/responses/TooManyRequests'
  '/api-keys/{id}':
    delete:
      tags:
        - 'API keys'
      summary: 'Revoke a member API key'
      description: |
        Requires scope `api_keys:write`. The key stops verifying at once. Idempotent — an
        already-revoked key is a 204 too. Recorded as `api_key.revoked`, with this
        management key as the actor.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        204:
          description: Revoked.
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        429:
          $ref: '#/components/responses/TooManyRequests'
  /apis:
    get:
      tags:
        - APIs
      summary: 'List registered APIs'
      description: 'Requires scope `apis:read`.'
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/After'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Api'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        429:
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags:
        - APIs
      summary: 'Register an API and its scopes'
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      description: |
        Requires scope `apis:write`. Registering an API is the environment's act; no tenant
        surface can. `identifier` is an absolute URI (RFC 8707) and becomes the token's
        `aud`. Scope keys are unique across the environment. `client_id` links the app whose
        roles and permissions the API enforces, and must have the API's owner.
        `organization_id` makes the API one organization's; left out, the environment owns
        it. Refusals are `422 invalid_api` with the reason.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - identifier
                - name
              properties:
                identifier:
                  type: string
                  format: uri
                  maxLength: 255
                name:
                  type: string
                  maxLength: 120
                organization_id:
                  type:
                    - string
                    - 'null'
                client_id:
                  type:
                    - string
                    - 'null'
                scopes:
                  type: array
                  items:
                    $ref: '#/components/schemas/ApiScope'
      responses:
        201:
          description: Registered.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Api'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        409:
          $ref: '#/components/responses/Conflict'
        422:
          $ref: '#/components/responses/UnprocessableEntity'
        429:
          $ref: '#/components/responses/TooManyRequests'
  '/apis/{id}':
    get:
      tags:
        - APIs
      summary: 'Get an API'
      description: 'Requires scope `apis:read`.'
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Api'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        429:
          $ref: '#/components/responses/TooManyRequests'
    patch:
      tags:
        - APIs
      summary: 'Change an API'
      description: |
        Requires scope `apis:write`. Any of: `name`; `client_id` (null unlinks the app);
        `scopes`, which is the **complete** set afterwards — scopes named are added or
        updated, scopes left out are removed. All or nothing. The identifier never changes:
        register a new API instead.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 120
                client_id:
                  type:
                    - string
                    - 'null'
                scopes:
                  type: array
                  items:
                    $ref: '#/components/schemas/ApiScope'
      responses:
        200:
          description: 'The API after the change.'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Api'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        422:
          $ref: '#/components/responses/UnprocessableEntity'
        429:
          $ref: '#/components/responses/TooManyRequests'
    delete:
      tags:
        - APIs
      summary: 'Delete an API and its scopes'
      description: |
        Requires scope `apis:write`. Tokens already minted for it keep their `aud` until they
        expire; apps holding its scope keys keep them as plain scopes.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        204:
          description: Deleted.
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        429:
          $ref: '#/components/responses/TooManyRequests'
  '/apis/{id}/scopes/{key}':
    put:
      tags:
        - APIs
      summary: 'Add a scope to an API, or change the description or tenant access of one it owns.'
      description: 'Requires scope `apis:write`. Danger: write.'
      operationId: apis_scopes_define
      x-action: apis.scopes.define
      parameters:
        -
          name: id
