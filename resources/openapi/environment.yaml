            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 190
                redirect_uris:
                  type: array
                  description: 'The COMPLETE list afterwards.'
                  maxItems: 50
                  items:
                    type: string
                    maxLength: 2048
                post_logout_redirect_uris:
                  type: array
                  description: 'The COMPLETE list afterwards.'
                  maxItems: 50
                  items:
                    type: string
                    maxLength: 2048
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/App'
        202:
          $ref: '#/components/responses/ApprovalRequired'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        409:
          $ref: '#/components/responses/Conflict'
        422:
          $ref: '#/components/responses/UnprocessableEntity'
        429:
          $ref: '#/components/responses/TooManyRequests'
  '/apps/{id}/blueprint':
    get:
      tags:
        - Apps
      summary: "Export an app's configuration as a blueprint"
      description: |
