      properties:
        error:
          type: string
          description: 'Stable machine code'
        message:
          type: string
          description: 'Human-readable explanation'
        request_id:
          type: string
          description: 'The id this request was served under, also sent as the X-Request-Id header. Quote it when reporting a problem.'
        errors:
          type: object
          description: |
            Present on `validation_failed` only: the offending request fields, each
            mapped to its messages.
          additionalProperties:
            type: array
            items:
              type: string
    BearerChallenge:
      type: object
      required:
        - error
        - error_description
      description: |
        RFC 6750 §3 error shape, used by the OAuth-token-authenticated Token Vault
        endpoints. NOT the `{error, message}` envelope — restating the envelope here
        would be a protocol conformance bug.
      properties:
        error:
          type: string
          enum:
            - invalid_request
            - invalid_token
            - insufficient_scope
        error_description:
          type: string
  responses:
    ApprovalRequired:
      description: |
        Held for a person's approval: this key's policy requires its owner to approve this
        action on their device first. Poll `approval.poll_url`, then repeat the same request
        (same body, same `Idempotency-Key`) with `Cbox-Approval: <approval.id>`.
      content:
        application/json:
          schema:
            type: object
            required:
              - error
              - message
              - approval
            properties:
              error:
                type: string
                enum:
                  - approval_required
              message:
                type: string
              approval:
                type: object
                required:
                  - id
                  - status
                  - binding_code
                  - expires_at
                  - poll_url
                properties:
                  id:
                    type: string
                  status:
                    type: string
                  binding_code:
                    type: string
                  expires_at:
                    type: string
                    format: date-time
                  poll_url:
                    type: string
                    format: uri
    Unauthorized:
      description: 'Missing or invalid environment API key.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: 'The key is missing the scope this endpoint requires.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: 'No such resource in this environment.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    EnvironmentRequired:
      description: |
        A `WorkspaceAccessToken` on the platform root's host named no environment
        (`error: environment_required`): send `Cbox-Environment`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableEntity:
      description: |
        Validation failed (`error: validation_failed`, with a field-keyed `errors` map),
        or a uniqueness conflict (e.g. slug/email taken).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: |
        The request conflicts with the resource's state; `error` names which rule
        (`last_owner`, `already_member`, `not_pending`, `role_conflict`, …).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    MailFailed:
      description: 'The mail server refused the invitation mail (`error: mail_failed`). Retry.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: |
        The key's rate limit for this plane is exhausted. The bucket is keyed on the API
        KEY, so this reflects only your own traffic.
      headers:
        Retry-After:
          description: 'Seconds to wait before retrying.'
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BearerUnauthorized:
      description: 'Missing, expired, or wrongly-audienced access token (RFC 6750 challenge).'
      headers:
        WWW-Authenticate:
          description: 'Bearer error="invalid_token", error_description="…"'
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BearerChallenge'
    ApprovalNotActionable:
      description: |
        The request is no longer pending. Deliberately uniform — unknown, expired, already
        answered and belonging-to-another-subject are ONE response with a constant
        message, so someone holding a stolen handset cannot learn whether a given request
        id exists or whose it is.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: approval_not_actionable
            message: 'This request is no longer pending. It may have expired or already been answered.'
    BearerForbidden:
      description: 'The access token does not carry the scope this endpoint requires.'
      headers:
        WWW-Authenticate:
          description: 'Bearer error="insufficient_scope", scope="…"'
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BearerChallenge'
