                      maxLength: 128
                    role_arn:
                      type:
                        - string
                        - 'null'
                      description: "S3 with an assumed role: the IAM role the platform assumes. No secret is stored; the role's trust policy must require the stream's `external_id`."
                      maxLength: 2048
                    sse:
