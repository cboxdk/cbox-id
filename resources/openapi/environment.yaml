          $ref: '#/components/responses/UnprocessableEntity'
        429:
          $ref: '#/components/responses/TooManyRequests'
    patch:
      tags:
        - Sign-in
      summary: "Change the authentication policy of the environment baseline, or tighten one organization's override. Requiring SSO signs out password sessions."
      description: 'Requires scope `signin:write`. Danger: critical.'
      operationId: signin_policy_update
      x-action: signin.policy.update
      x-scope: 'signin:write'
      x-danger: critical
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CboxApproval'
