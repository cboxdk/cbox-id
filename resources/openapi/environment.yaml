          type: string
          description: 'e.g. `user.created` — the webhook event name.'
        organization_id:
          type:
            - string
            - 'null'
        occurred_at:
          type:
            - string
            - 'null'
          format: date-time
        payload:
          type: object
    AuditEntry:
      type: object
      required:
        - id
        - action
        - actor_type
        - actor_id
        - organization_id
        - target_type
        - target_id
        - context
        - recorded_at
      properties:
        id:
          type: string
          description: 'A ULID; pass the last one you saw as `after`.'
        action:
          type: string
          description: 'e.g. `webhook.created`.'
        actor_type:
          type: string
          enum:
            - user
            - service
            - system
            - operator
            - organization_member
        actor_id:
          type:
            - string
