components:
  securitySchemes:
    EnvironmentApiKey:
      type: http
      scheme: bearer
      bearerFormat: cbid_env_
      description: |
        An environment API key, `cbid_env_…`. Created by the account that owns the environment,
        in the console under Identity platform › Environment keys — not in the environment's own
        console. Bound to that environment's host, and carries an explicit list of scopes; it may
        also carry an expiry.
    AppClientCredentials:
      type: http
      scheme: basic
      description: |
        Your APP's own client credentials — `client_id:client_secret` as HTTP Basic
        (`client_secret_basic`). `client_secret_post` and `private_key_jwt` are accepted
        too, in the body, exactly as at the token endpoint.
    VaultManagerToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        An OAuth access token carrying the `vault.manage` scope. NOT an environment API
        key: these routes are guarded by `scope:vault.manage`, which introspects an
        access token, and a `cbid_env_` key introspects as inactive. Its `org` claim
        selects the organization whose secrets it administers.
    AgentToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        An OAuth access token carrying the `vault.lease` scope. Its `org` claim selects
        the organization whose secrets it may open — the vault's tenancy boundary.
    AuthenticatorToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A DPoP-bound OAuth access token held by the Cbox ID authenticator app, obtained
        via authorization_code + PKCE (S256) as a public client.

        Because the token carries a `cnf.jkt`, every request must present it under the
        `DPoP` auth scheme together with a matching proof — `htm`, `htu`, a fresh `jti`,
        an `iat` within 60 seconds, and an `ath` equal to the SHA-256 of the token
        itself. A plain `Bearer` presentation of a bound token is rejected.
  parameters:
    CboxApproval:
      name: Cbox-Approval
      in: header
      required: false
      description: 'The id of an approval this key asked for (from a `202 approval_required`), once the person approved it. Spent by this request, once.'
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 'Any unique string (a UUID). A retry with the same key and request gets the first answer back.'
      schema:
        type: string
        maxLength: 255
    ScopeKey:
      name: key
      in: path
      required: true
      description: 'The scope key, for example `tax:assess`.'
      schema:
        type: string
        maxLength: 128
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
    InvitationId:
      name: invitationId
      in: path
      required: true
      schema:
        type: string
    RoleId:
      name: roleId
      in: path
      required: true
      description: "The role's id — or its manifest `key`, together with `?client_id=` naming the app that declared it."
      schema:
        type: string
    RoleClientId:
      name: client_id
      in: query
      required: false
      description: 'The app whose manifest `key` `{roleId}` is. Not needed when `{roleId}` is an id.'
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    After:
      name: after
      in: query
      required: false
      description: 'Opaque cursor — the `meta.next_cursor` from the previous page.'
      schema:
        type: string
  schemas:
    Device:
      type: object
      required:
        - id
        - install_id
        - platform
        - name
        - status
      properties:
        id:
          type: string
        install_id:
          type: string
        platform:
          type: string
          enum:
            - ios
            - android
        name:
          type: string
        status:
          type: string
          enum:
            - active
            - retired
          description: |
            Operator/user INTENT, not delivery health. A device can be active and
            currently failing, or retired and perfectly reachable.
        app_version:
          type:
            - string
            - 'null'
        os_version:
          type:
            - string
            - 'null'
        model:
          type:
            - string
            - 'null'
        last_seen_at:
          type:
            - string
            - 'null'
          format: date-time
        created_at:
          type:
            - string
            - 'null'
          format: date-time
    Approval:
      type: object
      required:
        - id
        - client_id
        - client_name
        - scopes
      properties:
        id:
          type: string
          description: |
            The INTERNAL request id. Never `auth_req_id`, which is the initiating
            client's polling secret and is stored only as a SHA-256 hash — a client must
            not be able to approve its own request.
        client_id:
          type: string
        client_name:
          type: string
        binding_message:
          type:
            - string
            - 'null'
          description: |
            The transaction description the user compares against what the requesting app
            showed them. This is the anti-phishing primitive, and the reason approvals are
            fetched rather than pushed.
        scopes:
          type: array
          items:
            type: object
            required:
              - scope
              - label
            properties:
              scope:
                type: string
              label:
                type: string
                description: 'Human wording, identical to the console.'
        organization_id:
          type:
            - string
            - 'null'
        requested_at:
          type:
            - string
            - 'null'
          format: date-time
        expires_at:
          type:
            - string
            - 'null'
          format: date-time
    ApprovalDecision:
      type: object
      required:
        - id
        - status
      properties:
        id:
          type: string
        status:
          type: string
          enum:
            - approved
            - denied
    VaultSecret:
      type: object
      required:
        - id
        - name
        - provider
        - revoked
      properties:
        id:
          type: string
        name:
          type: string
        provider:
          type: string
        owner_type:
          type:
            - string
            - 'null'
          enum:
            - organization
            - user
            - null
        owner_id:
          type:
            - string
            - 'null'
        expires_at:
          type:
            - string
            - 'null'
          format: date-time
        revoked:
          type: boolean
