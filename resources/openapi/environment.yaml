            type: string
            description: 'The `next_cursor` of the previous page.'
        - $ref: '#/components/parameters/CboxApproval'
        - $ref: '#/components/parameters/CboxEnvironment'
      security:
        -
          EnvironmentApiKey: []
        -
          WorkspaceAccessToken: []
      responses:
