        baseline:
          $ref: '#/components/schemas/SignInRules'
        override:
          description: 'What the organization stored itself; null when it inherits (and always for the baseline).'
          oneOf:
            - $ref: '#/components/schemas/SignInRules'
            - type: 'null'
        inheriting:
          type: boolean
          description: 'True for an organization with no override of its own.'
    SocialProvider:
      type: object
