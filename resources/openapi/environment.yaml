        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        409:
          $ref: '#/components/responses/Conflict'
        422:
          $ref: '#/components/responses/UnprocessableEntity'
        429:
          $ref: '#/components/responses/TooManyRequests'
    delete:
      tags:
        - APIs
      summary: 'Remove a scope from an API. Apps holding it keep it as a plain scope that no longer reaches the API.'
      description: 'Requires scope `apis:write`. Danger: destructive.'
      operationId: apis_scopes_remove
      x-action: apis.scopes.remove
      parameters:
