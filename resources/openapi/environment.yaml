      security:
        -
          EnvironmentApiKey: []
        -
          ManagementAccessToken: []
        -
          WorkspaceAccessToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                organization_id:
                  type:
                    - string
                    - 'null'
                  description: "Write this organization's override. Left out, the environment baseline."
                  maxLength: 64
                min_length:
                  type: integer
                  description: 'Minimum password length.'
                  minimum: 8
                  maximum: 128
                require_breach_check:
                  type: boolean
                  description: 'Refuse passwords that appear in known breaches.'
                max_age_days:
                  type:
                    - integer
                    - 'null'
                  description: 'Days before a password must be changed; null for no limit.'
                  minimum: 1
                  maximum: 3650
                reuse_history:
                  type: integer
                  description: 'How many previous passwords may not be reused.'
                  minimum: 0
                  maximum: 24
                mfa:
                  type: string
                  description: 'Whether a second factor is off, optional or required.'
                  enum:
                    - 'off'
                    - optional
                    - required
                sso:
                  type: string
                  description: 'Whether SSO is off, preferred, or required — `required` refuses every other way in and signs out password sessions.'
                  enum:
                    - 'off'
                    - preferred
                    - required
                lockout_threshold:
                  type:
                    - integer
                    - 'null'
                  description: 'Failed attempts before an account is locked; null for the deployment default (10 inside 15 minutes unless CBOX_ID_LOCKOUT_THRESHOLD says otherwise).'
                  minimum: 3
                  maximum: 100
      responses:
        200:
          description: OK
