      properties:
        id:
          type: string
        organization_id:
          type:
            - string
            - 'null'
        provider:
          type:
            - string
            - 'null'
          description: 'The catalogue key: google, github, apple…'
        name:
          type: string
        protocol:
          type: string
          enum:
            - oidc
            - oauth2
        status:
          type: string
        callback_uri:
          type: string
          description: 'The redirect URI to register with the provider.'
        created_at:
          type:
            - string
            - 'null'
          format: date-time
    FrontendKey:
      type: object
      required:
        - id
