            - string
            - 'null'
        name:
          type: string
        client_id:
          type:
            - string
            - 'null'
        tenant_assignable:
          type: boolean
        user_id:
          type: string
        organization_id:
          type:
            - string
            - 'null'
          description: 'The organization it is held in; null for an environment-wide (staff) grant.'
        source:
          type: string
          enum:
            - manual
            - pushed
            - system
    App:
      type: object
      required:
        - id
        - client_id
        - name
        - type
        - client_type
        - grant_types
        - redirect_uris
        - scopes
        - first_party
      properties:
        id:
          type: string
        client_id:
          type: string
        name:
          type: string
        type:
          type: string
          enum:
            - web
            - spa
            - cli
            - service
            - agent
            - advanced
          description: 'The kind, read back from its grants; `advanced` when they match no preset.'
        client_type:
          type: string
          enum:
            - confidential
            - public
        organization_id:
          type:
            - string
            - 'null'
        first_party:
          type: boolean
        grant_types:
          type: array
          items:
            type: string
        redirect_uris:
          type: array
          items:
            type: string
        post_logout_redirect_uris:
          type: array
          items:
            type: string
        scopes:
          type: array
          items:
            type: string
        manifest_url:
          type:
            - string
            - 'null'
          description: 'Where it publishes its roles-and-permissions manifest.'
        access_token_ttl:
          type:
            - integer
            - 'null'
          description: "Its access-token lifetime in seconds; null for the install's default."
        backchannel_logout_uri:
          type:
            - string
            - 'null'
          description: 'Where it is sent a logout token (OIDC Back-Channel Logout); null when it is not told.'
        backchannel_logout_session_required:
          type: boolean
        api_key_prefix:
          type:
            - string
            - 'null'
          description: 'The prefix of its customer API keys; null when it accepts none.'
        created_at:
          type:
            - string
            - 'null'
          format: date-time
        client_secret:
          type:
            - string
            - 'null'
          description: 'Only on the response that created (or copied) the app, and only for an app that authenticates with a secret. Never again — null on an idempotent replay.'
    AppSecret:
      type: object
      required:
        - id
      properties:
        id:
          type: string
        hint:
          type:
            - string
            - 'null'
          description: 'The characters the secret ends in; null for one older than per-secret storage.'
        created_at:
          type:
            - string
            - 'null'
          format: date-time
        expires_at:
          type:
            - string
            - 'null'
          format: date-time
          description: 'Set on a secret a rotation replaced — it stops working then.'
        last_used_at:
          type:
            - string
            - 'null'
          format: date-time
        client_secret:
          type:
            - string
            - 'null'
          description: 'Only on the rotation that minted it. Never again — null on an idempotent replay.'
        previous_expire_at:
          type:
            - string
            - 'null'
          format: date-time
          description: 'On a rotation — when the secrets it replaced stop working.'
    AppBlueprint:
      type: object
