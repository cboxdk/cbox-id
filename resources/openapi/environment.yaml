                client_id:
                  type:
                    - string
                    - 'null'
                scopes:
                  type: array
                  items:
                    $ref: '#/components/schemas/ApiScope'
      responses:
        201:
          description: Registered.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Api'
        400:
