        organization_id:
          type:
            - string
            - 'null'
        target_type:
          type:
            - string
            - 'null'
        target_id:
          type:
            - string
            - 'null'
        context:
          type: object
        ip:
          type:
            - string
            - 'null'
        recorded_at:
          type:
            - string
            - 'null'
          format: date-time
    ApiKey:
      type: object
      required:
        - id
