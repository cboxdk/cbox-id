        - $ref: '#/components/parameters/CboxEnvironment'
      security:
        -
          EnvironmentApiKey: []
        -
          ManagementAccessToken: []
        -
          WorkspaceAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                organization_id:
                  type:
                    - string
                    - 'null'
                  description: 'The organization the connection belongs to. Send this or environment_wide.'
                  maxLength: 64
                environment_wide:
                  type: boolean
                  description: "True to make the connection the environment's own rather than one organization's. Send this or organization_id."
                name:
                  type: string
                  description: 'What administrators call it: "Okta", "Entra ID".'
                  maxLength: 120
                type:
                  type: string
                  description: 'saml or oidc. The config fields of that type are required, unless pending_idp.'
                  enum:
                    - saml
                    - oidc
                pending_idp:
                  type: boolean
                  description: "True to create the draft before the identity provider's details are known: the answer's service_provider is what to paste into it. Complete it with update before activating."
                idp_entity_id:
                  type:
                    - string
                    - 'null'
                  description: "SAML: the identity provider's entity id."
                  maxLength: 500
                idp_sso_url:
                  type:
                    - string
                    - 'null'
                  description: "SAML: the identity provider's single sign-on URL."
                  format: uri
                  maxLength: 500
                idp_x509cert:
                  type:
                    - string
                    - 'null'
                  description: "SAML: the identity provider's signing certificate (PEM). Write-only."
                  maxLength: 20000
                sp_entity_id:
                  type:
                    - string
                    - 'null'
                  description: "SAML: the entity id this environment presents as the service provider. Left out on create, this connection's own."
                  maxLength: 500
                sp_acs_url:
                  type:
                    - string
                    - 'null'
                  description: "SAML: where the identity provider posts its assertions. Left out on create, this connection's own ACS URL."
                  format: uri
                  maxLength: 500
                issuer:
                  type:
                    - string
                    - 'null'
                  description: "OIDC: the provider's issuer URL; its endpoints are discovered from it."
                  format: uri
                  maxLength: 500
                client_id:
                  type:
                    - string
                    - 'null'
                  description: 'OIDC: the client id registered at the provider.'
                  maxLength: 500
                client_secret:
                  type:
                    - string
                    - 'null'
                  description: 'OIDC: the client secret. Write-only.'
                  maxLength: 500
                signing_key:
                  type:
                    - string
                    - 'null'
                  description: "OIDC, optional: the provider's ID-token signing key (an RS256 public key, PEM). Leave it out for any provider whose discovery document publishes a jwks_uri — the keys are read from there and follow its rotations. Needed only when it does not. Write-only."
                  maxLength: 20000
              required:
                - name
                - type
      responses:
        201:
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/SsoConnection'
        202:
          $ref: '#/components/responses/ApprovalRequired'
        400:
          $ref: '#/components/responses/EnvironmentRequired'
        401:
