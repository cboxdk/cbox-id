  /radar/rules:
    post:
      tags:
        - Radar
      summary: 'Add a Radar rule: when EVERY condition (field, operator, value) holds, allow, challenge or block. Rules run in order after the allow/deny lists and before the built-in rules; the first match decides. Example: country not_in [DK, SE] → challenge.'
      description: 'Requires scope `radar:write`. Danger: write.'
      operationId: radar_rules_create
      x-action: radar.rules.create
      x-scope: 'radar:write'
      x-danger: write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CboxApproval'
        - $ref: '#/components/parameters/CboxEnvironment'
      security:
        -
          EnvironmentApiKey: []
        -
          WorkspaceAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'What the rule is for, as the console lists it.'
                  maxLength: 120
                description:
                  type:
                    - string
                    - 'null'
                  description: 'Why the rule exists, for whoever reads it next.'
                  maxLength: 500
                action:
                  type: string
                  description: 'What happens when every condition holds: `allow` (skip every rule after this one), `challenge` (a second factor on sign-in; a CAPTCHA or an emailed code on sign-up) or `block`.'
                  enum:
                    - allow
                    - challenge
                    - block
                applies_to:
                  type: string
                  description: '`all` (the default), `sign_in` or `sign_up`.'
                  enum:
                    - all
                    - sign_in
                    - sign_up
                conditions:
                  type: array
                  description: 'Up to 10 conditions; the rule matches when EVERY one holds. A fact that is unknown (no IP intelligence, no address on a passkey sign-in) matches no condition.'
                  minItems: 1
                  maxItems: 10
                  items:
                    type: object
                    properties:
                      field:
                        type: string
                        description: 'The fact to test.'
                        enum:
                          - ip
                          - country
                          - asn
                          - as_organization
                          - is_hosting
                          - is_vpn
                          - is_proxy
                          - is_tor
                          - email
                          - email_domain
                          - disposable_email
                          - user_agent
                          - method
                          - new_device
                          - impossible_travel
                          - travel_kmh
                          - risk_score
                          - ip_attempts_1m
                          - ip_attempts_1h
                          - ip_distinct_emails_10m
                          - ip_failures_1h
                          - email_attempts_1h
                          - email_failures_1h
                          - device_attempts_1h
                      operator:
                        type: string
                        description: 'How to compare it. Which operators a field takes depends on its type.'
                        enum:
                          - eq
                          - neq
                          - in
                          - not_in
                          - gt
                          - gte
                          - lt
                          - lte
                          - contains
                          - not_contains
                          - starts_with
                          - ends_with
                          - in_cidr
                          - not_in_cidr
                      value:
                        type: string
                        description: 'The one value to compare with, as text — `DK`, `20`, `true`. For every operator except the list ones.'
                        maxLength: 255
                      values:
                        type: array
                        description: 'The values to compare with, for `in`, `not_in`, `in_cidr` and `not_in_cidr`.'
                        maxItems: 100
                        items:
                          type: string
                          maxLength: 255
                    required:
                      - field
                      - operator
                enabled:
                  type: boolean
                  description: 'Whether the rule is evaluated. Default true.'
                position:
                  type: integer
                  description: 'Where in the order to put it: 1 is evaluated first. Default: last.'
                  minimum: 1
              required:
                - name
                - action
                - conditions
      responses:
        201:
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/RadarRule'
        202:
