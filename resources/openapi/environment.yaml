          properties:
            sub:
              type: string
        reason:
          type: string
        scopes:
          type: array
          items:
            type: string
        expires_at:
          type: string
          format: date-time
        code:
          type:
            - string
            - 'null'
          description: 'The first authorization code, when `redirect_uri` and `code_challenge` were sent. Shown once.'
        redirect_uri:
          type:
            - string
            - 'null'
    ApiKeyVerificationRequest:
      type: object
      required:
        - key
      properties:
        key:
          type: string
          description: 'The API key your API was presented with.'
        client_id:
          type: string
          description: 'For `client_secret_post`.'
        client_secret:
          type: string
          description: 'For `client_secret_post`.'
        client_assertion_type:
          type: string
          description: 'For `private_key_jwt`.'
        client_assertion:
          type: string
          description: 'For `private_key_jwt`.'
    ApiKeyVerification:
      type: object
      required:
