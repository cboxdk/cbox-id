    post:
      tags:
        - 'Enterprise SSO'
      summary: "Connect an organization's SAML or OIDC identity provider as a draft. Activate it to start signing people in through it."
      description: 'Requires scope `sso:write`. Danger: write.'
      operationId: sso_connections_create
      x-action: sso.connections.create
      x-scope: 'sso:write'
      x-danger: write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
