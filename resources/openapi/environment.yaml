        enabled:
          type: boolean
        consecutive_failures:
          type: integer
        last_success_at:
          type:
            - string
            - 'null'
          format: date-time
        created_at:
          type:
            - string
            - 'null'
          format: date-time
        secret:
          type:
            - string
            - 'null'
          description: 'A generated HMAC key, on the create answer only — shown once. `null` on an idempotent replay.'
    DomainEvent:
      type: object
      required:
        - id
        - type
        - organization_id
        - occurred_at
        - payload
      properties:
        id:
          type: string
          description: 'A ULID; pass the last one you saw as `after`.'
