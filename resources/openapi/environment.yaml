        organization_id:
          type: string
        user_id:
          type: string
          description: 'Its holder.'
        client_id:
          type: string
          description: 'The app whose API it is for.'
        permissions:
          type: array
          items:
            type: string
        status:
          type: string
          enum:
            - active
            - expired
            - revoked
        revoked:
          type: boolean
        created_at:
          type:
            - string
            - 'null'
          format: date-time
        expires_at:
          type:
            - string
            - 'null'
          format: date-time
        last_used_at:
          type:
            - string
            - 'null'
          format: date-time
        revoked_at:
          type:
            - string
            - 'null'
          format: date-time
    SupportSession:
      type: object
      required:
        - id
        - user_id
        - organization_id
        - client_id
        - actor_id
        - act
        - reason
        - scopes
        - expires_at
      properties:
        id:
          type: string
        user_id:
          type: string
