        status:
          type: string
          enum:
            - draft
            - active
            - inactive
        active:
          type: boolean
        complete:
          type: boolean
          description: 'false for a draft created with pending_idp whose identity-provider details are still missing. Activation refuses it.'
        config:
          type: object
          description: 'The settings that are not secrets.'
          properties:
            idp_entity_id:
              type: string
            idp_sso_url:
              type: string
            sp_entity_id:
              type: string
            sp_acs_url:
              type: string
            issuer:
              type: string
