                      maxItems: 100
                      items:
                        type: string
                        maxLength: 200
                    hostname:
                      type:
                        - string
                        - 'null'
                      description: "Datadog: the `hostname` attribute. Default: this platform's host."
                      maxLength: 255
                    bucket:
