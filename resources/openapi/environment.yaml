        429:
          $ref: '#/components/responses/TooManyRequests'
    patch:
      tags:
        - Organizations
      summary: 'Rename an organization, or change its slug'
      description: |
        Requires scope `organizations:write`. A field left out is left alone; a request
        that changes nothing answers with the organization as it is and records nothing.
        A change is announced as the `organization.updated` webhook and recorded on the
        organization's trail as `organization.renamed`, with the values before and after.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 190
                slug:
                  type: string
                  minLength: 1
                  maxLength: 190
                  description: 'URL-safe; unique within the environment.'
      responses:
        200:
          description: 'The organization after the change.'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Organization'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        422:
          $ref: '#/components/responses/UnprocessableEntity'
        429:
          $ref: '#/components/responses/TooManyRequests'
    delete:
      tags:
        - Organizations
      summary: 'Archive an organization'
      description: |
        Requires scope `organizations:write`. **Archives** rather than erases: the status
        becomes `deleted`, every member loses access from their next request, the rows stay
        for the audit trail, and `organization.deleted` is announced. Idempotent — archiving
        an archived organization answers with it unchanged.

        Refused with `409 owns_products` for an organization that owns identity-provider
        projects on this platform (a platform customer, not a tenant of your app).
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        200:
          description: 'The archived organization.'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Organization'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        409:
          $ref: '#/components/responses/Conflict'
        429:
          $ref: '#/components/responses/TooManyRequests'
  '/organizations/{id}/api-keys':
    get:
      tags:
        - 'API keys'
      summary: "List the API keys an organization's members created for your apps"
      description: |
        Requires scope `api_keys:read`. Revoked and expired keys are included, marked by
        `status`. Never the key itself. Narrow to one app with `?client_id=`.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/After'
        -
          name: client_id
          in: query
          required: false
          schema:
            type: string
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApiKey'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        429:
          $ref: '#/components/responses/TooManyRequests'
  '/organizations/{id}/invitations':
    get:
      tags:
        - Invitations
      summary: "List an organization's pending invitations"
      description: 'Requires scope `invitations:read`. Pending and unexpired only.'
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/After'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Invitation'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        429:
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags:
        - Invitations
      summary: 'Invite someone to the organization'
      description: |
        Requires scope `invitations:write`. Mails a link; the person joins when they open it
        and confirm. Inviting an address again replaces its earlier pending invitation.

        - `role` — `admin` or `member` (default `member`). Never `owner`.
        - `roles` — access roles granted when the invitation is accepted: role ids, or your
          app's manifest **keys** when `client_id` names the app that declared them. Only
          roles the organization's own administrators could grant are accepted: a **staff
          role** is refused (`422 role_not_assignable`) — grant it after they join, with
          `PUT …/members/{userId}/roles/{roleId}`.
        - `client_id` + `return_to` — after accepting, the person is sent to `return_to`,
          which must be on one of that app's registered redirect-URI origins (checked again
          when the invitation is accepted).
        - `inviter_name` — who the mail says it is from. Defaults to the app's name, or the
          environment's.

        Refusals: `409 already_member`, `409 access_role_conflict` (segregation of duties),
        `422 unknown_role`, `422 role_not_assignable`, `422 unknown_app`,
        `422 return_without_app`, `422 return_to_malformed`, `422 return_to_not_registered`,
        `503 mail_failed` (nothing was created — retry).
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 190
                role:
                  $ref: '#/components/schemas/AssignableMemberRole'
                roles:
                  type: array
                  maxItems: 50
                  items:
                    type: string
                client_id:
                  type:
                    - string
                    - 'null'
                return_to:
                  type:
                    - string
                    - 'null'
                  format: uri
                  maxLength: 2048
                inviter_name:
                  type:
                    - string
                    - 'null'
                  maxLength: 120
      responses:
        201:
          description: Sent.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Invitation'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        409:
          $ref: '#/components/responses/Conflict'
        422:
          $ref: '#/components/responses/UnprocessableEntity'
        429:
          $ref: '#/components/responses/TooManyRequests'
        503:
          $ref: '#/components/responses/MailFailed'
  '/organizations/{id}/invitations/{invitationId}':
    delete:
      tags:
        - Invitations
      summary: 'Withdraw a pending invitation'
      description: |
        Requires scope `invitations:write`. The link stops working, and the roles parked
        for it go with it. `409 not_pending` for one already accepted, withdrawn or expired.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/InvitationId'
      responses:
        204:
          description: Withdrawn.
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        409:
          $ref: '#/components/responses/Conflict'
        429:
          $ref: '#/components/responses/TooManyRequests'
  '/organizations/{id}/invitations/{invitationId}/resend':
    post:
      tags:
        - Invitations
      summary: 'Mail a pending invitation again'
      description: |
        Requires scope `invitations:write`. On a **fresh link**: only a hash of the old one is
        kept, so it cannot be re-sent, and the reason people ask is usually that it expired.
        The response is the NEW invitation — its `id` replaces the old one, which stops
        working. Its roles and app context move with it.

        One re-send per address per minute (`429 too_soon`); `409 not_pending` for one that
        was accepted, withdrawn or has expired; `503 mail_failed` keeps the invitation.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/InvitationId'
      responses:
        200:
          description: 'Sent again.'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Invitation'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        409:
          $ref: '#/components/responses/Conflict'
        429:
          $ref: '#/components/responses/TooManyRequests'
        503:
          $ref: '#/components/responses/MailFailed'
  '/organizations/{id}/members':
    get:
      tags:
        - Members
      summary: "List an organization's members"
      description: 'Requires scope `members:read`. Every membership, whatever its status, oldest first.'
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/After'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Member'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        429:
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags:
        - Members
      summary: 'Add an existing user as a member'
      description: |
        Requires scope `members:write`. Straight in — no invitation, no mail. The user must
        exist in this environment (`422 user_not_found`).

        `role` is `admin` or `member` (default `member`). `owner` is never assignable:
        ownership moves with `transfer-ownership`.

        **Idempotent for the same role**: repeating the request answers `200` with the
        existing membership. A member on a *different* role is `409 already_member` — change
        the role with `PATCH`.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - user_id
              properties:
                user_id:
                  type: string
                role:
                  $ref: '#/components/schemas/AssignableMemberRole'
      responses:
        200:
          description: 'Already a member with that role — nothing changed.'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Member'
        201:
          description: Added.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Member'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        409:
          $ref: '#/components/responses/Conflict'
        422:
          $ref: '#/components/responses/UnprocessableEntity'
        429:
          $ref: '#/components/responses/TooManyRequests'
  '/organizations/{id}/members/{userId}':
    patch:
      tags:
        - Members
      summary: "Change a member's role"
      description: |
        Requires scope `members:write`. `role` is `admin` or `member`. Demoting the only
        owner is refused with `409 last_owner` — transfer ownership first.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - role
              properties:
                role:
                  $ref: '#/components/schemas/AssignableMemberRole'
      responses:
        200:
          description: 'The membership after the change.'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Member'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        409:
          $ref: '#/components/responses/Conflict'
        422:
          $ref: '#/components/responses/UnprocessableEntity'
        429:
          $ref: '#/components/responses/TooManyRequests'
    delete:
      tags:
        - Members
      summary: 'Remove a member'
      description: |
        Requires scope `members:write`. The member's roles in the organization go with the
        membership. Removing the only owner is refused with `409 last_owner`.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/UserId'
      responses:
        204:
          description: Removed.
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        409:
          $ref: '#/components/responses/Conflict'
        429:
          $ref: '#/components/responses/TooManyRequests'
  '/organizations/{id}/members/{userId}/roles':
    get:
      tags:
        - Roles
      summary: 'List the roles a member holds in the organization'
      description: |
        Requires scope `roles:read`. Roles granted AT this organization. Roles a person holds
        everywhere in the environment (staff) are listed under
        `/users/{id}/environment-roles`.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/UserId'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/RoleAssignment'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        429:
          $ref: '#/components/responses/TooManyRequests'
  '/organizations/{id}/members/{userId}/roles/{roleId}':
    put:
      tags:
        - Roles
      summary: 'Grant a member a role in the organization'
      description: |
        Requires scope `roles:write`. Idempotent.

        **This API grants with the environment's authority.** It is your backend, so it may
        grant any role the organization can hold — including a **staff role**
        (`tenant_assignable: false`), such as your support lead's "Support" role at one
        customer. An organization's own administrators still cannot: their console, their
        invitations and their directory mappings refuse staff roles, and nothing here
        changes that.

        Refusals: `422 role_not_assignable` (another organization's role, or one from an app
        this organization cannot use), `409 role_conflict` (segregation of duties).
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/RoleId'
        - $ref: '#/components/parameters/RoleClientId'
      responses:
        200:
          description: 'Granted (or already held).'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/RoleAssignment'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        409:
          $ref: '#/components/responses/Conflict'
        422:
          $ref: '#/components/responses/UnprocessableEntity'
        429:
          $ref: '#/components/responses/TooManyRequests'
    delete:
      tags:
        - Roles
      summary: 'Take a role back from a member'
      description: 'Requires scope `roles:write`. Idempotent — a role the member does not hold is a 204 too.'
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/RoleId'
        - $ref: '#/components/parameters/RoleClientId'
      responses:
        204:
          description: 'Not held any more.'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        429:
          $ref: '#/components/responses/TooManyRequests'
  '/organizations/{id}/transfer-ownership':
    post:
      tags:
        - Organizations
      summary: "Make a member the organization's owner"
      description: |
        Requires scope `organizations:write`. The new owner must be an **active** member.
        With one current owner this is a hand-over: the previous owner stays on as `admin`.
        An organization with no owner (created without `owner_user_id`) gets its first; one
        with several (from before ownership was transfer-only) ends with exactly one, the
        others stepping down to `admin`.

        Refusals: `422 not_a_member`, `409 not_active`, `409 already_owner`.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - user_id
              properties:
                user_id:
                  type: string
      responses:
        200:
          description: "The new owner's membership."
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Member'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        409:
          $ref: '#/components/responses/Conflict'
        422:
          $ref: '#/components/responses/UnprocessableEntity'
        429:
          $ref: '#/components/responses/TooManyRequests'
  /roles:
    get:
      tags:
        - Roles
      summary: 'List roles'
      description: |
        Requires scope `roles:read`. Every role that can still be granted, ordered by name,
        with the permissions each carries. Not paginated. `?client_id=` narrows to one
        app's roles; `?organization_id=` to what can be granted in that organization.
      parameters:
        -
          name: client_id
          in: query
          required: false
          schema:
            type: string
        -
          name: organization_id
          in: query
          required: false
          schema:
            type: string
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Role'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        429:
          $ref: '#/components/responses/TooManyRequests'
  /saml-apps:
    post:
      tags:
        - 'SAML apps'
      summary: 'Register a SAML application that signs people in with their account here. Decides where assertions — and their attributes — are sent.'
      description: 'Requires scope `saml_apps:write`. Danger: critical.'
      operationId: saml_apps_create
      x-action: saml_apps.create
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CboxApproval'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                entity_id:
                  type: string
                  description: "The application's SAML EntityID, unique in this environment."
                  maxLength: 500
                acs_url:
                  type: string
                  description: 'Where assertions are posted: https (http only on localhost), absolute, no fragment.'
                  format: uri
                  maxLength: 1000
                name_id_format:
                  type: string
                  description: 'The NameID format URN. Default emailAddress.'
                  enum:
                    - 'urn:oasis:names:tc:SAML:1.1:nameid-format:emailAddress'
                    - 'urn:oasis:names:tc:SAML:2.0:nameid-format:persistent'
                    - 'urn:oasis:names:tc:SAML:2.0:nameid-format:transient'
                    - 'urn:oasis:names:tc:SAML:1.1:nameid-format:unspecified'
                name_id_attribute:
                  type: string
                  description: "The person's field the NameID is read from. Default `email`."
                  maxLength: 120
                attribute_mappings:
                  type: array
                  description: 'The attributes the assertion carries. Sent, it is the COMPLETE list afterwards.'
                  maxItems: 100
                  items:
                    type: object
                    properties:
                      attribute:
                        type: string
                        description: 'The attribute name the assertion emits: `email`, `displayName`.'
                        maxLength: 190
                      field:
                        type: string
                        description: "The person's field it is read from: `email`, `name`."
                        maxLength: 190
                    required:
                      - attribute
                      - field
                want_authn_requests_signed:
                  type: boolean
                  description: "Verify the application's signature on every AuthnRequest. Needs a certificate."
                certificate:
                  type:
                    - string
                    - 'null'
                  description: "The application's signing certificate (PEM). Write-only; left out or null keeps the one on file."
                  maxLength: 20000
              required:
                - entity_id
                - acs_url
      responses:
        201:
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/SamlApp'
        202:
          $ref: '#/components/responses/ApprovalRequired'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        409:
          $ref: '#/components/responses/Conflict'
        422:
          $ref: '#/components/responses/UnprocessableEntity'
        429:
          $ref: '#/components/responses/TooManyRequests'
    get:
      tags:
        - 'SAML apps'
      summary: 'List the SAML applications that trust this environment as their identity provider.'
      description: 'Requires scope `saml_apps:read`. Danger: read.'
      operationId: saml_apps_list
      x-action: saml_apps.list
      parameters:
        -
          name: limit
          in: query
          required: false
          schema:
            type: integer
            description: 'Items per page, 1–100. Default 50.'
        -
          name: after
          in: query
          required: false
          schema:
            type: string
            description: 'The `next_cursor` of the previous page.'
        - $ref: '#/components/parameters/CboxApproval'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SamlApp'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        202:
          $ref: '#/components/responses/ApprovalRequired'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        422:
          $ref: '#/components/responses/UnprocessableEntity'
        429:
          $ref: '#/components/responses/TooManyRequests'
  '/saml-apps/{id}':
    delete:
      tags:
        - 'SAML apps'
      summary: 'Remove a SAML application. People can no longer sign in to it with their account here.'
      description: 'Requires scope `saml_apps:write`. Danger: critical.'
      operationId: saml_apps_delete
      x-action: saml_apps.delete
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
            description: "The SAML application's id."
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CboxApproval'
      responses:
        204:
          description: Done.
        202:
          $ref: '#/components/responses/ApprovalRequired'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        409:
          $ref: '#/components/responses/Conflict'
        422:
          $ref: '#/components/responses/UnprocessableEntity'
        429:
          $ref: '#/components/responses/TooManyRequests'
    get:
      tags:
        - 'SAML apps'
      summary: 'Read one SAML application: its entity id, ACS URL, NameID and attribute mappings. Never its certificate.'
      description: 'Requires scope `saml_apps:read`. Danger: read.'
      operationId: saml_apps_get
      x-action: saml_apps.get
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
            description: "The SAML application's id."
        - $ref: '#/components/parameters/CboxApproval'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/SamlApp'
        202:
          $ref: '#/components/responses/ApprovalRequired'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        422:
          $ref: '#/components/responses/UnprocessableEntity'
        429:
          $ref: '#/components/responses/TooManyRequests'
    patch:
      tags:
        - 'SAML apps'
      summary: "Change a SAML application's entity id, ACS URL, NameID, attribute mappings or signing certificate."
      description: 'Requires scope `saml_apps:write`. Danger: critical.'
      operationId: saml_apps_update
      x-action: saml_apps.update
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
            description: "The SAML application's id."
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CboxApproval'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
