                    - spa
                    - cli
                    - service
                    - agent
                    - advanced
                  default: web
                client_type:
                  type: string
                  enum:
                    - confidential
                    - public
                grant_types:
                  type: array
                  items:
                    type: string
                redirect_uris:
                  type: array
                  items:
                    type: string
                post_logout_redirect_uris:
                  type: array
                  items:
                    type: string
                scopes:
                  type: array
                  items:
                    type: string
                first_party:
                  type: boolean
                  default: false
                manifest_url:
                  type:
                    - string
                    - 'null'
                  format: uri
                  maxLength: 500
                  description: 'Where the app publishes its roles-and-permissions manifest (short form).'
                organization_id:
                  type:
                    - string
                    - 'null'
                  description: "The owning organization; null for the environment's own app."
                jwks:
                  type:
                    - object
                    - 'null'
                  description: 'A public JWK Set, for a `private_key_jwt` app.'
      responses:
        201:
          description: Registered.
          content:
            application/json:
              schema:
                type: object
                required:
