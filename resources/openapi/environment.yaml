          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        429:
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags:
        - Apps
      summary: 'Register an app'
      description: |
        Requires scope `apps:write`. Two ways to describe it:

        - **From a blueprint** — send `GET /apps/{id}/blueprint`'s document from another
          environment as `blueprint` (promote staging to production). `name`,
          `redirect_uris` and `post_logout_redirect_uris` beside it replace the
          blueprint's own, since those usually name the environment it came from. A
          `private_key_jwt` blueprint needs `jwks`.
        - **Short form** — `name` and `type` (`web`, `spa`, `cli`, `service`, `agent`; default
          `web`), which decide the client type, grants and default scopes as the console's
          "Create app" does. `advanced` takes `client_type` and `grant_types`.

        The response carries `client_secret` for an app that authenticates with one —
        **once**. Only its hash is kept, and an idempotent replay returns `client_secret: null`.

        A platform scope reserved for the console (`vault.manage`, `decisions:read`) is
        refused (`scope_not_grantable`), as is a registered API's scope this app's owner may
        not hold. Danger: critical — it mints a credential.
      operationId: apps_create
      x-action: apps.create
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                blueprint:
                  $ref: '#/components/schemas/AppBlueprint'
                name:
                  type: string
                  maxLength: 190
                type:
                  type: string
                  enum:
                    - web
                    - spa
                    - cli
                    - service
                    - agent
                    - advanced
                  default: web
                client_type:
                  type: string
                  enum:
                    - confidential
                    - public
                grant_types:
                  type: array
                  items:
                    type: string
                redirect_uris:
                  type: array
                  items:
                    type: string
                post_logout_redirect_uris:
                  type: array
                  items:
                    type: string
                scopes:
                  type: array
                  items:
                    type: string
                first_party:
                  type: boolean
                  default: false
                manifest_url:
                  type:
                    - string
                    - 'null'
                  format: uri
                  maxLength: 500
                  description: 'Where the app publishes its roles-and-permissions manifest (short form).'
                organization_id:
                  type:
                    - string
                    - 'null'
                  description: "The owning organization; null for the environment's own app."
                jwks:
                  type:
                    - object
                    - 'null'
                  description: 'A public JWK Set, for a `private_key_jwt` app.'
      responses:
        201:
          description: Registered.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/App'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        422:
          $ref: '#/components/responses/UnprocessableEntity'
        429:
          $ref: '#/components/responses/TooManyRequests'
