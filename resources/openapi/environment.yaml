            description: 'Only reviews covering this organization: its own and the staff reviews.'
            maxLength: 64
        -
          name: limit
          in: query
          required: false
          schema:
            type: integer
            description: 'Items per page, 1–100. Default 50.'
        -
          name: after
          in: query
          required: false
