        - $ref: '#/components/parameters/CboxEnvironment'
      security:
        -
          EnvironmentApiKey: []
        -
          ManagementAccessToken: []
        -
          WorkspaceAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'What the review is: "Q3 finance access".'
                  maxLength: 190
                covers:
                  type: string
                  description: "organization (default): one organization's access, named by organization_id. staff: every environment-wide staff grant."
                  enum:
                    - organization
                    - staff
                organization_id:
                  type:
                    - string
                    - 'null'
                  description: 'The organization to review. Required unless covers is staff.'
                  maxLength: 64
                due_in_days:
                  type: integer
                  description: 'Days until it is due. Default 7.'
                  minimum: 1
                  maximum: 365
              required:
                - name
      responses:
        201:
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/AccessReview'
        202:
          $ref: '#/components/responses/ApprovalRequired'
        400:
          $ref: '#/components/responses/EnvironmentRequired'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        409:
          $ref: '#/components/responses/Conflict'
        422:
          $ref: '#/components/responses/UnprocessableEntity'
        429:
          $ref: '#/components/responses/TooManyRequests'
    get:
      tags:
        - Governance
      summary: 'List access reviews (certification campaigns), open and closed, optionally those covering one organization.'
