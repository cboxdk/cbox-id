  /support-sessions:
    post:
      operationId: support_sessions_start
      x-action: support_sessions.start
      tags:
        - 'Support sessions'
      summary: 'Start a support session'
      description: |
        Requires scope `support:write`. A member of your staff (`actor_user_id`) signs in to
        one of your apps (`client_id`) AS one of a customer's users (`user_id` in
        `organization_id`), for a stated `reason`, for at most 60 minutes.

        The actor must hold your app's own `support:impersonate` permission through an
        **environment-wide** grant (see `PUT /users/{id}/environment-roles/{role_id}`);
        otherwise `403 not_permitted`. The app must be a first-party app the environment
        owns that uses the authorization-code grant (`422 client_not_eligible`). The target
        must be an active member (`422 target_not_member`) of an active organization
        (`409 organization_inactive`).

        Send `redirect_uri` (registered for the app) and a PKCE S256 `code_challenge` to get
        the first authorization `code` in the response. Your app redeems it at `/oauth/token`
        with the verifier; every token carries `act: {"sub": actor_user_id}` and there is
        never a refresh token. The session is audited on the customer's trail and the
        environment's, and announced as the `support_session.started` webhook.

        `scopes` in the response are exactly what every token of the session carries: the
        ones asked for (or, with none, the app's registration), never `offline_access`, and
        audienced the way the token endpoint audiences them — once any of them belongs to a
        registered API, the token is for that API and a scope no API registered (such as
        `apps.manifest`) is left out. Scopes of two registered APIs cannot be audienced to
        one token and are refused before the session starts (`422 invalid_target`).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CboxEnvironment'
      security:
        -
          EnvironmentApiKey: []
        -
          WorkspaceAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - user_id
                - organization_id
                - client_id
                - actor_user_id
                - reason
              properties:
                user_id:
                  type: string
                  description: "The customer's user to act as."
                organization_id:
                  type: string
                client_id:
                  type: string
                  description: "The app's public client id."
                actor_user_id:
                  type: string
                  description: 'Your staff member.'
                reason:
                  type: string
                  maxLength: 500
                  description: 'Shown to the customer.'
                ttl_minutes:
                  type: integer
                  minimum: 1
                  maximum: 60
                scopes:
                  type: array
                  items:
                    type: string
                  description: "Narrowed to the app's registration; omitted means all of it."
                redirect_uri:
                  type: string
                code_challenge:
                  type: string
                  pattern: '^[A-Za-z0-9_-]{43}$'
                nonce:
                  type:
                    - string
                    - 'null'
      responses:
        201:
          description: Started.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/SupportSession'
        202:
          $ref: '#/components/responses/ApprovalRequired'
        400:
          $ref: '#/components/responses/EnvironmentRequired'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        409:
          $ref: '#/components/responses/Conflict'
        422:
          $ref: '#/components/responses/UnprocessableEntity'
        429:
          $ref: '#/components/responses/TooManyRequests'
  '/support-sessions/{id}':
    delete:
      tags:
        - 'Support sessions'
      summary: 'End a support session now: every token it issued is revoked.'
      description: 'Requires scope `support:write`. Danger: destructive.'
      operationId: support_sessions_end
      x-action: support_sessions.end
      x-scope: 'support:write'
