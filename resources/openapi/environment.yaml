          $ref: '#/components/responses/TooManyRequests'
    post:
      tags:
        - Organizations
      summary: 'Create an organization, optionally with its owner'
      description: 'Requires scope `organizations:write`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  maxLength: 190
                slug:
                  type:
                    - string
                    - 'null'
                  maxLength: 190
                  description: |
                    URL-safe; unique within the environment. Optional — left out, it is derived
                    from the name and made unique (`acme`, `acme-2`, …). **Send one if you
                    retry creates**: with your own slug a retried request is a `422
                    slug_taken` you can recognise, not a second organization.
                parent_id:
                  type:
                    - string
                    - 'null'
                  description: 'An organization in this environment to place it under (`422 parent_not_found` otherwise).'
                owner_user_id:
                  type:
                    - string
                    - 'null'
                  description: |
                    An existing user of this environment who becomes the organization's
                    **owner**, in the same transaction as the create (`422 user_not_found`
                    otherwise). Without it the organization starts with no owner; make one
                    later with `transfer-ownership`.
                type:
                  type: string
                  enum:
                    - customer
                    - reseller
                  default: customer
                  description: '`reseller` manages customer organizations beneath it in the tree; `customer` is a leaf tenant.'
      responses:
        201:
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Organization'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        422:
          $ref: '#/components/responses/UnprocessableEntity'
        429:
