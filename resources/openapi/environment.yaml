        - active
        - config
      description: 'A SAML or OIDC connection an organization signs in through. Its certificate, client secret and signing key are write-only.'
      properties:
        id:
          type: string
        organization_id:
          type:
            - string
            - 'null'
          description: 'null when the environment owns it: it signs people in and enrols them nowhere.'
        name:
          type: string
        type:
          type: string
          enum:
            - saml
            - oidc
            - oauth2
        provider:
          type:
            - string
            - 'null'
          description: "The catalogue provider a social sign-in connection came from; null for an organization's own identity provider."
        status:
          type: string
          enum:
            - draft
            - active
            - inactive
        active:
          type: boolean
        complete:
          type: boolean
          description: 'false for a draft created with pending_idp whose identity-provider details are still missing. Activation refuses it.'
        config:
          type: object
          description: 'The settings that are not secrets.'
