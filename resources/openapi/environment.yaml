          required: true
          schema:
            type: string
            description: 'The API id.'
        -
          name: key
          in: path
          required: true
          schema:
            type: string
            description: 'The scope key.'
            maxLength: 128
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CboxApproval'
      responses:
