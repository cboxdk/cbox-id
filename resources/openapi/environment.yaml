  '/apps/{id}/secrets':
    get:
      tags:
        - Apps
      summary: "List an app's live client secrets"
      description: |
        Requires scope `apps:read`. Every live secret, newest first: its id (what
        `DELETE /apps/{id}/secrets/{secret_id}` names), the characters it ends in, and its
        dates — never a secret. `expires_at` is set on one a rotation replaced, still working
        through its overlap. An app holds a handful at most, so there is no page to turn.
      operationId: apps_secrets_list
      x-action: apps.secrets.list
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AppSecret'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        429:
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags:
        - Apps
      summary: 'Mint a new client secret for an app and retire the current ones after grace_seconds (0 = at once). The new secret is returned once.'
      description: 'Requires scope `apps:write`. Danger: critical.'
      operationId: apps_secrets_rotate
      x-action: apps.secrets.rotate
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
            description: "The app's id, or its `client_id`."
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CboxApproval'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                grace_seconds:
                  type: integer
                  description: 'How long the current secrets keep working, in seconds. 0 stops them at once.'
                  minimum: 0
                  maximum: 2592000
              required:
                - grace_seconds
      responses:
        201:
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/AppSecret'
        202:
