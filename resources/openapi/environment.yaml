          properties:
            sp_entity_id:
              type: string
            sp_acs_url:
              type: string
              format: uri
            sp_metadata_url:
              type: string
              format: uri
              description: "SAML: this connection's service-provider metadata (entity id and ACS URL as one XML document), for an identity provider that imports SP metadata. Served for a draft too, before the identity provider's half is known."
            redirect_uri:
              type: string
              format: uri
        created_at:
          type:
            - string
            - 'null'
          format: date-time
        updated_at:
          type:
            - string
            - 'null'
          format: date-time
    SsoCertificates:
      type: object
      required:
        - connection_id
        - organization_id
        - expires_at
        - days_remaining
        - certificates
      description: "A SAML connection's signing certificates. The certificates themselves are never returned."
      properties:
        connection_id:
          type: string
        organization_id:
          type:
            - string
            - 'null'
        expires_at:
          type:
            - string
            - 'null'
          format: date-time
          description: 'When the connection stops working if nothing is done: the latest expiry among the certificates it trusts.'
        days_remaining:
          type:
            - integer
            - 'null'
        certificates:
          type: array
          items:
            type: object
            required:
              - role
              - readable
              - fingerprint_sha256
              - subject
              - issuer
              - not_before
              - not_after
              - days_remaining
              - expired
            properties:
              role:
                type: string
                enum:
                  - primary
                  - staged
                description: 'primary signs today; staged is trusted beside it until activated.'
              readable:
                type: boolean
                description: 'false for a certificate on file that could not be parsed — still trusted.'
              fingerprint_sha256:
                type:
                  - string
                  - 'null'
              subject:
                type:
                  - string
                  - 'null'
              issuer:
                type:
                  - string
                  - 'null'
              not_before:
                type:
                  - string
                  - 'null'
                format: date-time
              not_after:
                type:
                  - string
                  - 'null'
                format: date-time
              days_remaining:
                type:
                  - integer
                  - 'null'
              expired:
                type:
                  - boolean
                  - 'null'
        checks:
          type: array
          description: 'On the stage answer only: what the new certificate was tested for.'
          items:
            type: object
            required:
              - check
              - passed
            properties:
              check:
                type: string
                enum:
                  - readable
                  - not_expired
                  - key_strength
                  - not_on_file
                  - valid_now
              passed:
                type: boolean
