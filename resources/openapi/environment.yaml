          description: 'Not held any more.'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        429:
          $ref: '#/components/responses/TooManyRequests'
  /vault/secrets:
    post:
      tags:
        - 'Token Vault'
      summary: 'Store a downstream credential, sealed at rest'
      description: |
        The secret is sealed with the environment's crypto key and is never returned by
        any read endpoint — only a `lease` reveals it, and only to a client holding a
        live grant.

        Ownership is derived from the calling token's `org` claim and CANNOT be supplied
        in the body: the owner is the vault's tenancy boundary, and a caller-chosen owner
        would be no boundary at all.
      security:
        -
          VaultManagerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - provider
                - secret
              properties:
                name:
                  type: string
                  maxLength: 200
                  description: 'Unique per owner — two organizations may each hold a `github-token`.'
                provider:
                  type: string
                  maxLength: 100
                secret:
                  type: string
                  description: 'The value to seal. Never returned by a read.'
                expires_at:
                  type:
                    - string
                    - 'null'
                  format: date-time
      responses:
        201:
          description: Stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VaultSecret'
        401:
          $ref: '#/components/responses/BearerUnauthorized'
        403:
          $ref: '#/components/responses/BearerForbidden'
        422:
          $ref: '#/components/responses/UnprocessableEntity'
        429:
          $ref: '#/components/responses/TooManyRequests'
  '/vault/secrets/{id}':
    delete:
      tags:
        - 'Token Vault'
      summary: 'Revoke a secret permanently'
      description: 'No future lease can open it. Existing leases are not recalled — they are short-lived by design.'
      security:
        -
          VaultManagerToken: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        204:
          description: Revoked.
        401:
          $ref: '#/components/responses/BearerUnauthorized'
        403:
          $ref: '#/components/responses/BearerForbidden'
        404:
          description: "No such secret in the caller's organization."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        429:
          $ref: '#/components/responses/TooManyRequests'
  '/vault/secrets/{id}/grants':
    post:
      tags:
        - 'Token Vault'
      summary: 'Authorize an agent client to lease this secret'
      security:
        -
          VaultManagerToken: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - client_id
              properties:
                client_id:
                  type: string
                  maxLength: 200
                max_ttl_seconds:
                  type:
                    - integer
                    - 'null'
                  minimum: 1
      responses:
        201:
          description: Granted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret_id:
                    type: string
                  client_id:
                    type: string
                  max_ttl_seconds:
                    type:
                      - integer
                      - 'null'
        401:
          $ref: '#/components/responses/BearerUnauthorized'
        403:
          $ref: '#/components/responses/BearerForbidden'
        404:
          description: "No such secret in the caller's organization."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        422:
          $ref: '#/components/responses/UnprocessableEntity'
        429:
          $ref: '#/components/responses/TooManyRequests'
  '/vault/secrets/{id}/grants/{clientId}':
    delete:
      tags:
        - 'Token Vault'
      summary: "Revoke an agent's authorization"
      description: 'Idempotent — revoking an absent grant succeeds.'
      security:
        -
          VaultManagerToken: []
      parameters:
        - $ref: '#/components/parameters/Id'
        -
          name: clientId
          in: path
          required: true
          schema:
            type: string
      responses:
        204:
          description: 'Revoked (or already absent).'
        401:
          $ref: '#/components/responses/BearerUnauthorized'
        403:
          $ref: '#/components/responses/BearerForbidden'
        429:
          $ref: '#/components/responses/TooManyRequests'
  '/vault/secrets/{id}/lease':
    post:
      tags:
        - 'Token Vault'
      summary: 'Redeem a grant for the plaintext secret'
      description: |
        The only endpoint that reveals a secret. Every refusal — unknown secret, revoked,
        expired, or no live grant — is the SAME 403 with no detail, so a caller cannot
        use it to enumerate what exists.
      security:
        -
          AgentToken: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - purpose
              properties:
                purpose:
                  type: string
                  maxLength: 200
                  description: 'Recorded on the audit trail.'
      responses:
        200:
          description: Leased.
          content:
            application/json:
              schema:
                type: object
                required:
                  - secret_id
                  - provider
                  - secret
                  - expires_at
                properties:
                  secret_id:
                    type: string
                  provider:
                    type: string
                    description: 'The downstream provider the secret belongs to.'
                  secret:
                    type: string
                  expires_at:
                    type: string
                    format: date-time
        401:
          $ref: '#/components/responses/BearerUnauthorized'
        403:
          description: |
            Lease denied. Deliberately uniform — unknown secret, revoked, expired and
            ungranted are ONE response, with a constant message, so it cannot be used to
            enumerate. A token missing the `vault.lease` scope is an RFC 6750 challenge
            instead, and is distinguishable only because it never reaches the vault.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Error'
                  - $ref: '#/components/schemas/BearerChallenge'
              example:
                error: lease_denied
                message: 'The lease was denied.'
        422:
          $ref: '#/components/responses/UnprocessableEntity'
        429:
          $ref: '#/components/responses/TooManyRequests'
  '/vault/secrets/{id}/rotate':
    post:
      tags:
        - 'Token Vault'
      summary: 'Replace the sealed value, keeping the id and its grants'
      security:
        -
          VaultManagerToken: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - secret
              properties:
                secret:
                  type: string
      responses:
        200:
          description: Rotated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VaultSecret'
        401:
          $ref: '#/components/responses/BearerUnauthorized'
        403:
          $ref: '#/components/responses/BearerForbidden'
        404:
          description: |
            No such secret **in the caller's organization**. A secret owned by another
            organization is indistinguishable from one that does not exist — the lookup
            is filtered, not fetched-then-compared, so nothing leaks about what exists
            outside the caller's own scope. The message is a constant for the same reason.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: not_found
                message: 'No such secret.'
        422:
          $ref: '#/components/responses/UnprocessableEntity'
        429:
          $ref: '#/components/responses/TooManyRequests'
  /webhooks:
    post:
      tags:
        - Webhooks
      summary: 'Register a webhook endpoint for one organization or the whole environment. Returns its signing secret once.'
      description: 'Requires scope `webhooks:write`. Danger: critical.'
      operationId: webhooks_create
      x-action: webhooks.create
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CboxApproval'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  description: 'A public HTTPS URL. Signed deliveries are POSTed here.'
                  format: uri
                  maxLength: 500
                event_types:
                  type: array
                  description: 'The events it receives.'
                  minItems: 1
                  items:
                    type: string
                    enum:
                      - user.created
                      - user.updated
                      - user.deactivated
                      - user.login
                      - user.reactivated
                      - identity.linked
                      - user.erased
                      - organization.created
                      - organization.suspended
                      - organization.reactivated
                      - organization.updated
                      - organization.deleted
                      - membership.created
                      - membership.updated
                      - membership.deleted
                      - invitation.created
                      - invitation.accepted
                      - invitation.revoked
                      - role.assigned
                      - role.unassigned
                      - role.assigned_everywhere
                      - role.unassigned_everywhere
                      - api_key.created
                      - api_key.revoked
                      - support_session.started
                      - directory.user.provisioned
                      - directory.user.deprovisioned
                      - directory.user.deactivated
                      - directory.group.membership_changed
                      - domain.added
                      - domain.removed
                      - domain.verified
                      - connection.activated
                      - entitlement.set
                      - entitlement.updated
                      - entitlement.revoked
                      - vault.grant.created
                      - vault.grant.revoked
                      - vault.secret.revoked
                      - governance.access.revoked
                organization_id:
                  type:
                    - string
                    - 'null'
                  description: "The organization it belongs to; it carries that organization's traffic only. Send this or environment_wide."
                  maxLength: 64
                environment_wide:
                  type: boolean
                  description: "True to make it the environment's own, carrying EVERY organization's traffic. Send this or organization_id."
              required:
                - url
