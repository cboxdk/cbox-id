  '/organizations/{id}':
    get:
      tags:
        - Organizations
      summary: 'Get an organization'
      description: 'Requires scope `organizations:read`.'
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Organization'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
