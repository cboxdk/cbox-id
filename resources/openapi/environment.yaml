        409:
          $ref: '#/components/responses/Conflict'
        422:
          $ref: '#/components/responses/UnprocessableEntity'
        429:
          $ref: '#/components/responses/TooManyRequests'
    get:
      tags:
        - Apps
      summary: 'Get one app (OAuth client) by its id or its client_id: its kind, grants, redirect URIs, scopes and settings. Never a secret.'
      description: 'Requires scope `apps:read`. Danger: read.'
      operationId: apps_get
      x-action: apps.get
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
            description: "The app's id, or its `client_id`."
        - $ref: '#/components/parameters/CboxApproval'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/App'
        202:
          $ref: '#/components/responses/ApprovalRequired'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        422:
          $ref: '#/components/responses/UnprocessableEntity'
        429:
          $ref: '#/components/responses/TooManyRequests'
    patch:
      tags:
        - Apps
      summary: 'Rename an app and replace its redirect URIs or sign-out redirect URIs. Fields left out are unchanged.'
      description: 'Requires scope `apps:write`. Danger: write.'
      operationId: apps_update
