      properties:
        id:
          type: string
        organization_id:
          type:
            - string
            - 'null'
          description: "null when it receives every organization's people."
        name:
          type: string
        base_url:
          type: string
        auth_scheme:
          type: string
          enum:
            - bearer
            - oauth2_client_credentials
        token_url:
          type:
            - string
            - 'null'
        client_id:
          type:
            - string
            - 'null'
        active:
          type: boolean
          description: 'false while paused.'
        consecutive_failures:
          type: integer
        last_success_at:
          type:
            - string
            - 'null'
          format: date-time
        last_error:
          type:
            - string
            - 'null'
        created_at:
          type:
            - string
            - 'null'
          format: date-time
    SodPolicy:
      type: object
      required:
        - id
        - organization_id
        - name
        - role_ids
        - active
      description: 'A role-conflict (segregation of duties) rule: roles no one person may hold together.'
      properties:
        id:
          type: string
        organization_id:
          type:
            - string
            - 'null'
          description: 'null when it binds every organization.'
        name:
          type: string
        description:
          type:
            - string
            - 'null'
        role_ids:
          type: array
          items:
            type: string
        active:
          type: boolean
        created_at:
          type:
            - string
            - 'null'
          format: date-time
    FeatureFlag:
      type: object
      required:
        - id
        - key
        - enabled
        - default_value
        - users
        - organizations
      description: 'A switch apps ask about per user and organization. First match wins: switched off, then a user rule, then an organization rule, then the rollout, then the default.'
      properties:
        id:
          type: string
        key:
          type: string
          description: 'What code asks for and the `feature_flags` claim carries. Fixed once created.'
        description:
          type:
            - string
            - 'null'
        enabled:
          type: boolean
          description: 'The kill switch: false is off for everyone.'
        default_value:
          type: boolean
          description: 'The answer when no rule matches.'
        rollout_percentage:
          type:
            - integer
            - 'null'
          minimum: 0
          maximum: 100
          description: 'On for this share of everyone else, by a stable hash of the user id (the organization id without one).'
        users:
          type: array
          description: 'Rules for named users; they outrank every other rule.'
          items:
            $ref: '#/components/schemas/FeatureFlagRule'
        organizations:
          type: array
          description: 'Rules for named organizations; they outrank the rollout and the default.'
          items:
            $ref: '#/components/schemas/FeatureFlagRule'
        created_at:
          type:
            - string
            - 'null'
          format: date-time
        updated_at:
          type:
            - string
            - 'null'
          format: date-time
    FeatureFlagRule:
      type: object
      required:
        - id
        - enabled
      properties:
        id:
          type: string
          description: "The user's or organization's id."
        enabled:
          type: boolean
          description: 'On or off for them.'
    FeatureFlagEvaluation:
      type: object
      required:
        - user_id
        - organization_id
        - feature_flags
        - evaluations
      description: "Every flag's answer for the user and organization asked about."
      properties:
        user_id:
          type:
            - string
            - 'null'
        organization_id:
          type:
            - string
            - 'null'
        feature_flags:
          type: array
          description: "The keys of the flags that are on, sorted — exactly what the token's `feature_flags` claim would carry."
          items:
            type: string
        evaluations:
          type: array
          items:
            type: object
            required:
              - key
              - enabled
              - reason
            properties:
              key:
                type: string
              enabled:
                type: boolean
              reason:
                type: string
                enum:
                  - disabled
                  - user_target
                  - organization_target
                  - rollout
                  - default
                description: 'The rule that decided.'
    AccessReview:
      type: object
      required:
        - id
        - organization_id
        - staff
        - name
        - status
        - open
        - pending_policy
        - item_count
      properties:
        id:
          type: string
        organization_id:
          type:
            - string
            - 'null'
          description: 'null for a staff review of environment-wide grants.'
        staff:
          type: boolean
        name:
          type: string
        status:
          type: string
          enum:
            - open
            - closed
        open:
          type: boolean
        pending_policy:
          type: string
          enum:
            - revoke
            - certify
          description: 'What closing does to an item nobody decided.'
        item_count:
          type: integer
        due_at:
          type:
            - string
            - 'null'
          format: date-time
        closed_at:
          type:
            - string
            - 'null'
          format: date-time
        created_by:
          type:
            - string
            - 'null'
          description: 'The person or key that opened it.'
        created_at:
          type:
            - string
            - 'null'
          format: date-time
    AccessReviewItem:
      type: object
      required:
        - id
        - review_id
        - subject_id
        - access_type
        - access_ref
        - decision
        - applied
      properties:
        id:
          type: string
        review_id:
          type: string
        subject_id:
          type: string
        access_type:
          type: string
          enum:
            - role
            - membership
            - environment_role
        access_ref:
          type: string
          description: 'The role id, or the organization id of a membership.'
        organization_id:
          type:
            - string
            - 'null'
        decision:
          type: string
          enum:
            - pending
            - certified
            - revoked
        decided_by:
          type:
            - string
            - 'null'
        decided_at:
          type:
            - string
            - 'null'
          format: date-time
        note:
          type:
            - string
            - 'null'
        applied:
          type: boolean
          description: 'Whether a revoke was carried out when the review closed.'
        application_note:
          type:
            - string
            - 'null'
          description: 'Why a revoke could not be applied.'
    TokenVaultSecret:
      type: object
      required:
        - id
        - organization_id
        - name
        - provider
        - status
        - revoked
      description: 'A downstream credential in the token vault. Its value is write-only.'
      properties:
        id:
          type: string
        organization_id:
          type:
            - string
            - 'null'
          description: "null for the environment's own secrets."
        name:
          type: string
        provider:
          type: string
        status:
          type: string
          enum:
            - active
            - expired
            - revoked
        revoked:
          type: boolean
        expires_at:
          type:
            - string
            - 'null'
          format: date-time
        rotated_at:
          type:
            - string
            - 'null'
          format: date-time
        created_at:
          type:
            - string
            - 'null'
          format: date-time
        grants:
          type: array
          items:
            type: string
          description: 'The OAuth client ids that may lease it. Not on lists.'
    Pipe:
      type: object
      required:
        - id
        - provider
        - name
        - client_id
        - scopes
        - enabled
        - redirect_uri
        - grants
        - connections
      description: "A pipe: this environment's OAuth app at a third-party provider, through which people connect their own accounts. The client secret is write-only."
      properties:
        id:
          type: string
        provider:
          type: string
          enum:
            - github
            - google
            - microsoft
            - slack
            - salesforce
            - hubspot
            - linear
            - notion
        name:
          type: string
        client_id:
          type: string
          description: "Your app's OAuth client id at the provider."
        scopes:
          type: array
          items:
            type: string
          description: 'What people are asked for when they connect.'
        parameters:
          type: object
          additionalProperties:
            type: string
          description: "Per-installation values: Microsoft's `tenant`, Salesforce's `domain`."
        enabled:
          type: boolean
        redirect_uri:
          type: string
          format: uri
          description: 'The callback URL to register at the provider.'
        grants:
          type: array
          items:
            type: string
          description: 'The OAuth client ids of the apps that may lease its tokens.'
        connections:
          type: integer
          description: 'How many people have connected an account through it.'
        created_at:
          type:
            - string
            - 'null'
          format: date-time
        updated_at:
          type:
            - string
            - 'null'
          format: date-time
    PipeConnection:
      type: object
      required:
        - id
        - pipe_id
        - provider
        - user_id
        - status
        - scopes
      description: "One person's connected account at a pipe's provider. Never a token."
      properties:
        id:
          type: string
        pipe_id:
          type: string
        provider:
          type: string
        user_id:
          type: string
        status:
          type: string
          enum:
            - active
            - needs_reauth
        account:
          type:
            - string
            - 'null'
          description: "The account's name at the provider, when it says (a GitHub login, an email, a workspace)."
        scopes:
          type: array
          items:
            type: string
        metadata:
          type: object
          additionalProperties:
            type: string
        expires_at:
          type:
            - string
            - 'null'
          format: date-time
          description: 'When the current access token expires. Null when it does not.'
        connected_at:
          type:
            - string
            - 'null'
          format: date-time
        last_refreshed_at:
          type:
            - string
            - 'null'
          format: date-time
        refresh_failures:
          type: integer
          description: 'Consecutive transient refresh failures.'
        last_error:
          type:
            - string
            - 'null'
        reauth_reason:
          type:
            - string
            - 'null'
          description: "Why it needs reconnecting: the provider's error code, or `no_refresh_token`."
    PipeConnectRequired:
      type: object
      required:
        - error
        - message
        - connect_url
      properties:
        error:
          type: string
          enum:
            - not_connected
            - reauthorization_required
        message:
          type: string
        connect_url:
          type: string
          format: uri
          description: 'Where to send the person to connect. Add `?client_id=…&return_to=…` to bring them back to your app.'
    AgentRequest:
      type: object
      description: "A pending request from an agent to act as one of this environment's people (OIDC CIBA)."
      required:
        - id
        - client_id
        - app
        - subject
        - scopes
        - expires_at
      properties:
        id:
          type: string
        client_id:
          type: string
        app:
          type: string
          description: "The app's name, or its client id when it has none."
        subject:
          type: object
          description: 'Whom the agent asks to act as.'
          required:
            - id
            - email
          properties:
            id:
              type: string
            email:
              type:
                - string
                - 'null'
              description: 'Null when that person no longer exists — the request can still be denied.'
        binding_message:
          type:
            - string
            - 'null'
          description: 'The message the person sees on their device, to recognise the request.'
        scopes:
          type: array
          items:
            type: string
        expires_at:
          type:
            - string
            - 'null'
          format: date-time
        created_at:
          type:
            - string
            - 'null'
          format: date-time
    PageMeta:
      type: object
      properties:
        limit:
          type: integer
        has_more:
          type: boolean
        next_cursor:
          type:
            - string
            - 'null'
    Error:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          description: 'Stable machine code'
        message:
          type: string
          description: 'Human-readable explanation'
        request_id:
          type: string
          description: 'The id this request was served under, also sent as the X-Request-Id header. Quote it when reporting a problem.'
        errors:
          type: object
          description: |
            Present on `validation_failed` only: the offending request fields, each
            mapped to its messages.
          additionalProperties:
            type: array
            items:
              type: string
    BearerChallenge:
      type: object
      required:
        - error
        - error_description
      description: |
        RFC 6750 §3 error shape, used by the OAuth-token-authenticated Token Vault
        endpoints. NOT the `{error, message}` envelope — restating the envelope here
        would be a protocol conformance bug.
      properties:
        error:
          type: string
          enum:
            - invalid_request
            - invalid_token
            - insufficient_scope
        error_description:
          type: string
  responses:
    ApprovalRequired:
      description: |
        Held for a person's approval: this key's policy requires its owner to approve this
        action on their device first. Poll `approval.poll_url`, then repeat the same request
        (same body, same `Idempotency-Key`) with `Cbox-Approval: <approval.id>`.
      content:
        application/json:
          schema:
            type: object
            required:
              - error
              - message
              - approval
            properties:
              error:
                type: string
                enum:
                  - approval_required
              message:
                type: string
              approval:
                type: object
                required:
                  - id
                  - status
                  - binding_code
                  - expires_at
                  - poll_url
                properties:
                  id:
                    type: string
                  status:
                    type: string
                  binding_code:
                    type: string
                  expires_at:
                    type: string
                    format: date-time
                  poll_url:
                    type: string
                    format: uri
    Unauthorized:
      description: 'Missing or invalid environment API key.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: 'The key is missing the scope this endpoint requires.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: 'No such resource in this environment.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    EnvironmentRequired:
      description: |
        A `WorkspaceAccessToken` on the platform root's host named no environment
        (`error: environment_required`): send `Cbox-Environment`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableEntity:
      description: |
        Validation failed (`error: validation_failed`, with a field-keyed `errors` map),
        or a uniqueness conflict (e.g. slug/email taken).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: |
        The request conflicts with the resource's state; `error` names which rule
        (`last_owner`, `already_member`, `not_pending`, `role_conflict`, …).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    MailFailed:
      description: 'The mail server refused the invitation mail (`error: mail_failed`). Retry.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: |
        The key's rate limit for this plane is exhausted. The bucket is keyed on the API
        KEY, so this reflects only your own traffic.
      headers:
        Retry-After:
          description: 'Seconds to wait before retrying.'
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BearerUnauthorized:
      description: 'Missing, expired, or wrongly-audienced access token (RFC 6750 challenge).'
      headers:
        WWW-Authenticate:
          description: 'Bearer error="invalid_token", error_description="…"'
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BearerChallenge'
    ApprovalNotActionable:
      description: |
        The request is no longer pending. Deliberately uniform — unknown, expired, already
        answered and belonging-to-another-subject are ONE response with a constant
        message, so someone holding a stolen handset cannot learn whether a given request
        id exists or whose it is.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: approval_not_actionable
            message: 'This request is no longer pending. It may have expired or already been answered.'
    BearerForbidden:
      description: 'The access token does not carry the scope this endpoint requires.'
      headers:
        WWW-Authenticate:
          description: 'Bearer error="insufficient_scope", scope="…"'
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BearerChallenge'
