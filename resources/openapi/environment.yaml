        -
          ManagementAccessToken: []
        -
          WorkspaceAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 190
                slug:
                  type: string
                  minLength: 1
                  maxLength: 190
                  description: 'URL-safe; unique within the environment.'
                metadata:
                  type:
                    - object
                    - 'null'
                  additionalProperties:
                    type: string
                    maxLength: 500
                  description: 'Replaces the metadata as a whole; `null` or `{}` clears it.'
