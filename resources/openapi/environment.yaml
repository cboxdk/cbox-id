    AuditLogEvent:
      type: object
      description: |
        One audit event your app sent. `hash` covers `id`, `organization_id`, `sequence`,
        `action`, `occurred_at`, `actor`, `targets`, `context` and `metadata`, chained to
        the organization's previous event by `prev_hash` — see the Audit Logs guide for how
        to verify it yourself.
      required:
        - id
        - organization_id
        - sequence
        - action
        - occurred_at
        - actor
        - targets
        - context
        - metadata
        - schema_version
        - received_at
        - prev_hash
        - hash
      properties:
        id:
          type: string
        organization_id:
          type: string
        sequence:
          type: integer
          description: "The event's place in its organization's chain, from 1."
        action:
          type: string
          description: 'e.g. `invoice.voided`.'
        occurred_at:
          type: string
          format: date-time
          description: 'When it happened, as the sender said, to the millisecond.'
        actor:
          type: object
          required:
            - id
            - type
            - name
            - metadata
          properties:
            id:
              type: string
            type:
              type: string
            name:
              type:
                - string
                - 'null'
            metadata:
              type:
                - object
                - 'null'
        targets:
          type: array
          items:
            type: object
            required:
              - id
              - type
              - name
              - metadata
            properties:
              id:
                type: string
              type:
                type: string
              name:
                type:
                  - string
                  - 'null'
              metadata:
                type:
                  - object
                  - 'null'
        context:
          type: object
          required:
            - location
            - user_agent
          properties:
            location:
              type:
                - string
                - 'null'
            user_agent:
              type:
                - string
                - 'null'
        metadata:
          type:
            - object
            - 'null'
        schema_version:
          type:
            - integer
            - 'null'
          description: "The version of its action's schema it was checked against; null when the action has none."
        received_at:
          type:
            - string
            - 'null'
          format: date-time
          description: 'When it arrived. Retention counts from here.'
        prev_hash:
          type: string
          description: "The previous event's hash; 64 zeros for an organization's first."
        hash:
          type: string
