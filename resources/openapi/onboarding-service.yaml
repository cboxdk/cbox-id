openapi: 3.1.0
info:
  title: Cbox ID — Onboarding service eligibility
  version: 1.0.0
  description: Dedicated read-only service integration. Customer environment and workspace API credentials are not accepted.
servers:
  - url: /api/v1
paths:
  /onboarding/eligibility:
    post:
      operationId: checkOnboardingEligibility
      summary: Recheck whether the current responsible person still needs a first-login reminder
      security:
        - OnboardingServiceKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workspace_id, subject_id, project_id, environment_id, check]
              properties:
                workspace_id: { type: string, maxLength: 100 }
                subject_id: { type: string, maxLength: 100 }
                project_id: { type: string, maxLength: 100 }
                environment_id: { type: string, maxLength: 100 }
                check: { type: string, enum: [cbox_id_first_sign_in_pending] }
      responses:
        '200':
          description: Current access and goal evidence. Missing or inaccessible resources return eligible false.
          content:
            application/json:
              schema:
                type: object
                required: [eligible, observed_at]
                properties:
                  eligible: { type: boolean }
                  observed_at: { type: string, format: date-time }
        '401': { description: Dedicated service credential missing or invalid }
        '422': { description: Invalid request }
        '429': { description: Rate limit exceeded }
components:
  securitySchemes:
    OnboardingServiceKey:
      type: http
      scheme: bearer
      description: Operator-provisioned ID_ONBOARDING_ELIGIBILITY_KEY, not a customer API key. Never expose this credential to a browser.
