components:
  securitySchemes:
    OrganizationApiKey:
      type: http
      scheme: bearer
      description: 'A workspace key, `cbid_ws_…` — a role, optionally narrowed by scopes. Create and revoke keys in the console (Owner/Admin), or with `POST /workspace/keys`.'
  parameters:
    CboxApproval:
      name: Cbox-Approval
      in: header
      required: false
      description: 'The id of an approval this key asked for (from a `202 approval_required`), once the person approved it. Spent by this request, once.'
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 'Any unique string (a UUID). A retry with the same key and request gets the first answer back.'
      schema:
        type: string
        maxLength: 255
  responses:
    ApprovalRequired:
      description: |
        Held for a person's approval: this key's policy requires the person who minted it to
        approve this action on their device first. Poll `approval.poll_url`, then repeat the
        same request (same body, same `Idempotency-Key`) with `Cbox-Approval: <approval.id>`.
      content:
        application/json:
          schema:
            type: object
            required:
              - error
              - message
              - approval
            properties:
              error:
                type: string
                enum:
                  - approval_required
              message:
                type: string
              approval:
                type: object
                required:
                  - id
                  - status
                  - binding_code
                  - expires_at
                  - poll_url
                properties:
                  id:
                    type: string
                  status:
                    type: string
                  binding_code:
                    type: string
                  expires_at:
                    type: string
                    format: date-time
                  poll_url:
                    type: string
                    format: uri
    Unauthorized:
      description: 'Missing or invalid organization API key (or its organization is suspended)'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: "The key's role lacks the required capability, or the key lacks the required scope"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    MailFailed:
      description: 'The mail server refused the invitation (`mail_failed`). A new invitation is withdrawn, so trying again works; a re-sent one is kept.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: 'No such resource on this organization'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: |
        A request with this `Idempotency-Key` is still being processed (`idempotency_in_progress`).
        Retry shortly.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableEntity:
      description: |
        Validation failed (`error: validation_failed`, with a field-keyed `errors` map),
        or the request was well-formed but refused for a domain reason — a taken email,
        a reached plan limit.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: |
        The key's rate limit for this plane is exhausted. The bucket is keyed on the API
        KEY, so this reflects only your own traffic.
      headers:
        Retry-After:
          description: 'Seconds to wait before retrying.'
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Organization:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        status:
          type: string
          enum:
            - active
            - suspended
        projects:
          type: array
          description: "The organization's projects with each one's plan/allowance. Present only for billing-readers (plans are per project)."
          items:
            $ref: '#/components/schemas/Project'
    Project:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        status:
          type: string
          enum:
            - active
            - suspended
        environment_limit:
          type: integer
          description: "This project's plan environment allowance."
        environments_used:
          type: integer
    Environment:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        type:
          type: string
          enum:
            - production
            - sandbox
        status:
          type: string
        project_id:
          type: string
          description: 'The project (billing anchor) this environment belongs to.'
        domain:
          type:
            - string
            - 'null'
        issuer:
          type: string
          format: uri
          description: "The environment's own host — where its OIDC/environment API lives."
    Member:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        name:
          type:
            - string
            - 'null'
        role:
          type: string
          enum:
            - owner
            - admin
            - developer
            - member
            - viewer
        status:
          type: string
          enum:
            - active
            - invited
        all_environments:
          type: boolean
    CreatedEnvironment:
      description: 'An environment, and — when the request asked for one — its first management key.'
      allOf:
        - $ref: '#/components/schemas/Environment'
        -
          type: object
          properties:
            initial_key:
              $ref: '#/components/schemas/EnvironmentKey'
    EnvironmentKey:
      type: object
      description: "A management key (`cbid_env_…`) of one of the workspace's environments. `token` is present only in the answer that minted it, and `null` on an idempotent replay."
      required:
        - id
        - environment_id
        - name
        - scopes
      properties:
        id:
          type: string
        environment_id:
          type: string
        name:
          type: string
        prefix:
          type: string
        scopes:
          type: array
          items:
            type: string
        expires_at:
          type:
            - string
            - 'null'
          format: date-time
        token:
          type:
            - string
            - 'null'
          description: "The key's value. Shown once."
    WorkspaceKey:
      type: object
      description: 'A workspace key (`cbid_ws_…`). `token` is present only in the answer that minted it, and `null` on an idempotent replay.'
      required:
        - id
        - name
        - role
      properties:
        id:
          type: string
        name:
          type: string
        prefix:
          type: string
        role:
          type: string
          enum:
            - owner
            - admin
            - developer
            - member
            - viewer
        scopes:
          type:
            - array
            - 'null'
          items:
            type: string
            enum:
              - 'workspace:read'
              - 'projects:write'
              - 'environments:write'
              - 'team:read'
              - 'team:write'
              - 'keys:write'
              - 'settings:write'
          description: 'Null when the role alone bounds the key.'
        parent_key_id:
          type:
            - string
            - 'null'
          description: 'The key that minted it, if a key did. Revoking the parent revokes it.'
        created_by_type:
          type:
            - string
            - 'null'
          description: '`organization_member` or `workspace_key`; null for a key minted before this was recorded.'
        expires_at:
          type:
            - string
            - 'null'
          format: date-time
        revoked_at:
          type:
            - string
            - 'null'
          format: date-time
        last_used_at:
          type:
            - string
            - 'null'
          format: date-time
        token:
          type:
            - string
            - 'null'
          description: "The key's value. Shown once."
    TeamInvitation:
      type: object
      required:
        - id
        - email
        - role
        - expires_at
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum:
            - admin
            - developer
            - member
            - viewer
        invited_by:
          type:
            - string
            - 'null'
          description: 'The person, or the API key, that sent it — by name.'
        invited_at:
          type:
            - string
            - 'null'
          format: date-time
        expires_at:
          type: string
          format: date-time
    CustomDomain:
      type: object
      required:
        - domain
        - verified_at
        - pending
      properties:
        domain:
          type:
            - string
            - 'null'
          description: 'The verified domain serving the environment.'
        verified_at:
          type:
            - string
            - 'null'
          format: date-time
        pending:
          description: 'A domain waiting for its DNS proof, and the TXT record to publish.'
          oneOf:
            -
              type: object
              required:
                - domain
                - record_name
                - record_value
              properties:
                domain:
                  type: string
                record_name:
                  type: string
                record_value:
                  type: string
            - type: 'null'
    PageMeta:
      type: object
      description: 'Paging for a list response. `has_more` used to be returned with nothing to act on it — no page parameter and no cursor — so a caller told there was more had no way to ask for it. `next_page` is present exactly when `has_more` is true, so a client can loop without computing anything.'
      properties:
        limit:
          type: integer
        page:
          type: integer
          minimum: 1
        total:
          type: integer
          description: 'Present on lists that can count cheaply.'
        has_more:
          type: boolean
        next_page:
          type:
            - integer
            - 'null'
          description: 'Pass as `page` on the next request; absent on the last page.'
    Error:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          description: 'Stable machine code'
        message:
          type: string
          description: 'Human-readable explanation'
        errors:
          type: object
          description: |
            Present on `validation_failed` only: the offending request fields, each
            mapped to its messages.
          additionalProperties:
            type: array
            items:
              type: string
