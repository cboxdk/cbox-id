        Requires scope `team:write` and the `manage-members` capability (owner/admin). Invites the address onto the
        organization's team — the same invitation the console's Team page sends: a mail naming
        this key as the inviter and the role, with a signed link on which the invitee sets a
        password and is signed in. Owner is never invited; ownership is transferred. An
        earlier pending invitation for the same address is superseded. List, re-send and
        withdraw it under `/workspace/invitations`.
      operationId: team_invite
      x-action: team.invite
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - role
              properties:
                email:
                  type: string
                  format: email
                name:
                  type:
                    - string
                    - 'null'
                role:
                  type: string
                  enum:
                    - admin
                    - developer
                    - member
                    - viewer
      responses:
        201:
          description: Invited
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Member'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        422:
          description: 'Validation failed, or the email already belongs to a member'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: email_taken
                message: 'That person is already on this list.'
        429:
          $ref: '#/components/responses/TooManyRequests'
        503:
          $ref: '#/components/responses/MailFailed'
