openapi: 3.1.0
info:
  title: 'Cbox ID — My Account API'
  version: 1.0.0
  description: |
    **Your own account** — the person calling, and nobody else: your profile, where you are
    signed in, which applications may act as you, your own API keys for the apps built on
    this environment, your sign-in methods, your trusted devices and the organizations you
    belong to. The same actions the
    console's My account pages run, with the same rules, refusals and audit trail.

    **Who may call it.** Only you, through an access token you delegated carrying the
    `account:*` scope each operation names. **No management key is accepted** — no key
    acts as a person. There is no account id in any path: every operation acts on the
    person behind the token, and an id of somebody else's session, passkey, key or device
    is simply not found.

    **What is not here, on purpose.** Changing your password, turning on a second factor,
    new recovery codes and registering a passkey are ceremonies you perform in a browser —
    a token that could do them could take the account over.

    Served on the host of the environment your account belongs to: an environment's own
    host for its own people, with a token that environment issued; the platform root's
    host for a workspace's team and the operators, with the token the root issued them
    (`cbox login` at the root).

    **Envelope.** Every success returns `{ "data": … }` (or `204` with no body). Every
    error returns `{ "error": "<code>", "message": "<human message>" }`.
servers:
  -
    url: 'https://{host}/api/v1'
    description: "Your environment's own host"
    variables:
      host:
        default: acme.cboxid.com
security:
  -
    PersonToken: []
tags:
  - name: Profile
  - name: Sessions
  - name: Applications
    description: 'The applications you let act as you.'
  - name: 'API keys'
    description: 'Your own keys for the apps built on this environment.'
  - name: 'Sign-in methods'
  - name: Devices
    description: 'Your trusted devices, which approve sign-ins and agent requests.'
  - name: Approvals
    description: "Where a held operation's approval stands."
  - name: Organizations
    description: 'The organizations you are a member of — and leaving one.'
  - name: 'Connected services'
paths:
  '/me/action-approvals/{id}':
    get:
      tags:
        - Approvals
      summary: 'Where an approval you asked for stands'
      description: |
        The `poll_url` of a `202 approval_required`: an approval this token raised, and only those — another token's id is a 404. `status` is `pending`, `approved`, `denied`, `expired` or `consumed`.
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - id
                      - status
                    properties:
                      id:
                        type: string
                      status:
                        type: string
                        enum:
