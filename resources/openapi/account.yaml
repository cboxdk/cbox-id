components:
  securitySchemes:
    PersonToken:
      type: http
      scheme: bearer
      description: 'An access token you delegated, carrying `account:*` scopes. Management keys are refused.'
  parameters:
    CboxApproval:
      name: Cbox-Approval
      in: header
      required: false
      description: 'The id of an approval this request was held for, once you approved it. Spent by this request, once.'
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 'Any unique string (a UUID). A retry with the same key and request gets the first answer back.'
      schema:
        type: string
        maxLength: 255
  responses:
    ApprovalRequired:
      description: 'Held for your approval on your device. Poll `approval.poll_url`, then repeat the same request with `Cbox-Approval`.'
      content:
        application/json:
          schema:
            type: object
            required:
              - error
              - message
              - approval
            properties:
              error:
                type: string
                enum:
                  - approval_required
              message:
                type: string
              approval:
                type: object
                required:
                  - id
                  - status
                  - binding_code
                  - expires_at
                  - poll_url
                properties:
                  id:
                    type: string
                  status:
                    type: string
                  binding_code:
                    type: string
                  expires_at:
                    type: string
                    format: date-time
                  poll_url:
                    type: string
                    format: uri
    Unauthorized:
      description: 'No valid token of yours. Management keys always get this.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: 'The token lacks the required scope.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: 'No such session, passkey, key, device or linked account of yours.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: 'A request with this `Idempotency-Key` is still being processed (`idempotency_in_progress`). Retry shortly.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableEntity:
      description: |
        Validation failed (`error: validation_failed`, with a field-keyed `errors` map), or the
        request was refused — disconnecting your last way to sign in, a key permission you do
        not hold.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: "The token's rate limit is exhausted."
      headers:
        Retry-After:
          description: 'Seconds to wait before retrying.'
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Profile:
      type: object
      required:
        - id
        - name
        - email
      properties:
        id:
          type: string
        name:
          type:
            - string
            - 'null'
        email:
          type:
            - string
            - 'null'
          format: email
    SessionsRevoked:
      type: object
      required:
        - revoked
      properties:
        revoked:
          type: integer
          description: 'How many sessions were signed out.'
    PersonalApiKey:
      type: object
      required:
        - id
        - organization_id
        - client_id
        - permissions
      properties:
        id:
          type: string
        name:
          type:
            - string
            - 'null'
        organization_id:
          type: string
        client_id:
          type: string
        prefix:
          type: string
        permissions:
          type: array
          items:
            type: string
        expires_at:
          type:
            - string
            - 'null'
          format: date-time
        created_at:
          type:
            - string
            - 'null'
          format: date-time
        token:
          type:
            - string
            - 'null'
          description: "The key's value — shown once, on creation; null on an idempotent replay."
    Error:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          description: 'Stable machine code'
        message:
          type: string
          description: 'Human-readable explanation'
        request_id:
          type: string
          description: 'The id this request was served under, also sent as the X-Request-Id header. Quote it when reporting a problem.'
        errors:
          type: object
          description: 'Present on `validation_failed` only — the offending fields, each mapped to its messages.'
          additionalProperties:
            type: array
            items:
              type: string
