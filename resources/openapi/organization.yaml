components:
  securitySchemes:
    OrganizationAccessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        An organization member's access token from the platform root, audienced to the root's
        `/mcp`. Bounded by the person's role in the organization and by its scopes. A DPoP-bound
        token is presented as `Authorization: DPoP <token>` with a proof.
    OrganizationApiKey:
      type: http
      scheme: bearer
      description: 'An organization key, `cbid_ws_…` — a role, optionally narrowed by scopes. Create and revoke keys in the console (Owner/Admin), or with `POST /workspace/keys`.'
  parameters:
    CboxApproval:
      name: Cbox-Approval
      in: header
      required: false
      description: 'The id of an approval this key asked for (from a `202 approval_required`), once the person approved it. Spent by this request, once.'
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 'Any unique string (a UUID). A retry with the same key and request gets the first answer back.'
      schema:
        type: string
        maxLength: 255
  responses:
    AdmissionUnavailable:
      description: 'Billing admission is unavailable. No project or environment is created; retry later.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ApprovalRequired:
      description: |
        Held for a person's approval: this key's policy requires the person who minted it to
        approve this action on their device first. Poll `approval.poll_url`, then repeat the
        same request (same body, same `Idempotency-Key`) with `Cbox-Approval: <approval.id>`.
      content:
        application/json:
          schema:
            type: object
            required:
              - error
              - message
              - approval
            properties:
              error:
                type: string
                enum:
                  - approval_required
              message:
                type: string
              approval:
                type: object
                required:
                  - id
                  - status
                  - binding_code
                  - expires_at
                  - poll_url
                properties:
                  id:
                    type: string
                  status:
                    type: string
                  binding_code:
                    type: string
                  expires_at:
                    type: string
                    format: date-time
                  poll_url:
                    type: string
                    format: uri
    Unauthorized:
      description: 'Missing or invalid organization key (or its organization is suspended)'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: 'The current app permissions or machine key role lack the required capability, or the credential lacks the required scope'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    MailFailed:
      description: 'The mail server refused the invitation (`mail_failed`). A new invitation is withdrawn, so trying again works; a re-sent one is kept.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: 'No such resource in this organization'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: |
        A request with this `Idempotency-Key` is still being processed (`idempotency_in_progress`).
        Retry shortly.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableEntity:
      description: |
        Validation failed (`error: validation_failed`, with a field-keyed `errors` map),
        or the request was well-formed but refused for a domain reason — a taken email,
        a reached plan limit.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: |
        The key's rate limit for this plane is exhausted. The bucket is keyed on the API
        KEY, so this reflects only your own traffic.
      headers:
        Retry-After:
          description: 'Seconds to wait before retrying.'
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    VerificationResend:
      type: object
      required:
        - outcome
        - message
      properties:
        outcome:
          type: string
          enum:
            - sent
            - already_provisioned
        message:
          type: string
    Organization:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        status:
          type: string
          enum:
            - active
            - suspended
    Project:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        status:
          type: string
          enum:
            - active
            - suspended
        environment_limit:
          type: integer
          description: 'Local per-project ceiling; creating environments also requires sufficient current Billing entitlement.'
        environments_used:
          type: integer
          description: 'Number of environments visible to the caller.'
    Environment:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        type:
          type: string
          enum:
            - production
            - sandbox
        status:
          type: string
        project_id:
          type: string
          description: 'The project (billing anchor) this environment belongs to.'
        domain:
          type:
            - string
            - 'null'
        issuer:
          type: string
          format: uri
          description: "The environment's own host — where its OIDC/environment API lives."
    Member:
      type: object
      properties:
        id:
          type: string
        email:
          type:
            - string
            - 'null'
          format: email
        name:
          type:
            - string
            - 'null'
        role:
          type: string
          enum:
            - owner
            - admin
            - developer
            - member
            - viewer
          description: 'Shared membership tier; only current owner implies app authority.'
        roles:
          type: array
          items:
            type: string
            enum:
              - admin
              - developer
              - billing
              - viewer
        roles_version:
          type: string
        status:
          type: string
          enum:
            - active
            - invited
            - suspended
        all_environments:
          type: boolean
        environment_ids:
          type: array
          items:
            type: string
        environment_access_version:
          type: string
    CreatedEnvironment:
      description: 'An environment, and — when the request asked for one — its first management key.'
      allOf:
        -
          $ref: '#/components/schemas/Environment'
        -
          type: object
          properties:
            initial_key:
              $ref: '#/components/schemas/EnvironmentKey'
    EnvironmentKey:
      type: object
      description: "A management key (`cbid_env_…`) of one of the organization's environments. `token` is present only in the answer that minted it, and `null` on an idempotent replay."
      required:
        - id
        - environment_id
        - name
        - scopes
      properties:
        id:
          type: string
        environment_id:
          type: string
        name:
          type: string
        prefix:
          type: string
        scopes:
          type: array
          items:
            type: string
        expires_at:
          type:
            - string
            - 'null'
          format: date-time
        token:
          type:
            - string
            - 'null'
          description: "The key's value. Shown once."
    WorkspaceKey:
      type: object
      description: 'An organization key (`cbid_ws_…`). `token` is present only in the answer that minted it, and `null` on an idempotent replay.'
      required:
        - id
        - name
        - role
      properties:
        id:
          type: string
        name:
          type: string
        prefix:
          type: string
        role:
          type: string
          enum:
            - owner
            - admin
            - developer
            - member
            - viewer
        scopes:
          type:
            - array
            - 'null'
          items:
            type: string
            enum:
              - 'id:organization:read'
              - 'id:projects:write'
              - 'id:environments:write'
              - 'id:members:read'
              - 'id:members:write'
              - 'id:environment-keys:write'
              - 'id:organization-keys:write'
              - 'id:organization:write'
              - 'id:billing:write'
          description: 'Null when the role alone bounds the key.'
        parent_key_id:
          type:
            - string
            - 'null'
          description: 'The key that minted it, if a key did. Revoking the parent revokes it.'
        created_by_type:
          type:
            - string
            - 'null'
          description: '`organization_member` or `organization_key` (`workspace_key` before v3); null for a key minted before this was recorded.'
        expires_at:
          type:
            - string
            - 'null'
          format: date-time
        revoked_at:
          type:
            - string
            - 'null'
          format: date-time
        last_used_at:
          type:
            - string
            - 'null'
          format: date-time
        token:
          type:
            - string
            - 'null'
          description: "The key's value. Shown once."
    TeamInvitation:
      type: object
      required:
        - id
        - email
        - roles
        - expires_at
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum:
            - admin
            - developer
            - member
            - viewer
        roles:
          type: array
          items:
            type: string
            enum:
              - admin
              - developer
              - billing
              - viewer
        app_role_label:
          type:
            - string
            - 'null'
        invited_by:
          type:
            - string
            - 'null'
          description: 'The person, or the API key, that sent it — by name.'
        invited_at:
          type:
            - string
            - 'null'
          format: date-time
        expires_at:
          type: string
          format: date-time
    TeamInvitationReceipt:
      type: object
      required:
        - id
        - email
        - roles
        - status
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        roles:
          type: array
          items:
            type: string
            enum:
              - admin
              - developer
              - billing
              - viewer
        status:
          type: string
          enum:
            - invited
    CustomDomain:
      type: object
      required:
        - domain
        - verified_at
        - pending
      properties:
        domain:
          type:
            - string
            - 'null'
          description: 'The verified domain serving the environment.'
        verified_at:
          type:
            - string
            - 'null'
          format: date-time
        pending:
          description: 'A domain waiting for its DNS proof, and the TXT record to publish.'
          oneOf:
            -
              type: object
              required:
                - domain
                - record_name
                - record_value
              properties:
                domain:
                  type: string
                record_name:
                  type: string
                record_value:
                  type: string
            -
              type: 'null'
    PageMeta:
      type: object
      description: 'Paging for a list response. `has_more` used to be returned with nothing to act on it — no page parameter and no cursor — so a caller told there was more had no way to ask for it. `next_page` is present exactly when `has_more` is true, so a client can loop without computing anything.'
      properties:
        limit:
          type: integer
        page:
          type: integer
          minimum: 1
        total:
          type: integer
          description: 'Present on lists that can count cheaply.'
        has_more:
          type: boolean
        next_page:
          type:
            - integer
            - 'null'
          description: 'Pass as `page` on the next request; absent on the last page.'
    Error:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          description: 'Stable machine code'
        message:
          type: string
          description: 'Human-readable explanation'
        request_id:
          type: string
          description: 'The id this request was served under, also sent as the X-Request-Id header. Quote it when reporting a problem.'
        errors:
          type: object
          description: |
            Present on `validation_failed` only: the offending request fields, each
            mapped to its messages.
          additionalProperties:
            type: array
            items:
              type: string
