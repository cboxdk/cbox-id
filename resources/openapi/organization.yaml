      description: |
        Requires scope `environments:write` and the `manage-environments` capability
        (`id:write` for human members, or current ownership). Danger: critical — with `initial_key` it mints a credential.

        With `initial_key`, the environment's first management key is minted in the same
        call and returned once as `initial_key.token` — enough for an agent holding one
        organization key to stand an environment up and start configuring it on the
        environment's own host. An idempotent replay returns `initial_key.token: null`.
      operationId: environments_create
      x-action: environments.create
      parameters:
        -
          $ref: '#/components/parameters/IdempotencyKey'
        -
          $ref: '#/components/parameters/CboxApproval'
        -
          name: Cbox-Organization
          in: header
          required: false
          description: 'Select the exact organization for a platform-root user token. Required when an unbound token can access multiple organizations. Must match an organization-bound token or organization key; never changes the credential authority.'
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  maxLength: 120
                type:
                  type: string
                  enum:
                    - production
                    - sandbox
                  default: production
                project_id:
                  type: string
                  description: "The project (billing anchor) to create the environment under. Defaults to the organization's first project when omitted."
                initial_key:
                  type:
                    - object
                    - 'null'
                  description: "Mint the environment's first management key in the same call."
                  required:
                    - name
                    - scopes
                  properties:
                    name:
                      type: string
                      maxLength: 120
                    scopes:
                      type: array
                      minItems: 1
                      items:
                        type: string
                      description: 'Environment-key scopes, for example `apis:write`.'
                    expires_at:
                      type:
                        - string
                        - 'null'
                      format: date-time
