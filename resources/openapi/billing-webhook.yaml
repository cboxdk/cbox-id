openapi: 3.1.0
info:
  title: Cbox ID billing notifications
  version: 1.0.0
paths:
  /billing/webhook:
    servers:
      - url: /api
    post:
      operationId: billingNotification
      summary: Queue an authoritative billing synchronization
      description: >-
        Sign timestamp + '.' + the raw request body with HMAC-SHA256 using the configured
        billing webhook secret. X-Cbox-Signature is t=unix_timestamp,v1=hex_digest.
        Timestamps must be within 300 seconds. Bodies are limited to 65536 bytes.
        Duplicate notifications are coalesced; state is fetched from Billing rather than trusted from the body.
      security:
        - BillingSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '202':
          description: Synchronization queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accepted'
        '401':
          description: Invalid or expired signature
        '404':
          description: Webhook not configured
        '413':
          description: Payload too large
        '429':
          description: Rate limit exceeded
components:
  schemas:
    Accepted:
      type: object
      required: [accepted]
      properties:
        accepted:
          type: boolean
          const: true
  securitySchemes:
    BillingSignature:
      type: apiKey
      in: header
      name: X-Cbox-Signature
