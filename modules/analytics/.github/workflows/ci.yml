name: CI

on:
  push:
    branches: [main]
    # Release tags too, so the SBOM freshness gate below actually runs where an
    # accurate supply-chain record matters.
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  qa:
    name: PHP ${{ matrix.php }} · Testbench ${{ matrix.testbench }}
    runs-on: [self-hosted, linux, x64, cbox]
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        testbench: ['10.*', '11.*']
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Constrain Testbench (Laravel major)
        run: composer require "orchestra/testbench:${{ matrix.testbench }}" --dev --no-update --no-interaction

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: QA gate (pint · phpstan · pest · license-check · audit)
        run: composer qa

      # The SBOM is derived from composer.lock, which differs per Laravel major, so
      # it is only generated on the canonical cell (latest PHP + latest major).
      - name: SBOM
        if: matrix.php == '8.4' && matrix.testbench == '11.*'
        run: composer sbom

      # An SBOM documents a RELEASE, so the strict gate lives on tags. But this is a
      # library: composer.lock is intentionally not committed, so CI resolves fresh
      # with `composer update` and will pick up any upstream patch published since
      # the maintainer last ran `composer sbom`. An EXACT-match gate is therefore
      # unwinnable, and a gate that cannot be satisfied is one people learn to
      # ignore. So compare the dependency SET, not the resolved versions: that still
      # catches what provenance cares about — a dependency added or removed without
      # regenerating the SBOM — while tolerating the patch drift the lockfile-less
      # model guarantees. Same idiom as cboxdk/laravel-id, whose ci.yml records the
      # release this gate shape was learned from.
      - name: SBOM dependency set is up to date (release tags)
        if: matrix.php == '8.4' && matrix.testbench == '11.*' && startsWith(github.ref, 'refs/tags/')
        run: |
          git show HEAD:sbom.json > /tmp/sbom-committed.json
          jq -r '[.components[] | .group + "/" + .name] | sort | .[]' /tmp/sbom-committed.json > /tmp/set-committed.txt
          jq -r '[.components[] | .group + "/" + .name] | sort | .[]' sbom.json > /tmp/set-resolved.txt
          if ! diff -u /tmp/set-committed.txt /tmp/set-resolved.txt; then
            echo "::error::sbom.json lists a different dependency SET than this release resolves — a dependency was added or removed without regenerating it. Run 'composer sbom' and commit before tagging."
            exit 1
          fi

      - name: SBOM drift (informational)
        if: matrix.php == '8.4' && matrix.testbench == '11.*' && !startsWith(github.ref, 'refs/tags/')
        run: |
          git diff --quiet sbom.json \
            || echo "::notice::sbom.json drifted from the current resolve (usually an upstream patch release). Run 'composer sbom' before the next tag."

      - name: Upload SBOM
        if: matrix.php == '8.4' && matrix.testbench == '11.*'
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.json
