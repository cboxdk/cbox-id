name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ---------------------------------------------------------------------------
  # HOW THIS WORKFLOW IS LAID OUT, AND WHY
  #
  # Every merge to main waits for the slowest job here before the release CronJob in
  # cbox-infra deploys it (infra/kubernetes/cbox-id/release.yaml: it releases a commit
  # once EVERY check run on it has completed and none failed; it does not read job
  # names). So the jobs run side by side and none of them waits on another: keep it that
  # way. A job behind a `needs:` is not guaranteed to have a check run before its
  # dependency finishes, and in that gap every check that does exist can be green.
  #
  # The suite used to run in one PHP process per job and took 53 minutes of a ~67 minute
  # run. Two things made it slow, and neither was the tests:
  #
  #  1. The dev image loads Xdebug in develop,debug,coverage mode. Measured in this image
  #     on tests/Feature/Crawl: 229 s as shipped, 50 s with Xdebug off. Pint, at 569 s,
  #     was the same story. .github/php/ci.ini turns it off and OPcache on.
  #  2. One process for ~5,900 tests. The Unit and Feature suites now run in two halves
  #     on two runners per database, each half under `pest --parallel` with one worker
  #     per core, as they already do on a developer's machine.
  #
  # Every check that ran before still runs: lint and static analysis in `lint`, the Unit
  # and Feature suites on sqlite in `test` (two halves), the browser suite (axe-core,
  # smoke, visual baselines) in `browser` (in one process: see that job), and the Unit and
  # Feature suites again on each server engine (two halves each).
  # ---------------------------------------------------------------------------
  lint:
    # GITHUB-HOSTED, ALWAYS. The repository is public, so GitHub's runners cost nothing
    # here, and an ephemeral runner is the only safe place for a pull request's code:
    # `composer install`, `npm ci` and the suite all execute code from the branch. The
    # org's own runners are for private repositories only.
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cboxdk/php-baseimages/php-cli:8.5-bookworm-dev-v1

    steps:
      - uses: actions/checkout@v4

      - name: Tune PHP for CI (Xdebug off, OPcache on)
        run: cp .github/php/ci.ini /usr/local/etc/php/conf.d/zz-ci.ini && php --ini | grep zz-ci

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # Larastan boots the application, which wants an encryption key.
      - name: Prepare environment
        run: |
          cp .env.example .env || true
          php artisan key:generate --force

      - name: Lint (Pint)
        run: vendor/bin/pint --test

      # --memory-limit is not optional: PHPStan's own default is 128M, which this
      # analysis blows through. Without it the step passes only on a runner whose
      # php.ini happens to set memory_limit=-1, and OOMs everywhere else.
      - name: Static analysis (PHPStan/Larastan)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=2G

  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # ONE PHP, the one that ships: the image (Dockerfile), the local manifest (cbox.yaml),
        # composer.json's `require.php` and `config.platform.php` are all 8.5. This is a
        # deployed application, not a library; a cell for a version it never runs on
        # tests a deployment nobody has.
        php: ['8.5']
        # THE SUITE IN TWO HALVES, each on its own runner, each half under `--parallel`.
        # Pest splits by test class using the timings in tests/.pest/shards.json, so the
        # halves take about as long as each other; a class that file does not know yet is
        # dealt round-robin and Pest prints a WARN — refresh it with
        # `vendor/bin/pest --testsuite=Unit,Feature --parallel --update-shards` now and then.
        # The two halves together are the whole suite, whatever the file says: it only
        # decides which half a class lands in.
        shard: [1, 2]

    # The toolchain is the cbox base image's dev tier, not a stack of setup actions: PHP,
    # Composer, Node 22 and Playwright's Chromium are baked in, pinned by the `-v1` release
    # channel.
    container:
      image: ghcr.io/cboxdk/php-baseimages/php-cli:${{ matrix.php }}-bookworm-dev-v1

    steps:
      - uses: actions/checkout@v4

      - name: Tune PHP for CI (Xdebug off, OPcache on)
        run: cp .github/php/ci.ini /usr/local/etc/php/conf.d/zz-ci.ini && php --ini | grep zz-ci

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # The Feature suite renders the console layout, which resolves the Vite manifest.
      - name: Install Node dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env || true
          php artisan key:generate --force

      # One worker per core, each with its own sqlite :memory: database. The OpenAPI,
      # actions-reference and i18n drift checks are tests in this suite
      # (OpenApiBuildTest, ActionsReferenceTest, HostedPageLanguageTest), so they run here.
      - name: Tests (Unit + Feature, parallel, half ${{ matrix.shard }} of 2)
        run: vendor/bin/pest --testsuite=Unit,Feature --parallel --shard=${{ matrix.shard }}/2

  browser:
    runs-on: ubuntu-latest

    # `browser` RUNS IN THE IMAGE `.github/workflows/visual-baselines.yml` draws the
    # baselines in — the same php-cli 8.5 dev image as every job here. A baseline is a
    # picture of ONE renderer, so judging it in another would fail for reasons nobody can
    # act on. (It once ran on a self-hosted runner for pushes to main while the baselines
    # were drawn on ubuntu-latest, and failed on every push for that alone.) Pictures drawn
    # on a maintainer's macOS/arm64 laptop fail on Linux/x64 too (text rasterises
    # differently, the pinned font is substituted). This job judges against pictures from
    # its own kind of machine. Turning Xdebug off changes nothing a browser draws.
    #
    # WHEN ONE GOES RED: open the diff before regenerating anything. Regenerating a
    # baseline because a test failed, without looking, is how a visual suite becomes a
    # rubber stamp. If the new picture is the one you meant, run the Visual baselines
    # workflow and commit what it uploads.
    container:
      image: ghcr.io/cboxdk/php-baseimages/php-cli:8.5-bookworm-dev-v1

    steps:
      - uses: actions/checkout@v4

      - name: Tune PHP for CI (Xdebug off, OPcache on)
        run: cp .github/php/ci.ini /usr/local/etc/php/conf.d/zz-ci.ini && php --ini | grep zz-ci

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install Node dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env || true
          php artisan key:generate --force

      # `docs-screenshots` IS EXCLUDED. It rewrites docs/screenshots/*.png
      # (tests/Browser/DocsScreenshotsTest.php), and runs in its own workflow on every
      # release tag (docs-screenshots.yml), which proposes the pictures as a pull request.
      # The pull-request half — every picture embedded, present and retaken — is
      # DocsScreenshotsCatalogueTest, which runs in `test`. phpunit.xml excludes it too, but
      # a `--exclude-group` on the command line REPLACES the XML's list rather than adding
      # to it, so naming it here keeps it out if a flag is ever added. One flag per group:
      # Pest reads `--exclude-group=a,b` as a single group with a comma in its name.
      #
      # ONE PROCESS, NOT `--parallel`. Pest can run browser tests in parallel, and on this
      # runner it bought little (156 s against roughly as long in one process) while two
      # tests that pass in one process failed: axe caught a toast mid fade-in (contrast
      # 3.36) and a list was read before the delete's redirect had landed. Four Chromiums
      # and four PHP servers on four cores make every wait in the suite a race. This job is
      # not the longest one, so it keeps the timing the suite was written against.
      - name: Tests (Browser — axe-core a11y, real-browser smoke, visual)
        run: vendor/bin/pest --testsuite=Browser --exclude-group=docs-screenshots

  # ---------------------------------------------------------------------------
  # SUPPLY CHAIN — its own job so it ALWAYS runs.
  #
  # These steps used to sit at the end of `test`, after the suite. When a screenshot
  # baseline drifted, the suite failed first and the licence gate, the vulnerability
  # audit and the SBOM drift check were simply skipped — on main, for every push, while
  # the badge only said "tests failed". A known-vulnerable dependency then sat in the
  # lock file unreported. Nothing here needs the suite, a browser or built assets, so
  # nothing about the suite may stop it.
  # ---------------------------------------------------------------------------
  supply-chain:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cboxdk/php-baseimages/php-cli:8.5-bookworm-dev-v1

    steps:
      - uses: actions/checkout@v4

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: License gate (permissive-only dependencies)
        run: composer license-check

      - name: Supply-chain audit (known vulnerabilities)
        run: composer audit --no-dev

      - name: SBOM not stale (CycloneDX drift check)
        run: |
          composer sbom
          git diff --exit-code sbom.json

  # ---------------------------------------------------------------------------
  # SERVER ENGINES
  #
  # The job above runs the whole suite on sqlite :memory:, and until this job
  # existed that was the ONLY engine this application had ever been executed
  # against — production ran PostgreSQL and CI ran sqlite, so nothing tested what
  # was deployed. The framework it embeds (cboxdk/laravel-id) has its own engines
  # matrix and is green on MySQL; that proves the FRAMEWORK's migrations, not this
  # app's own migrations, its five console modules, or 53k lines of Livewire
  # queries.
  #
  # It matters because sqlite forgives what the servers do not: it accepts a
  # literal DEFAULT on a json column (MySQL: error 1101), enforces no index-key
  # size limit (InnoDB: 3072 bytes, and utf8mb4 charges 4 bytes a character), and
  # has no identifier length cap (MySQL 64, PostgreSQL 63). It is also
  # case-sensitive where MySQL's utf8mb4_unicode_ci is not.
  #
  # NB the suite really does follow DB_CONNECTION here: a process environment
  # variable takes precedence over phpunit.xml's <env>, so setting it below
  # redirects the whole run rather than silently leaving it on sqlite. Verified by
  # pointing it at a non-existent driver and watching the suite fail to resolve it
  # — worth re-checking if this job ever goes suspiciously green.
  #
  # GITHUB-HOSTED, like every job here. On a self-hosted runner that mounted the host's
  # Docker socket the job and its service landed on different networks, and this job
  # failed on `Connection refused` every time it ran.
  # ---------------------------------------------------------------------------
  engines:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        driver: [mysql, pgsql]
        # Two halves of the suite per engine, as in `test`.
        shard: [1, 2]
        include:
          # Kept green for self-hosters: MySQL is a supported production database.
          # Floored at 8.0.13 in the docs because that is where EXPRESSION column
          # defaults landed, which is the only spelling MySQL accepts for a json
          # default.
          - driver: mysql
            image: mysql:8.4
            port: 3306
            health: mysqladmin ping -h 127.0.0.1 -u root -proot
          # The deployment target: production (cboxid.com, on Cbox's Kubernetes cluster)
          # runs PostgreSQL 18, with the en_US.UTF-8 locale this image defaults to. The
          # local manifest (cbox.yaml, `resources.database`) states the same major, and
          # DeploymentManifestTest fails if it, this image and docs/requirements.md drift.
          - driver: pgsql
            image: postgres:18
            port: 5432
            health: pg_isready -U cbox_id -d cbox_id
    name: ${{ matrix.image }} (${{ matrix.shard }}/2)
    services:
      db:
        image: ${{ matrix.image }}
        # Both families' variables are set; each image ignores the other's.
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: cbox_id
          MYSQL_USER: cbox_id
          MYSQL_PASSWORD: secret
          POSTGRES_DB: cbox_id
          POSTGRES_USER: cbox_id
          POSTGRES_PASSWORD: secret
        options: >-
          --health-cmd "${{ matrix.health }}"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    # The same dev-tier image as `test`. The job runs in a container on the service
    # network, so the database is reached by its service name on its own port.
    container:
      image: ghcr.io/cboxdk/php-baseimages/php-cli:8.5-bookworm-dev-v1
    env:
      DB_CONNECTION: ${{ matrix.driver }}
      DB_HOST: db
      DB_PORT: ${{ matrix.port }}
      DB_DATABASE: cbox_id
      DB_USERNAME: cbox_id
      DB_PASSWORD: secret
    steps:
      - uses: actions/checkout@v4

      - name: Tune PHP for CI (Xdebug off, OPcache on)
        run: cp .github/php/ci.ini /usr/local/etc/php/conf.d/zz-ci.ini && php --ini | grep zz-ci

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # The Feature suite renders the console layout, which resolves the Vite
      # manifest — without built assets those tests fail on a missing manifest
      # rather than on anything to do with the database.
      - name: Install Node dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env || true
          php artisan key:generate --force

      # A fresh migrate on an empty database is exactly what a first deploy does,
      # and it is where the portability rules bite — json defaults, CHAR padding,
      # index key length, identifier length. Run it before the suite so a schema
      # failure reads as a schema failure instead of 700 test errors.
      - name: Migrate from empty (what a first deploy runs)
        run: php artisan migrate --force

      # THE PARALLEL WORKERS EACH GET A DATABASE OF THEIR OWN. Laravel's parallel testing
      # points worker N at `cbox_id_test_N` and creates it on first use, then migrates it
      # once (RefreshDatabase). The migration above stays on `cbox_id` itself, which is
      # what a first deploy migrates.
      #
      # PostgreSQL's POSTGRES_USER is a superuser and can create them. MySQL's
      # MYSQL_USER is granted its own database and nothing else, so root grants it the
      # test databases by name — the suite keeps running as the application's user,
      # not as root.
      - name: Let the app user create the per-worker test databases (MySQL)
        if: matrix.driver == 'mysql'
        run: |
          php <<'PHP'
          <?php
          $pdo = new PDO('mysql:host=db;port=3306', 'root', 'root');
          $pdo->exec("GRANT ALL PRIVILEGES ON `cbox\\_id\\_test\\_%`.* TO 'cbox_id'@'%'");
          echo "granted cbox_id_test_* to cbox_id\n";
          PHP

      # Browser tests are excluded on purpose: they need Chromium and prove
      # rendering, not persistence. This job is about the engine.
      - name: Tests (Unit + Feature, parallel, half ${{ matrix.shard }} of 2) on ${{ matrix.image }}
        run: vendor/bin/pest --testsuite=Unit,Feature --parallel --shard=${{ matrix.shard }}/2
