name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A full run of any branch: Actions → CI → Run workflow.
  workflow_dispatch:

# A new push to a pull request cancels that pull request's older run. Runs on main, on a
# dispatch or on the schedule are never cancelled: each has a group of its own commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------------------
  # WHAT RUNS WHEN (decided 2026-11-18 for every Cbox service: Postgres only, no sqlite
  # lane; the full suite only where it gates a deploy)
  #
  #   push to main, workflow_dispatch   everything: lint, supply-chain, image-handoff,
  #                                     the whole Unit + Feature suite on Postgres in two
  #                                     halves, source-data-postgres and browser.
  #   pull_request                      the checks (lint with the frontend types and
  #                                     component tests, supply-chain, image-handoff,
  #                                     and security.yml), `pr-tests` (the tests the
  #                                     change touches, on Postgres, picked by
  #                                     bin/pr-tests.py), and `browser` only when the
  #                                     change touches the front end.
  #
  # A pull request can be green while a test it did not pick is red; main's full run is
  # the gate, and a branch that wants it first can dispatch this workflow.
  #
  # Every merge to main waits for the slowest job here before the release CronJob in
  # cbox-infra deploys it (infra/kubernetes/cbox-id/release.yaml: it releases a commit
  # once EVERY check run on it has completed and none failed; it does not read job
  # names). So on main the jobs run side by side and none of them waits on another: keep
  # it that way. A job behind a `needs:` is not guaranteed to have a check run before its
  # dependency finishes, and in that gap every check that does exist can be green. The
  # only `needs:` here are on `changes`, which is skipped the moment a push or dispatch
  # run starts, while every other job is still queued.
  #
  # The suite used to run in one PHP process per job and took 53 minutes of a ~67 minute
  # run. Two things made it slow, and neither was the tests:
  #
  #  1. The dev image loads Xdebug in develop,debug,coverage mode. Measured in this image
  #     on tests/Feature/Crawl: 229 s as shipped, 50 s with Xdebug off. Pint, at 569 s,
  #     was the same story. .github/php/ci.ini turns it off and OPcache on.
  #  2. One process for ~5,900 tests. The Unit and Feature suites now run in two halves
  #     on two runners, each half under `pest --parallel` with one worker per core, as
  #     they already do on a developer's machine.
  # ---------------------------------------------------------------------------
  lint:
    # GITHUB-HOSTED, ALWAYS. The repository is public, so GitHub's runners cost nothing
    # here, and an ephemeral runner is the only safe place for a pull request's code:
    # `composer install`, `npm ci` and the suite all execute code from the branch. The
    # org's own runners are for private repositories only.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: ghcr.io/cboxdk/php-baseimages/php-cli:8.5-trixie-dev-v2

    steps:
      - uses: actions/checkout@v4

      - name: Tune PHP for CI (Xdebug off, OPcache on)
        run: cp .github/php/ci.ini /usr/local/etc/php/conf.d/zz-ci.ini && php --ini | grep zz-ci

      - name: Install PHP dependencies
        run: |
          php bin/verify-signals-sdk.php
          sh bin/install-ci-dependencies.sh --no-interaction --prefer-dist --no-progress

      # Larastan boots the application, which wants an encryption key.
      - name: Prepare environment
        run: |
          cp .env.example .env || true
          php artisan key:generate --force

      - name: Lint (Pint)
        run: vendor/bin/pint --test

      # --memory-limit is not optional: PHPStan's own default is 128M, which this
      # analysis blows through. Without it the step passes only on a runner whose
      # php.ini happens to set memory_limit=-1, and OOMs everywhere else.
      - name: Static analysis (PHPStan/Larastan)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=2G

      # Here and not in `browser`, because every pull request runs it: the route types
      # are generated from the PHP routes and controllers (Wayfinder), so a backend change
      # can break the frontend's types without touching a .tsx file.
      - name: Install Node dependencies
        run: npm ci

      - name: Frontend types and component tests
        run: |
          node --test bin/lib/wayfinder-compat.test.mjs
          npm run typecheck
          npm test

  browser:
    # On a pull request only when it touches the front end (bin/pr-tests.py --frontend).
    # `always()` because `changes` is skipped on main and dispatch, and a skipped `needs:`
    # would otherwise skip this job too.
    needs: changes
    if: always() && (github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # `browser` RUNS IN THE IMAGE `.github/workflows/visual-baselines.yml` draws the
    # baselines in — the same php-cli 8.5 dev image as every job here. A baseline is a
    # picture of ONE renderer, so judging it in another would fail for reasons nobody can
    # act on. (It once ran on a self-hosted runner for pushes to main while the baselines
    # were drawn on ubuntu-latest, and failed on every push for that alone.) Pictures drawn
    # on a maintainer's macOS/arm64 laptop fail on Linux/x64 too (text rasterises
    # differently, the pinned font is substituted). This job judges against pictures from
    # its own kind of machine. Turning Xdebug off changes nothing a browser draws.
    #
    # WHEN ONE GOES RED: open the diff before regenerating anything. Regenerating a
    # baseline because a test failed, without looking, is how a visual suite becomes a
    # rubber stamp. If the new picture is the one you meant, run the Visual baselines
    # workflow and commit what it uploads.
    container:
      image: ghcr.io/cboxdk/php-baseimages/php-cli:8.5-trixie-dev-v2

    steps:
      - uses: actions/checkout@v4

      - name: Tune PHP for CI (Xdebug off, OPcache on)
        run: cp .github/php/ci.ini /usr/local/etc/php/conf.d/zz-ci.ini && php --ini | grep zz-ci

      - name: Install PHP dependencies
        run: |
          php bin/verify-signals-sdk.php
          sh bin/install-ci-dependencies.sh --no-interaction --prefer-dist --no-progress

      - name: Install Node dependencies
        run: npm ci

      # The base image can ship a newer browser than our locked Playwright expects.
      - name: Install the locked Chromium browser
        run: npx playwright install chromium

      - name: Build assets
        run: npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env || true
          php artisan key:generate --force

      # `docs-screenshots` IS EXCLUDED. It rewrites docs/screenshots/*.png
      # (tests/Browser/DocsScreenshotsTest.php), and runs in its own workflow on every
      # release tag (docs-screenshots.yml), which proposes the pictures as a pull request.
      # The pull-request half — every picture embedded, present and retaken — is
      # DocsScreenshotsCatalogueTest, which runs in `engines` and on every pull request. phpunit.xml excludes it too, but
      # a `--exclude-group` on the command line REPLACES the XML's list rather than adding
      # to it, so naming it here keeps it out if a flag is ever added. One flag per group:
      # Pest reads `--exclude-group=a,b` as a single group with a comma in its name.
      #
      # ONE PROCESS, NOT `--parallel`. Pest can run browser tests in parallel, and on this
      # runner it halved the step (156 s against 313 s in one process), but two tests that
      # pass in one process failed: axe caught a toast mid fade-in (contrast 3.36) and a
      # list was read before the delete's redirect had landed. Four Chromiums and four PHP
      # servers on four cores make every wait in the suite a race. In one process this job
      # finishes with the slowest Postgres half (~12 minutes), so it costs the wall time
      # nothing and keeps the timing the suite was written against. If it becomes the
      # longest job, fix those waits before reaching for `--parallel` here.
      - name: Tests (Browser — axe-core a11y, real-browser smoke, visual)
        run: vendor/bin/pest --testsuite=Browser --exclude-group=docs-screenshots

      - name: Keep the visual diff when a browser comparison fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-visual-diff
          path: tests/Browser/Screenshots/ImageDiffView/*.html
          if-no-files-found: ignore
          retention-days: 3


  # ---------------------------------------------------------------------------
  # SUPPLY CHAIN — its own job so it ALWAYS runs.
  #
  # These steps used to sit at the end of `test`, after the suite. When a screenshot
  # baseline drifted, the suite failed first and the licence gate, the vulnerability
  # audit and the SBOM drift check were simply skipped — on main, for every push, while
  # the badge only said "tests failed". A known-vulnerable dependency then sat in the
  # lock file unreported. Nothing here needs the suite, a browser or built assets, so
  # nothing about the suite may stop it.
  # ---------------------------------------------------------------------------
  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: ghcr.io/cboxdk/php-baseimages/php-cli:8.5-trixie-dev-v2

    steps:
      - uses: actions/checkout@v4

      - name: Install PHP dependencies
        run: |
          php bin/verify-signals-sdk.php
          sh bin/install-ci-dependencies.sh --no-interaction --prefer-dist --no-progress

      - name: License gate (permissive-only dependencies)
        run: composer license-check

      - name: Supply-chain audit (known vulnerabilities)
        run: composer audit --no-dev

      - name: SBOM not stale (CycloneDX drift check)
        run: |
          composer sbom
          git diff --exit-code sbom.json

  # ---------------------------------------------------------------------------
  # THE SUITE, ON POSTGRESQL — the engine production runs. There is no sqlite lane
  # (removed 2026-11-18): sqlite forgives what PostgreSQL does not (identifier length 63,
  # strict types in comparisons, transactions that abort on the first error), so a
  # green sqlite run proved nothing about what is deployed.
  #
  # PostgreSQL is the only supported engine. Cbox ID is a hosted service; MySQL was
  # tested for self-hosting, which is dropped (2026-11-09).
  #
  # NB the suite really does follow DB_CONNECTION here: a process environment
  # variable takes precedence over phpunit.xml's <env>, so setting it below
  # redirects the whole run rather than silently leaving it on phpunit.xml's default. Verified by
  # pointing it at a non-existent driver and watching the suite fail to resolve it
  # — worth re-checking if this job ever goes suspiciously green.
  #
  # GITHUB-HOSTED, like every job here. On a self-hosted runner that mounted the host's
  # Docker socket the job and its service landed on different networks, and this job
  # failed on `Connection refused` every time it ran.
  # ---------------------------------------------------------------------------
  engines:
    # The full suite: main (it gates the deploy) and workflow_dispatch. A pull request
    # runs `pr-tests` instead.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        driver: [pgsql]
        # THE SUITE IN TWO HALVES, each on its own runner, each half under `--parallel`.
        # Pest splits by test class using the timings in tests/.pest/shards.json, so the
        # halves take about as long as each other; a class that file does not know yet is
        # dealt round-robin and Pest prints a WARN — refresh it with
        # `vendor/bin/pest --testsuite=Unit,Feature --parallel --update-shards` now and then.
        shard: [1, 2]
        include:
          # The deployment target: production (cboxid.com, on Cbox's Kubernetes cluster)
          # runs PostgreSQL 18, with the en_US.UTF-8 locale this image defaults to. The
          # local manifest (cbox.yaml, `resources.database`) states the same major, and
          # DeploymentManifestTest fails if it, this image and docs/requirements.md drift.
          - driver: pgsql
            image: postgres:18
            port: 5432
            health: pg_isready -U cbox_id -d cbox_id
    name: ${{ matrix.image }} (${{ matrix.shard }}/2)
    services:
      db:
        image: ${{ matrix.image }}
        env:
          POSTGRES_DB: cbox_id
          POSTGRES_USER: cbox_id
          POSTGRES_PASSWORD: secret
        options: >-
          --health-cmd "${{ matrix.health }}"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      # The rate limiter's one-round-trip path is a Lua script, so it is tested against a
      # real server (tests/Feature/ThrottleInOneRoundTripTest.php). Production runs Valkey 8.
      # Only that test reads it: the suite's own cache stays the array store.
      valkey:
        image: valkey/valkey:8
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    # The cbox base image's dev tier, like every job here. The job runs in a container on the service
    # network, so the database is reached by its service name on its own port.
    container:
      image: ghcr.io/cboxdk/php-baseimages/php-cli:8.5-trixie-dev-v2
    env:
      DB_CONNECTION: ${{ matrix.driver }}
      DB_HOST: db
      DB_PORT: ${{ matrix.port }}
      DB_DATABASE: cbox_id
      DB_USERNAME: cbox_id
      DB_PASSWORD: secret
      THROTTLE_TEST_REDIS_HOST: valkey
    steps:
      - uses: actions/checkout@v4

      - name: Tune PHP for CI (Xdebug off, OPcache on)
        run: cp .github/php/ci.ini /usr/local/etc/php/conf.d/zz-ci.ini && php --ini | grep zz-ci

      - name: Install PHP dependencies
        run: |
          php bin/verify-signals-sdk.php
          sh bin/install-ci-dependencies.sh --no-interaction --prefer-dist --no-progress

      # The Feature suite renders the console layout, which resolves the Vite
      # manifest — without built assets those tests fail on a missing manifest
      # rather than on anything to do with the database.
      - name: Install Node dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env || true
          php artisan key:generate --force

      # A fresh migrate on an empty database is exactly what a first deploy does,
      # and it is where the portability rules bite — json defaults, CHAR padding,
      # index key length, identifier length. Run it before the suite so a schema
      # failure reads as a schema failure instead of 700 test errors.
      - name: Migrate from empty (what a first deploy runs)
        run: php artisan migrate --force

      # THE PARALLEL WORKERS EACH GET A DATABASE OF THEIR OWN. Laravel's parallel testing
      # points worker N at `cbox_id_test_N` and creates it on first use, then migrates it
      # once (RefreshDatabase). The migration above stays on `cbox_id` itself, which is
      # what a first deploy migrates.
      #
      # POSTGRES_USER is a superuser, so it can create them.

      # Browser tests are excluded on purpose: they need Chromium and prove
      # rendering, not persistence. This job is about the engine.
      - name: Tests (Unit + Feature, parallel, half ${{ matrix.shard }} of 2) on ${{ matrix.image }}
        run: vendor/bin/pest --testsuite=Unit,Feature --parallel --shard=${{ matrix.shard }}/2

  # ---------------------------------------------------------------------------
  # PULL REQUESTS: THE TESTS THE CHANGE TOUCHES
  #
  # `changes` reads the pull request's diff and asks bin/pr-tests.py which test files it
  # touches (edited, or naming a class it edits, plus the generated-file drift guards)
  # and whether it touches the front end. It runs on the host because the PHP image has
  # no python3, and hands `pr-tests` a phpunit.xml whose suites are just those files.
  # ---------------------------------------------------------------------------
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.pick.outputs.frontend }}
      config: ${{ steps.pick.outputs.config }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The base and head arrive through the environment, never spliced into the script.
      - name: Pick the tests
        id: pick
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only "$(git merge-base "$BASE" "$HEAD")" "$HEAD" > changed.txt
          echo "Changed files:"; cat changed.txt
          echo "frontend=$(python3 bin/pr-tests.py --frontend < changed.txt)" >> "$GITHUB_OUTPUT"
          echo "Tests:"; python3 bin/pr-tests.py --phpunit phpunit.pr.xml < changed.txt
          {
            echo 'config<<PHPUNIT_PR_XML'
            cat phpunit.pr.xml
            echo 'PHPUNIT_PR_XML'
          } >> "$GITHUB_OUTPUT"

  pr-tests:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      db:
        image: postgres:18
        env:
          POSTGRES_DB: cbox_id
          POSTGRES_USER: cbox_id
          POSTGRES_PASSWORD: secret
        options: >-
          --health-cmd "pg_isready -U cbox_id -d cbox_id"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      valkey:
        image: valkey/valkey:8
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    container:
      image: ghcr.io/cboxdk/php-baseimages/php-cli:8.5-trixie-dev-v2
    env:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: cbox_id
      DB_USERNAME: cbox_id
      DB_PASSWORD: secret
      THROTTLE_TEST_REDIS_HOST: valkey
    steps:
      - uses: actions/checkout@v4

      - name: Tune PHP for CI (Xdebug off, OPcache on)
        run: cp .github/php/ci.ini /usr/local/etc/php/conf.d/zz-ci.ini && php --ini | grep zz-ci

      - name: Install PHP dependencies
        run: |
          php bin/verify-signals-sdk.php
          sh bin/install-ci-dependencies.sh --no-interaction --prefer-dist --no-progress

      # The Feature suite renders the console layout, which resolves the Vite manifest.
      - name: Install Node dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Prepare environment
        env:
          CONFIG: ${{ needs.changes.outputs.config }}
        run: |
          cp .env.example .env || true
          php artisan key:generate --force
          printf '%s\n' "$CONFIG" > phpunit.pr.xml

      - name: Migrate from empty (what a first deploy runs)
        run: php artisan migrate --force

      - name: Tests the change touches (parallel)
        run: vendor/bin/pest -c phpunit.pr.xml --testsuite=PR --parallel

      # SourceCommitOrderTest commits real transactions, so it runs in one process, as
      # `source-data-postgres` runs it on main. An empty suite passes.
      - name: Postgres integration tests the change touches
        run: vendor/bin/pest -c phpunit.pr.xml --testsuite=Integration --do-not-fail-on-empty-test-suite

  source-data-postgres:
    # On a pull request `pr-tests` runs these two files when the change touches them.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: ghcr.io/cboxdk/php-baseimages/php-cli:8.5-trixie-dev-v2
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: source_test
          POSTGRES_PASSWORD: source_test
          POSTGRES_DB: source_test
        options: >-
          --health-cmd "pg_isready -U source_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: source_test
      DB_USERNAME: source_test
      DB_PASSWORD: source_test
    steps:
      - uses: actions/checkout@v4
      - name: Install exact dependencies
        run: |
          php bin/verify-signals-sdk.php
          sh bin/install-ci-dependencies.sh --no-interaction --prefer-dist --no-progress
      - name: Prepare isolated test environment
        run: |
          cp .env.example .env
          php artisan key:generate --force
      - name: Qualify source transactions and public feed on PostgreSQL
        run: vendor/bin/pest tests/Integration/SourceCommitOrderTest.php tests/Feature/SignalsSourceTest.php

  image-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify immutable multi-architecture image handoff
        run: python3 .github/tests/test_image_handoff.py
