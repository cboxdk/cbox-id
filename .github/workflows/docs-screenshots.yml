# RETAKE THE DOCUMENTATION'S SCREENSHOTS FROM THE RELEASED PRODUCT, AND PROPOSE THEM.
#
# docs/screenshots/*.png are pictures of the console, embedded throughout docs/. They are
# taken by tests/Browser/DocsScreenshotsTest.php (group `docs-screenshots`) from the running
# app over the demo world DemoEnvironmentSeeder builds. That used to be a command somebody
# had to remember; the pictures drifted from the product while nobody did.
#
# So every release tag retakes them, and so can anyone, on demand (Actions → Docs
# screenshots → Run workflow). The run:
#
#   1. builds the app in the SAME image CI's `test` job and the visual baselines use — the
#      cbox base image's dev tier, Playwright's Chromium baked in, pinned by `-v1` — so a
#      picture is drawn by one renderer, every time, and a retake changes only what the
#      product changed;
#   2. takes every picture in Tests\Support\DocsScreenshots::NAMES. The run is also a smoke
#      test of every page the docs show: it FAILS — and proposes nothing — when a page
#      answers an error status, loads anything that 4xx/5xx's, shows an error page, or the
#      browser reports an uncaught exception, a console error or warning, or a broken image;
#   3. opens (or updates) a pull request against main with the pictures that changed.
#
# IT NEVER PUSHES TO MAIN. Merging to main is a production deploy, and a picture is
# reviewed by eye in the PR's diff like any other change to the docs. When nothing changed,
# no PR is opened.
#
# A pull request opened with the workflow's own token does not start other workflows (a
# GitHub rule that stops workflows triggering each other). CI on it therefore needs a nudge
# — close and reopen it — before it can be merged; the run that drew the pictures has
# already exercised every page in them.
name: Docs screenshots

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# One retake at a time: two tags pushed together would race for the same branch.
concurrency:
  group: docs-screenshots
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    # The SAME image ci.yml's `test` job and visual-baselines.yml draw in. A picture drawn
    # anywhere else is a picture of a different renderer.
    container:
      image: ghcr.io/cboxdk/php-baseimages/php-cli:8.5-bookworm-dev-v1
    steps:
      - uses: actions/checkout@v4

      # The job runs in a container whose user does not own the checkout, and git refuses
      # to work in a repository another user owns. create-pull-request runs git here.
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: npm ci
      # The browser loads whatever is in public/build: the pictures are of THIS checkout's
      # frontend only if it is built from this checkout.
      - run: npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env || true
          php artisan key:generate --force

      # Named by group, which takes it back off phpunit.xml's exclude list. The run writes
      # docs/screenshots/*.png in place; its last test fails if any picture on the list was
      # not taken by this run.
      - name: Take the screenshots
        run: vendor/bin/pest --group=docs-screenshots

      - name: Propose the pictures that changed
        uses: peter-evans/create-pull-request@v7
        with:
          # Against main, also when the run was started by a tag (a detached checkout).
          base: main
          branch: docs/screenshots-${{ github.ref_name }}
          delete-branch: true
          add-paths: docs/screenshots/*.png
          commit-message: Retake the documentation screenshots (${{ github.ref_name }})
          title: Retake the documentation screenshots (${{ github.ref_name }})
          body: |
            Taken by the **Docs screenshots** workflow from `${{ github.ref_name }}` (${{ github.sha }}), in the same image and Chromium CI uses, over the demo world `DemoEnvironmentSeeder` builds.

            Every page in these pictures rendered without an error status, a failed request, an error page, a console error or a broken image — the run fails otherwise and opens no PR.

            Review the image diff: the pictures should differ only where the product did. Relative dates ("2 minutes ago") are expected to move.

            This PR was opened with the workflow's token, which does not start CI. Close and reopen it to run the checks before merging — **merging to main deploys to production**.
