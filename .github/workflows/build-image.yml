name: Build Image

# Builds the cbox-id runtime image FROM the public cbox php-fpm-nginx base and
# pushes it to ghcr.io/cboxdk/cbox-id for linux/amd64 and linux/arm64. Runs on
# GitHub-hosted runners: the repository is public, so they cost nothing, and the
# org's own runners are for private repositories. Each architecture builds natively
# (QEMU-emulated arm64 blew the timeout) and is pushed by digest; `merge` joins
# them into one multi-arch manifest under the tags.
# No secrets: all deps are public, push uses the built-in GITHUB_TOKEN.
#
# cboxid.com runs on arm64 (Cbox's cluster cbox-hel1, which releases the `main`
# image once every check on its commit has passed).

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/cboxdk/cbox-id

jobs:
  build:
    # Guarded so it never runs for a fork pull_request or a non-canonical repo:
    # this job holds `packages: write`.
    if: github.repository == 'cboxdk/cbox-id' && github.event_name != 'pull_request'
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The tags, so `git describe` below can name the release this commit is.
          fetch-depth: 0

      # The application's version (config `app.version`, APP_VERSION in the image): the
      # tag itself on a tag push (`2.0.0`), and the nearest tag plus how far past it on
      # main (`2.0.0-3-gabc1234`).
      - name: Version
        id: version
        run: echo "version=$(git describe --tags --always | sed 's/^v//')" >> "$GITHUB_OUTPUT"

      - name: Verify reviewed integration packages
        run: php bin/verify-signals-sdk.php

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # Pin buildkit v0.31.1 — v0.30 (buildx-stable-1) had an incomplete-push
          # bug that silently dropped a layer when gha cache export was on. See
          # infrastructure/docs/playbook-ci-runners.md.
          driver-opts: |
            image=moby/buildkit:v0.31.1
            network=host

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          provenance: mode=max
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.revision=${{ github.sha }}
            io.cbox.build.run-id=${{ github.run_id }}
            io.cbox.build.run-attempt=${{ github.run_attempt }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=cbox-id-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=cbox-id-${{ matrix.arch }}

      - name: Publish verified architecture handoff
        run: python3 .github/scripts/image_handoff.py publish
        env:
          ARCH: ${{ matrix.arch }}
          DIGEST: ${{ steps.build.outputs.digest }}

  merge:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Multi-arch manifest
        run: python3 .github/scripts/image_handoff.py merge
