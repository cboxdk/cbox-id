name: Build Image

# Builds the cbox-id runtime image FROM the public cbox php-fpm-nginx base and
# pushes it to ghcr.io/cboxdk/cbox-id. Runs on GitHub-hosted runners: the repository is
# public, so they cost nothing, and the org's own runners are for private repositories.
# No secrets: all deps are public, push uses the built-in GITHUB_TOKEN.

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Native amd64. Guarded so it never runs for a fork pull_request or a
    # non-canonical repo: this job holds `packages: write`.
    if: github.repository == 'cboxdk/cbox-id' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/cboxdk/cbox-id
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # Pin buildkit v0.31.1 — v0.30 (buildx-stable-1) had an incomplete-push
          # bug that silently dropped a layer when gha cache export was on. See
          # infrastructure/docs/playbook-ci-runners.md.
          driver-opts: |
            image=moby/buildkit:v0.31.1
            network=host

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # amd64 only: QEMU-emulated arm64 blows the timeout. GitHub's native
          # `ubuntu-24.04-arm` runners are free for public repositories, so arm64 can
          # come back as a second native job merged into one manifest.
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=cbox-id
          cache-to: type=gha,mode=max,scope=cbox-id
