; PHP settings for the CI jobs, copied into the dev image's conf.d by ci.yml.
;
; The dev tier of the cbox base image is a DEVELOPER'S image: it loads Xdebug in
; develop,debug,coverage mode and leaves OPcache off for the CLI. That is right on a
; laptop and wrong here. Measured in that image on tests/Feature/Crawl: 229 s with Xdebug
; as shipped, 50 s with it off, 46 s with OPcache on as well. Xdebug alone was most of
; the hour CI used to take. Nothing in CI reads coverage, and no debugger attaches.
xdebug.mode = off

; OPcache for the CLI keeps compiled code in shared memory instead of on the heap. The
; suite boots a fresh application for every test, re-including config and route files
; each time, and without OPcache each of those compilations stays on the heap until the
; process ends. With it, that per-test growth goes away.
opcache.enable_cli = 1

; The image is built for production, where code never changes under a running process,
; so it does not check timestamps. A test run writes PHP files (compiled Blade views) and
; can rewrite one inside a single process, so check on every include, as a PHP without
; OPcache would.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
