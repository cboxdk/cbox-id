# THE LOCAL MANIFEST — NOT THE PRODUCTION DEPLOYMENT.
#
# cbox-engine (the `cbox` CLI and the Cbox Local desktop app) reads this file to run Cbox ID
# on a developer's machine the way production runs it: a Kubernetes cluster in Docker, the
# working copy mounted into the pods (`source: true`), behind a gateway that terminates TLS
# one hop earlier, as the real one does. Run `cbox deploy` from this directory and open the
# address it prints (https://cbox-id.cbox.test:…); point CBOX_ID_ISSUER and the WebAuthn
# origin in `.env` at that address first.
#
# Production is NOT deployed from this file. cboxid.com runs on Cbox's own Kubernetes
# cluster, from manifests in the private infrastructure repository, and every commit on
# main whose checks pass is released there automatically: docs/operations/deployment.md.
# What this file mirrors is production's SHAPE, so a fault in that shape shows up here
# first: two web replicas that share every piece of state through Valkey, a queue manager
# and a scheduler beside them (production runs both in one worker pod, under cbox-init),
# PostgreSQL of the same major, and the proxy and cookie settings a gateway in front needs.
#
# Every key is one cbox-engine's ProjectManifestReader knows — it refuses any other — and
# tests/Feature/DeploymentManifestTest.php holds the file to that reader and to that shape.
# No secret is written here: APP_KEY, CBOX_ID_CRYPTO_KEY and the rest come from the working
# copy's own `.env`, which the mount brings along.
name: cbox-id
# The base image the production image (Dockerfile) is built FROM, so the PHP, extensions,
# nginx and cbox-init are production's; the code is the working copy rather than a build.
image: ghcr.io/cboxdk/php-baseimages/php-fpm-nginx:8.5-bookworm-v1
port: 80
source: true
url: APP_URL

# Two web replicas, as production runs, so anything that only works on one pod fails here
# too. EVERYTHING below that holds state is shared because of this line: rate limits,
# single-use handoff and magic-link tokens, replay guards and sessions all live in Valkey,
# never in a pod. CBOX_ID_REPLICAS (env) says the same number to the application, which
# cannot count its siblings — `cbox-id:doctor` fails a per-process cache or session store
# when it is more than one. Change the two together.
replicas: 2

processes:
  # The queue MANAGER, not a worker: it starts, sizes and stops the `queue:work`
  # processes itself (cboxdk/laravel-queue-autoscale). Production runs it under cbox-init
  # in the worker pod (CBOX_INIT_PROCESS_AUTOSCALER_ENABLED). See
  # docs/operations/queue-workers.md.
  queue: ["php", "artisan", "queue:autoscale"]
  # The SCHEDULER, which every background duty depends on: the domain-event relay behind
  # webhooks, outbound SCIM, the audit-stream pump, token revocation on role change and
  # pruning are all scheduled commands. Without this process none of them run and nothing
  # logs an error — /health/status (`scheduler`, `event_relay`) is what turns red.
  # Production runs it in the same worker pod (CBOX_INIT_PROCESS_SCHEDULER_ENABLED). One.
  scheduler: ["php", "artisan", "schedule:work"]

# Plain values only, and only the ones that make this the production shape. APP_ENV,
# APP_DEBUG, mail and the keys are the working copy's `.env` — a variable set here would
# override it.
env:
  # The pod's disk disappears with the pod; stderr is what the cluster collects.
  LOG_CHANNEL: stderr

  # This application trusts no proxy unless told to, deliberately — so behind a gateway it
  # must be told. Without it Laravel builds every URL from the request as the POD saw it:
  # `http`, because the gateway terminated the TLS one hop earlier, and every redirect and
  # mailed link goes out as http. The pod network, as in production.
  TRUSTED_PROXIES: "10.244.0.0/16"
  SESSION_SECURE_COOKIE: "true"

  # Said to the application as well as to the cluster (`replicas` above).
  CBOX_ID_REPLICAS: "2"

  # Cache, sessions and the queue in Valkey (wire-compatible with Redis). Its host and
  # port are the binding's variables under `resources.cache` — the service's NAME is the
  # engine's to choose and arrives in REDIS_HOST, never written here.
  #
  # THE QUEUE STORE MUST RUN `maxmemory-policy noeviction`. A queued job is data, not a
  # cache entry: under an evicting policy a full Valkey silently deletes jobs, and a
  # webhook, a back-channel logout or an invitation mail is simply never sent. Production's
  # Valkey runs noeviction; cache and queue share it, sized so the cache's TTL'd keys never
  # fill it. With noeviction a full instance REFUSES writes, which surfaces as an error
  # instead of a lost job.
  CACHE_STORE: redis
  SESSION_DRIVER: redis
  QUEUE_CONNECTION: redis
  REDIS_CLIENT: phpredis
  # Every queue manager coordinates through Valkey and one leader sizes the workers, so a
  # second manager does not double the worker count (config/queue-autoscale.php).
  QUEUE_AUTOSCALE_CLUSTER_ENABLED: "true"

  DB_CONNECTION: pgsql

  # The application, not nginx, owns the security response headers
  # (App\Http\Middleware\SecurityHeaders: CSP, HSTS, X-Frame-Options,
  # X-Content-Type-Options, Referrer-Policy, Permissions-Policy). The base image's nginx
  # adds its own copy of the four below by default, which sent each header TWICE with
  # conflicting values — and a browser takes the LAST Referrer-Policy, nginx's looser one.
  # Blank is the base image's off switch; the production image (Dockerfile) sets the same
  # four and also strips the directives in an init script, because the base entrypoint
  # still re-fills empty values (docs/operations/deployment.md, "Security headers"). There
  # is deliberately NO NGINX_HEADER_CONTENT_SECURITY_POLICY: nginx sends no CSP by default,
  # and the app's middleware is the one and only source of it.
  NGINX_HEADER_X_FRAME_OPTIONS: ""
  NGINX_HEADER_X_CONTENT_TYPE_OPTIONS: ""
  NGINX_HEADER_REFERRER_POLICY: ""
  NGINX_HEADER_PERMISSIONS_POLICY: ""

# Managed data. A binding names the variables this application reads; the engine resolves
# each to its own Secret, so no credential appears anywhere above. The binding's fields are
# the engine's (host, port, database, user, password, url — `user`, not `username`; the
# reader refuses any other spelling) and the variables on the right are this application's.
resources:
  database:
    engine: postgres
    # Production's major, stated so an engine release cannot move it. CI's `engines` job
    # runs the suite on the same major (.github/workflows/ci.yml); DeploymentManifestTest
    # fails if the two drift. Change them together, with production.
    version: "18"
    bind:
      host: DB_HOST
      port: DB_PORT
      database: DB_DATABASE
      user: DB_USERNAME
      password: DB_PASSWORD
  # The engine's Valkey has no password and is reachable only inside the project's own
  # network, so there is no REDIS_PASSWORD to bind — the reader refuses a `password`
  # binding for it. Production's Valkey has one, from its Secret.
  cache:
    engine: valkey
    bind:
      host: REDIS_HOST
      port: REDIS_PORT
